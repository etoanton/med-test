<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEK Quiz — Nostryfikacja ZG</title>
<style>
  /* ── NEW pagination & reset styles (prepended) ── */
  .pagination-wrap {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .pagination-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .pagination-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .pg-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    height: 28px;
    min-width: 28px;
    padding: 0 4px;
    text-align: center;
    transition: border-color 0.1s, background 0.1s, color 0.1s;
  }
  .pg-btn:hover { border-color: var(--accent); color: var(--text); }
  .pg-btn.pg-current { border-color: var(--accent); color: var(--accent); background: #181c38; }
  .pg-btn.pg-correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .pg-btn.pg-wrong   { background: var(--wrong-bg);   border-color: var(--wrong);   color: var(--wrong); }
  .pg-btn.pg-skipped { border-color: #6b4c10; color: #a16207; }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--wrong);
    cursor: pointer;
    font-size: 12px;
    padding: 5px 12px;
    transition: border-color 0.15s;
  }
  .reset-btn:hover { border-color: var(--wrong); }
  .save-indicator {
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .save-indicator.show { opacity: 1; }
  /* ── end new styles ── */
</style>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3248;
    --text: #e8eaf0;
    --text-muted: #8b90a8;
    --accent: #5b6ef5;
    --accent-dim: #3d4db5;
    --correct: #22c55e;
    --correct-bg: #052e16;
    --wrong: #ef4444;
    --wrong-bg: #2d0a0a;
    --hint-bg: #1e1a06;
    --hint-border: #a16207;
    --hint-text: #fde68a;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 20px;
  }
  .app { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header { padding: 24px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .header p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  /* Session selector */
  .session-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .session-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    padding: 14px 16px;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }
  .session-btn:hover { border-color: var(--accent); background: var(--surface2); }
  .session-btn.active { border-color: var(--accent); background: var(--surface2); }
  .session-btn .name { font-size: 14px; font-weight: 600; }
  .session-btn .count { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .session-btn.all-btn { border-style: dashed; }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 7px 14px;
    transition: color 0.15s, border-color 0.15s;
  }
  .ctrl-btn:hover { color: var(--text); border-color: var(--accent); }
  .ctrl-btn.active { color: var(--accent); border-color: var(--accent); }
  .ctrl-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .ctrl-btn.primary:hover { background: var(--accent-dim); }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }
  .progress-text { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .score-badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .score-badge.good { border-color: var(--correct); color: var(--correct); }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  .q-meta {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
  }
  .q-items {
    margin: 8px 0 4px 0;
    padding-left: 24px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
  }
  .q-items li {
    margin-bottom: 2px;
  }
  .q-type-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .option-btn {
    align-items: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    display: flex;
    font-size: 14px;
    gap: 12px;
    padding: 12px 16px;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #1f2438; }
  .option-btn:disabled { cursor: default; }
  .option-btn .letter {
    background: var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    min-width: 24px;
    padding: 4px 6px;
    text-align: center;
  }
  .option-btn .opt-text { line-height: 1.5; padding-top: 1px; }
  .option-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .option-btn.correct .letter { background: var(--correct); color: #fff; }
  .option-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .option-btn.wrong .letter { background: var(--wrong); color: #fff; }
  .option-btn.reveal-correct {
    border-color: var(--correct);
    opacity: 0.5;
  }

  /* Hint */
  .hint-box {
    background: var(--hint-bg);
    border: 1px solid var(--hint-border);
    border-radius: var(--radius);
    color: var(--hint-text);
    display: none;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 12px;
    padding: 14px 16px;
  }
  .hint-box.visible { display: block; }
  .hint-label { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 6px; opacity: 0.7; }

  /* Reveal answer (for text questions) */
  .reveal-answer {
    background: var(--correct-bg);
    border: 1px solid var(--correct);
    border-radius: var(--radius);
    color: var(--correct);
    display: none;
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
    padding: 14px 16px;
  }
  .reveal-answer.visible { display: block; }

  /* Navigation */
  .nav-row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
  }
  .nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    padding: 10px 20px;
    transition: border-color 0.15s;
  }
  .nav-btn:hover { border-color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.next-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .nav-btn.next-btn:hover { background: var(--accent-dim); }
  .skip-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 10px;
    text-decoration: underline;
  }
  .skip-btn:hover { color: var(--text); }

  /* Results */
  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
  }
  .results-card h2 { font-size: 22px; margin-bottom: 8px; }
  .results-card .big-score {
    font-size: 56px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin: 16px 0;
  }
  .results-card .score-detail { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .results-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .breakdown-item {
    background: var(--surface2);
    border-radius: 8px;
    padding: 14px;
  }
  .breakdown-item .val { font-size: 24px; font-weight: 700; }
  .breakdown-item .lbl { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .val.green { color: var(--correct); }
  .val.red { color: var(--wrong); }
  .val.grey { color: var(--text-muted); }

  /* Responsive */
  @media (max-width: 500px) {
    .session-grid { grid-template-columns: 1fr 1fr; }
    .results-breakdown { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>LEK Quiz — Nostryfikacja ZG</h1>
    <p>Wybierz sesję egzaminacyjną i zacznij ćwiczyć</p>
  </div>

  <!-- Session selector -->
  <div class="session-grid" id="sessionGrid"></div>

  <!-- Controls -->
  <div class="controls" id="controls" style="display:none">
    <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()">Losuj kolejność</button>
    <button class="ctrl-btn" id="wrongOnlyBtn" onclick="toggleWrongOnly()" style="display:none">Tylko błędne</button>
    <button class="ctrl-btn primary" id="startBtn" onclick="startQuiz()">Start</button>
    <button class="ctrl-btn primary" id="resumeBtn" onclick="resumeQuiz()" style="display:none">Kontynuuj →</button>
    <span style="flex:1"></span>
    <button class="reset-btn" id="resetBtn" onclick="clearProgress()" style="display:none">Resetuj postęp</button>
    <span id="qCount" style="font-size:13px;color:var(--text-muted);margin-left:8px"></span>
  </div>

  <!-- Quiz area -->
  <div id="quizArea" style="display:none">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText"></span>
      <span class="score-badge" id="scoreBadge">0 / 0</span>
    </div>

    <div class="question-card" id="questionCard">
      <div class="q-meta" id="qMeta"></div>
      <div class="q-text" id="qText"></div>
      <div id="qItems" style="display:none"></div>
      <div id="qTypeBadge"></div>
      <div class="options" id="optionsDiv"></div>
      <button class="ctrl-btn" id="revealBtn" onclick="revealAnswer()" style="margin-top:12px;display:none">Pokaż odpowiedź</button>
      <div class="reveal-answer" id="revealAnswer"></div>
      <div class="hint-box" id="hintBox">
        <div class="hint-label">HINT</div>
        <div id="hintText"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← Poprzednie</button>
      <span class="save-indicator" id="saveIndicator">Zapisano</span>
      <button class="skip-btn" onclick="skipQuestion()">Pomiń</button>
      <button class="nav-btn next-btn" id="nextBtn" onclick="navigate(1)" disabled>Następne →</button>
    </div>

    <div class="pagination-wrap" id="paginationWrap">
      <div class="pagination-label">Pytania</div>
      <div class="pagination-grid" id="paginationGrid"></div>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsArea" style="display:none">
    <div class="results-card">
      <h2>Wynik sesji</h2>
      <div class="big-score" id="resPct"></div>
      <div class="score-detail" id="resDetail"></div>
      <div class="results-breakdown" id="resBreakdown"></div>
      <button class="ctrl-btn primary" onclick="restartQuiz()" style="margin-right:8px">Powtórz wszystkie</button>
      <button class="ctrl-btn" onclick="restartWrong()">Powtórz błędne</button>
    </div>
  </div>
</div>

<script>
const SESSIONS = {"Lato 2026": [{"text": "Jaki lek NIE stosujemy w leczeniu dławicy Prinzmetala?", "hint": "W anginie Prinzmetala beta-blokery nasilaja skurcz naczyniowy - p/wskazane. Stosujemy Ca-blokery i azotany.", "options": [{"letter": "A", "text": "werapamil", "correct": false}, {"letter": "B", "text": "nitrogliceryna", "correct": false}, {"letter": "C", "text": "monoazotan izosorbidu", "correct": false}, {"letter": "D", "text": "bisoprolol", "correct": true}, {"letter": "E", "text": "diltiazem", "correct": false}], "type": "single"}, {"text": "Ciąża 40 tygodni — ile to dni?", "hint": "40 tygodni x 7 dni = 280 dni.", "options": [{"letter": "A", "text": "365", "correct": false}, {"letter": "B", "text": "300", "correct": false}, {"letter": "C", "text": "280", "correct": true}, {"letter": "D", "text": "260", "correct": false}], "type": "single"}, {"text": "62-letnia kobieta od 14 lat przyjmuje doustne leki na cukrzycę typu 2. Lekarz stwierdził nieskuteczność leczenia i chce dodać insulinę. Jaką dawkę początkową powinna wybrać?", "hint": "Dawka startowa insuliny bazalnej dodawanej do OAD = 0,1-0,2 j./kg m.c./dobe.", "options": [{"letter": "A", "text": "0,5 J/kg", "correct": false}, {"letter": "B", "text": "0,8 J/kg", "correct": false}, {"letter": "C", "text": "16 J", "correct": false}, {"letter": "D", "text": "5 J", "correct": false}, {"letter": "E", "text": "0,2 J/kg", "correct": true}], "type": "single"}, {"text": "Wysypka polimorficzna (pęcherzyki, plamki, grudki) opisywana jako „gwiaździste niebo\" jest charakterystyczna dla", "hint": "Ospa wietrzna: wysypka polimorficzna (plamki, grudki, pecherze, strupki jednoczesnie) = gwiezdziste niebo.", "options": [{"letter": "A", "text": "cukrzycy typu 1", "correct": false}, {"letter": "B", "text": "ospy wietrznej", "correct": true}, {"letter": "C", "text": "owsicy", "correct": false}, {"letter": "D", "text": "skoliozy", "correct": false}, {"letter": "E", "text": "niedoczynności tarczycy", "correct": false}], "type": "s  false}, {"letter": "B", "text": "palenie wyrobów tytoniowych.", "correct": true}, {"letter": "C", "text": "częste przeziębienia w dzieciństwie.", "correct": false}, {"letter": "D", "text": "siedzący tryb życia.", "correct": false}, {"letter": "E", "text": "picie niewystarczającej ilości wody.", "correct": false}], "type": "single"}, {"text": "Najbardziej charakterystycznym objawem radiologicznym perforacji przewodu pokarmowego w obrębie górnego odcinka przewodu pokarmowego (np. wrzodu żołądka lub dwunastnicy) na zdjęciu RTG klatki piersiowej lub brzucha w pozycji stojącej jest", "hint": "Perforacja przewodu pokarmowego - wolne powietrze w jamie otrzewnej widoczne jako gaz pod kopulami przepony na RTG w pozycji stojacej.", "options": [{"letter": "A", "text": "obecność gazu pod kopułami przepony.", "correct": true}, {"letter": "B", "text": "szerokie pasmo cienia pod lewą kopułą przepony.", "correct": false}, {"letter": "C", "text": "objaw \"ziarna kawy\".", "correct": false}, {"letter": "D", "text": "obecność poziomów płynu w pętlach jelita cienkiego.", "correct": false}, {"letter": "E", "text": "rozlane zacienienie w miednicy małej.", "correct": false}], "type": "single"}, {"text": "Do poradni rejonowej trafia 6-letnia dziewczynka z zapaleniem gardła i migdałków, z bólem gardła, białymi nalotami na migdałkach, wysoką gorączką występującą od poprzedniego dnia. Rozpoznając anginę wywołaną najprawdopodobniej przez Streptococcus pyogenes zastosujesz", "hint": "Angina paciorkowcowa (GAS) u dziecka - lek I wyboru: fenoksymetylpenicylina (penicylina V) po przez 10 dni. Alternatywa przy alergii: makrolid.", "options": [{"letter": "A", "text": "doxycyklinę doustnie.", "correct": false}, {"letter": "B", "text": "klarytromycynę doustnie.", "correct": false}, {"letter": "C", "text": "fenoksymetylpenicylinę doustnie.", "correct": true}, {"letter": "D", "text": "cefalosporynę 3 generacji doustnie.", "correct": false}, {"letter": "E", "text": "cefalosporynę 3 generacji dożylnie.", "correct": false}], "type": "single"}, {"text": "Do poradni rejonowej zgłaszają się rodzice z 4-tygodniowym noworodkiem płci męskiej z powodu nasilonych zaparć. Dziecko oddaje stolec co 2-3 dni, ciemnożółty, uformowany, konsystencji twardej plasteliny, o dość dużej średnicy. W badaniu przedmiotowym stwierdza się z odchyleń zażółcenie powłok skórnych i twardówek, duży język, ochrypty płacz, dużą przepuklinę pępkową, masy kałowe w obrębie jamy brzusznej. Dziecko ma obniżone napięcie mięśniowe, nie trzyma główki. Słabo przybiera na wadze. Najbardziej prawdopodobnym rozpoznaniem jest", "hint": "Wrodzona niedoczynnosc tarczycy: zaparcia, duzy jezyk, ochryply placz, przepuklina pepkowa, zoltaczka przedluzajaca sie, hipotonia, opozniony rozwoj.", "options": [{"letter": "A", "text": "wrodzona niedoczynność tarczycy.", "correct": true}, {"letter": "B", "text": "niedrożność dwunastnicy.", "correct": false}, {"letter": "C", "text": "wrodzony przerost nadnerczy.", "correct": false}, {"letter": "D", "text": "choroba Hirschprunga.", "correct": false}, {"letter": "E", "text": "celiakia.", "correct": false}], "type": "single"}, {"text": "Szczepienie BCG zapobiega", "hint": "BCG nie chroni przed zakazeniem ani przed reaktywacja, ale zapobiega ciezkim postaciom gruzlicy (rozsiana, gruzlicze zapalenie opon).", "options": [{"letter": "A", "text": "transmisji zakażenia w środowisku.", "correct": false}, {"letter": "B", "text": "reaktywacji gruźlicy latentnej.", "correct": false}, {"letter": "C", "text": "wszystkim wymienionym.", "correct": false}, {"letter": "D", "text": "zakażeniu gruźlicą.", "correct": false}, {"letter": "E", "text": "rozsianym postaciom gruźlicy.", "correct": true}], "type": "single"}, {"text": "Biegunka to stan, w którym pacjent oddaje", "hint": "Biegunka = >=3 luznych/wodnistych stolcow na dobe LUB istotna zmiana konsystencji. Wg WHO: >=3 luzne stolce/dobe.", "options": [{"letter": "A", "text": "wszystkie odpowiedzi są prawdziwe.", "correct": false}, {"letter": "B", "text": "3 półpłynne stolce w ciągu doby.", "correct": true}, {"letter": "C", "text": "2 papkowate stolce w ciągu doby.", "correct": false}, {"letter": "D", "text": "1 płynny stolec w ciągu doby.", "correct": false}, {"letter": "E", "text": "4 stolce typu 5 wg Bristolskiej skali uformowania (miękkie kawałki stolca o wyraźnych krawędziach).", "correct": false}], "type": "single"}, {"text": "Zgodnie z tzw. kryteriami rotterdamskimi, do rozpoznania zespołu policystycznych jajników (PCOS) konieczne jest spełnienie co najmniej dwóch z trzech poniższych warunków. Który z wymienionych parametrów nie wchodzi w skład tych kryteriów?", "hint": "Kryteria rotterdamskie PCOS (2 z 3): 1) oligo/anovulacja, 2) hiperandrogenizm kliniczny/biochemiczny, 3) obraz policystycznych jajnikow w USG. Insulinoopornosc NIE jest kryterium.", "options": [{"letter": "A", "text": "Rzadkie owulacje lub brak owulacji (objawiające się np. nieregularnymi miesiączkami).", "correct": false}, {"letter": "B", "text": "Kliniczne i/lub biochemiczne objawy hiperandrogenizmu (np. hirsutyzm, trądzik, podwyższony poziom testosteronu).", "correct": false}, {"letter": "C", "text": "Obraz policystycznych jajników w badaniu USG.", "correct": false}, {"letter": "D", "text": "Podwyższony poziom glukozy na czczo lub insulinooporność.", "correct": true}, {"letter": "E", "text": "Wszystkie są kryteriami rotterdamskimi.", "correct": false}], "type": "single"}, {"text": "Wrzód stresowy u chorych po ciężkich urazach OUN, rozległych oparzeniach lub operacjach, najczęściej występuje w: 1. Przełyku. 2. Żołądku. 3. Dwunastnicy. 4. Jelicie cienkim. 5. Jelicie grubym. Prawidłowe odpowiedzi to", "hint": "Wrzody stresowe (Curling - oparzenia, Cushing - OUN) najczesciej lokalizuja sie w zoladku i dwunastnicy.", "options": [{"letter": "A", "text": "2,3", "correct": true}, {"letter": "B", "text": "1,2,4", "correct": false}, {"letter": "C", "text": "3,4,5", "correct": false}, {"letter": "D", "text": "1,2,3", "correct": false}, {"letter": "E", "text": "1,2,3,4,5", "correct": false}], "type": "single"}, {"text": "Chylothorax: 1. jest jednym z podtypów ropniaka opłucnej. 2. zazwyczaj występuje w przebiegu odmy opłucnowej. 3. jest szczególnym rodzajem wysięku opłucnej, utworzonego przez wynaczynioną chłonkę. 4. może mieć charakter wrodzony, urazowy, jatrogenny pooperacyjny lub nowotworowy. 5. występuje w przebiegu obecności ciał obcych w przełyku, takich jak baterie lub monety. Prawidłowe odpowiedzi to", "hint": "Chylothorax = wysiek chlonki w jamie oplucnej. Przyczyny: jatrogenne (pooperacyjne), urazowe, wrodzone, nowotworowe. NIE jest ropniakiem.", "options": [{"letter": "A", "text": "1,4", "correct": false}, {"letter": "B", "text": "2,5", "correct": false}, {"letter": "C", "text": "2,3", "correct": false}, {"letter": "D", "text": "5", "correct": false}, {"letter": "E", "text": "3,4", "correct": true}], "type": "single"}, {"text": "Który z poniższych stanów klinicznych stanowi bezwzględne przeciwwskazanie do stosowania złożonej antykoncepcji doustnej (estrogenowo-progestagennej)?", "hint": "Bezwzgledne p/wskazania do zlozonej antykoncepcji estrogenowo-progestagenowej: aktywna/przebyta ZChZZ, udar, MI, migrena z aura, rak piersi.", "options": [{"letter": "A", "text": "Bolesne miesiączkowanie.", "correct": false}, {"letter": "B", "text": "Endometrioza.", "correct": false}, {"letter": "C", "text": "Aktywna choroba zakrzepowo-zatorowa żył głębokich w wywiadzie.", "correct": true}, {"letter": "D", "text": "Wiek powyżej 35 lat u kobiety niepalącej.", "correct": false}, {"letter": "E", "text": "Zespół policystycznych jajników (PCOS).", "correct": false}], "type": "single"}, {"text": "Wskaż, który z poniższych objawów jest charakterystyczny dla ostrego zapalenia wyrostka robaczkowego i polega na występowaniu bólu w prawym dole biodrowym podczas uciskania lewego dołu biodrowego z jednoczesnym przesuwaniem dłoni w kierunku proksymalnym?", "hint": "Objaw Rovsinga = bol w prawym dole biodrowym przy ucisku lewej strony brzucha - typowy dla zapalenia wyrostka robaczkowego. Blumberg = bol przy zwalnianiu ucisku.", "options": [{"letter": "A", "text": "Objaw Rovsinga.", "correct": true}, {"letter": "B", "text": "Objaw Jaworskiego.", "correct": false}, {"letter": "C", "text": "Objaw Blumberga.", "correct": false}, {"letter": "D", "text": "Objaw Goldflama.", "correct": false}, {"letter": "E", "text": "Objaw Chełmońskiego.", "correct": false}], "type": "single"}, {"text": "Mężczyzna 26-letni z hemofilią A, z aktywnością czynnika krzepnięcia wynoszącą 3% normy, mający 174cm wzrostu i masę ciała 70kg, upadł z drabinki w trakcie wieszania obrazu na ścianie i doznał urazu głowy. W trakcie badania przez lekarza Pogotowia Ratunkowego pacjent przytomny, w pełnym kontakcie logicznym, bez odchyleń w badaniu neurologicznym, bez widocznych krwawień. Jakie postępowanie należy zastosować?", "hint": "Hemofilia A - uraz glowy: podac czynnik VIII (dawka 50j/kg na 100% aktywnosci) i hospitalizowac. Czynnik IX = hemofilia B. DDAVP - tylko lagodna hemofilia A.", "options": [{"letter": "A", "text": "Podać 3500IU czynnika VIII i hospitalizować pacjenta.", "correct": true}, {"letter": "B", "text": "Podać 5600IU czynnika IX i odesłać pacjenta do domu.", "correct": false}, {"letter": "C", "text": "Podać 3500IU czynnika IX i hospitalizować pacjenta.", "correct": false}, {"letter": "D", "text": "Podać desmopresynę i odesłać pacjenta do domu.", "correct": false}, {"letter": "E", "text": "Podać 3500IU czynnika VIII i odesłać pacjenta do domu.", "correct": false}], "type": "single"}, {"text": "32-letnia wieloródka w 35. tygodniu ciąży zgłosiła się na Izbę Przyjęć z powodu nagłego, silnego bólu podbrzusza oraz niewielkiego krwawienia z dróg rodnych o ciemnej barwie. W badaniu przedmiotowym stwierdzono wzmożone napięcie macicy (\"macica twarda jak deska\"), macica jest jednocześnie tkliwa przy dotyku. Tętno płodu jest nieprawidłowe (bradykardia 90 ud./min). Pacjentka choruje na nadciśnienie tętnicze induk se}, {"letter": "B", "text": "mięśniak macicy.", "correct": false}, {"letter": "C", "text": "polip endometrialny.", "correct": false}, {"letter": "D", "text": "zaburzenie owulacji.", "correct": true}, {"letter": "E", "text": "nowotwór endometrium.", "correct": false}], "type": "single"}, {"text": "Leczenie operacyjne niedokrwistości sferocytowej wrodzonej polega na usunięciu", "hint": "Sferocytoza wrodzona - splenektomia jest leczeniem definitywnym (zmniejsza hemolize). Sledziona usuwa sferocyty z krazenia.", "options": [{"letter": "A", "text": "lewego płata wątroby.", "correct": false}, {"letter": "B", "text": "prawego płata wątroby.", "correct": false}, {"letter": "C", "text": "żołądka.", "correct": false}, {"letter": "D", "text": "uchyłka Meckla.", "correct": false}, {"letter": "E", "text": "śledziony.", "correct": true}], "type": "single"}, {"text": "Do oddziału SOR został przekazany 30-letni pacjent po tępym urazie jamy brzusznej. W wywiadzie podaje krwiomocz, ból okolicy lędźwiowej. Pacjent jest stabilny hemodynamicznie. W fast USG opisano podejrzenie krwiaka nerki. Kolejnym badaniem obrazowym powinno być:", "hint": "Uraz nerki stabilny hemodynamicznie: TK z kontrastem = zloty standard. Pozwala ocenic stopien uszkodzenia, krwawienie aktywne, ekstravasation kontrastu.", "options": [{"letter": "A", "text": "rezonans magnetyczny bez kontrastu.", "correct": false}, {"letter": "B", "text": "rezonans magnetyczny z kontrastem.", "correct": false}, {"letter": "C", "text": "USG z opcją dopplerowską.", "correct": false}, {"letter": "D", "text": "tomografia komputerowa z kontrastem.", "correct": true}, {"letter": "E", "text": "tomografia komputerowa bez kontrastu.", "correct": false}], "type": "single"}, {"text": "Na podstawie którego z objawów klinicznych można rozpoznać twardzinę układową?", "hint": "Twardzina ukladowa: kryterium wystarczajace (major) = stwardnienie skory proksymalnie od MCP. Bez tego nie mozna rozpoznac (nawet z przeciwcialami/Raynaud).", "options": [{"letter": "A", "text": "Włóknienie płuc.", "correct": false}, {"letter": "B", "text": "Poszerzenie kapilar wału paznokciowego.", "correct": false}, {"letter": "C", "text": "Na podstawie samych objawów klinicznych nie można rozpoznać twardziny układowej, muszą być również obecne charakterystyczne dla twardziny przeciwciała (antycentromerowe, anty-Scl 70, przeciwko RNA polimerazie III).", "correct": false}, {"letter": "D", "text": "Objaw Raynauda.", "correct": false}, {"letter": "E", "text": "Stwardnienie skóry palców rąk oraz proksymalnie od stawów śródręczno-paliczkowych.", "correct": true}], "type": "single"}, {"text": "Do szpitala zgłosiła się 62-letnia pacjentka z silnym bólem kolkowym, zlokalizowanym w prawym nadbrzuszu, promieniującym do ramienia. W USG opisano liczne, drobne złogi w pęcherzyku żółciowym, z pogrubieniem jego ściany, przewody żółciowe i trzustkowe w granicach normy. W badaniach laboratoryjnych: CRP 300 mg/dl, PCT 25ng/ml, ASPAT 95U/l, ALAT 120U/l, enzymy trzustkowe w granicach normy. Po podaniu leków przeciwbólowych dolegliwości bólowe ustąpiły. Leczeniem z wyboru będzie:", "hint": "Ostre zapalenie pecherza z wysokim CRP/PCT: cholecystektomia 48-72h od objawow (wg Tokyo Guidelines). Jesli opoznienie >72h - operacja odroczona po antybiotykach.", "options": [{"letter": "A", "text": "leczenie zachowawcze.", "correct": false}, {"letter": "B", "text": "cholecystektomia w ciągu 48-72 godzin od wystąpienia objawów lub operacja odroczona 6-12 tygodni po wdrożeniu antybiotykoterapii.", "correct": true}, {"letter": "C", "text": "cholecystektomia do 12 godzin od wystąpienia objawów.", "correct": false}, {"letter": "D", "text": "pilna cholecystektomia do 6 godzin od wystąpienia objawów.", "correct": false}, {"letter": "E", "text": "ECPW - endoskopowa cholangiopankreatografia wsteczna do 72 godzin od wystąpienia objawów.", "correct": false}], "type": "single"}, {"text": "Skutecznym leczeniem choroby Hirschprunga jest", "hint": "Choroba Hirschprunga: brak zwojow nerwowych (aganglionoza). Leczenie: resekcja bezzwojowego odcinka + pull-through (operacja Soave/Duhamel/Swenson).", "options": [{"letter": "A", "text": "rozszerzenie zwężonego odcinka jelita.", "correct": false}, {"letter": "B", "text": "usunięcie bezzwojowego odcinka jelita.", "correct": true}, {"letter": "C", "text": "operacyjne usunięcie jelita grubego.", "correct": false}, {"letter": "D", "text": "przewlekłe stosowanie leków rozluźniających stolec np. makrogoli.", "correct": false}, {"letter": "E", "text": "stałe podawanie leków prokinetycznych.", "correct": false}], "type": "single"}, {"text": "Podczas badania wewnętrznego pacjentki w II okresie porodu stwierdzono, że punktem prowadzącym jest ciemiączko tylne (małe), a szew strzałkowy znajduje się w wymiarze prostym miednicy. Taki obraz świadczy o tym, że płód dokonał", "hint": "Ciemiaczko tylne jako punkt prowadzacy + szew strzalkowy w wymiarze prostym = po II zwrocie (rotacji wewnetrznej). Glowka obrocona potylica do przodu.", "options": [{"letter": "A", "text": "piątego zwrotu (zagięcia poprzecznego).", "correct": false}, {"letter": "B", "text": "czwartego zwrotu (zwrotu zewnętrznego).", "correct": false}, {"letter": "C", "text": "pierwszego zwrotu (przygięcia).", "correct": false}, {"letter": "D", "text": "trzeciego zwrotu (odgięcia).", "correct": false}, {"letter": "E", "text": "drugiego zwrotu (zwrotu wewnętrznego).", "correct": true}], "type": "single"}, {"text": "U 12-letniego chłopca po spożyciu orzechów nerkowca wystąpił obrzęk warg, następnie chłopiec zaczął skarżyć się na ból brzucha i osłabienie. Pojawił się stridor. Rozpoznając reakcję anafilaktyczną, podasz w pierwszej kolejności:", "hint": "Anafilaksja: ZAWSZE adrenalina i.m. w pierwszej kolejnosci (0.01mg/kg, max 0.5mg u doroslych, 0.3mg u dzieci). GKS/antyhistaminiki = II linia.", "options": [{"letter": "A", "text": "dexaven 8mg domięśniowo.", "correct": false}, {"letter": "B", "text": "phenazolinę 50 mg domięśniowo.", "correct": false}, {"letter": "C", "text": "0,9%NaCl 500ml w szybkim wlewie dożylnym.", "correct": false}, {"letter": "D", "text": "adrenalinę 0,3mg domięśniowo.", "correct": true}, {"letter": "E", "text": "beta-mimetyk w nebulizacji 5mg.", "correct": false}], "type": "single"}, {"text": "Operacja sposobem Hartmanna, stosowana w chirurgii jelita grubego, polega na", "hint": "Op. Hartmanna: resekcja zmienionego odcinka, zamkniecie kikuta odbytnicy (Hartmann pouch), wylomienie kolostomii koncowej. Stosowana w pilnych stanach (perforacja, niedroznosc).", "options": [{"letter": "A", "text": "usunięciu zmiany chorobowej i zespoleniu jelita koniec do końca.", "correct": false}, {"letter": "B", "text": "wyłonieniu przetoki jelitowej za zmianą, bez usuwania zmiany chorobowej.", "correct": false}, {"letter": "C", "text": "usunięciu zmiany chorobowej, zamknięciu kikuta odbytnicy i wykonaniu stomii przed zmianą chorobową.", "correct": true}, {"letter": "D", "text": "usunięciu całego jelita grubego i wykonaniu stomii na końcowym odcinku jelita cienkiego.", "correct": false}, {"letter": "E", "text": "wyłonieniu przetoki jelitowej przed zmianą, bez usuwania zmiany chorobowej.", "correct": false}], "type": "single"}, {"text": "Szmer sercowy holosystoliczny, słyszalny przez cały czas trwania skurczu może pojawiać się w przebiegu: 1. niedomykalności zastawki mitralnej. 2. zwężenia zastawki mitralnej. 3. niedomykalności zastawki trójdzielnej. 4. zwężenia zastawki trójdzielnej. 5. ubytku przegrody międzykomorowej. 6. ubytku przegrody międzyprzedsionkowej. Wskaż prawidłową odpowiedź.", "hint": "Szmer holosystoliczny (pansystoliczny): niedomykalnosc mitralna, niedomykalnosc trojdzielna, VSD. Zwezenia zastawek = szmer wyrzutowy (crescendo-decrescendo).", "options": [{"letter": "A", "text": "1,4,6", "correct": false}, {"letter": "B", "text": "2,4,6", "correct": false}, {"letter": "C", "text": "1,3,5", "correct": true}, {"letter": "D", "text": "3,4,5", "correct": false}, {"letter": "E", "text": "2,3,4", "correct": false}], "type": "single"}, {"text": "W zespole krótkiego jelita mogą występować poniższe objawy **z wyjątkiem**", "hint": "Zespol krotkiego jelita: biegunka, utrata masy ciala, hipoalbuminemia, hipokaliemia, odwodnienie. Zaparcia NIE sa typowe - dominuje biegunka.", "options": [{"letter": "A", "text": "hipokaliemii.", "correct": false}, {"letter": "B", "text": "biegunki.", "correct": false}, {"letter": "C", "text": "utraty masy ciała.", "correct": false}, {"letter": "D", "text": "zaparć.", "correct": true}, {"letter": "E", "text": "hipoalbuminemii.", "correct": false}], "type": "single"}, {"text": "U 45-letniego pacjenta z trudnym do leczenia nadciśnieniem tętniczym stwierdzono w badaniach laboratoryjnych niskie stężenie potasu (hipokaliemię) oraz zasadowicę metaboliczną. W badaniach hormonalnych wykazano znacznie podwyższone stężenie aldosteronu przy jednoczesnym bardzo niskim poziomie reniny. Jak nazywa się ta jednostka chorobowa?", "hint": "Zespol Conna = hiperaldosteronizm pierwotny: nadcisnienie + hipokaliemia + zasadowica metaboliczna + podwyzsz. aldosteron/obniz. renina. Najczesciej gruczolak nadnercza.", "options": [{"letter": "A", "text": "Zespół Conna (hiperaldosteronizm pierwotny).", "correct": true}, {"letter": "B", "text": "Choroba Addisona.", "correct": false}, {"letter": "C", "text": "Zespół Cushinga.", "correct": false}, {"letter": "D", "text": "Guz chromochłonny nadnerczy (pheochromocytoma).", "correct": false}, {"letter": "E", "text": "Przełom tarczycowy.", "correct": false}], "type": "single"}, {"text": "5-letni chłopczyk, dotychczas zdrowy, zaczął skarżyć się na bóle nóżek. Nie chce chodzić do przedszkola. W nocy ma stan podgorączkowy. Na szyi pojawiły się liczne drobne wybroczyny, a na kończynach dolnych rozległe podbiegnięcia krwawe. Co należy zrobić w pierwszej kolejności?", "hint": "Wybroczyny + podbiegnecia + bole kosci + goraczka u dziecka = podejrzenie bialaczki/aplazji. Pierwszy krok: morfologia z rozmazem (diagnostyka hematologiczna).", "options": [{"letter": "A", "text": "Wykonać badanie OB.", "correct": false}, {"letter": "B", "text": "Wykonać morfologię krwi z rozmazem.", "correct": true}, {"letter": "C", "text": "Zgłosić sprawę na policję, gdyż zachodzi podejrzenie przemocy domowej.", "correct": false}, {"letter": "D", "text": "Skierować dziecko do reumatologa.", "correct": false}, {"letter": "E", "text": "Wykonać oznaczenie parathormonu, wapnia i fosforu.", "correct": false}], "type": "single"}, {"text": "W leczeniu hiperkaliemii poza usunięciem przyczyny, która ją spowodowała, jeżeli jest to możliwe, można zastosować poniższe metody **z wyjątkiem**", "hint": "Aldakton (spironolakton) = antagonista aldosteronu, OSZCZEDZA potas - POGARSZA hiperkaliemie. Leczenie hiperK: Ca iv, glukoza+insulina, dializa, zywice jonowymienna.", "options": [{"letter": "A", "text": "hemodializy.", "correct": false}, {"letter": "B", "text": "podania roztworu glukozy z insuliną iv.", "correct": false}, {"letter": "C", "text": "podania aldactonu.", "correct": true}, {"letter": "D", "text": "podania sulfonianu polistyrenu.", "correct": false}, {"letter": "E", "text": "podania 10% roztworu chlorku wapnia.", "correct": false}], "type": "single"}, {"text": "W wynikach badań laboratoryjnych 30-letniej pacjentki stwierdzono: obniżone stężenie TSH (poniżej normy) oraz podwyższone stężenia wolnych hormonów tarczycy (FT3 i FT4). Taki układ wyników jest charakterystyczny dla", "hint": "Obniz. TSH + podwyzsz. FT3/FT4 = pierwotna nadczynnosc tarczycy (Graves, guzek toksyczny). Wtorna nadczynnosc = podwyzsz. TSH + podwyzsz. FT3/FT4 (guz przysadki wydzielajacy TSH).", "options": [{"letter": "A", "text": "pierwotnej niedoczynności tarczycy (np. choroba Hashimoto).", "correct": false}, {"letter": "B", "text": "wtórnej niedoczynności tarczycy (niewydolność przysadki).", "correct": false}, {"letter": "C", "text": "pierwotnej nadczynności tarczycy (np. choroba Gravesa-Basedowa).", "correct": true}, {"letter": "D", "text": "niedoboru jodu w diecie.", "correct": false}, {"letter": "E", "text": "wtórnej nadczynności tarczycy (np. guz przysadki wydzielający TSH).", "correct": false}], "type": "single"}, {"text": "Wg. nowej klasyfikacji molekularnej raka endometrium, który z wymienionych podtypów charakteryzuje się zdecydowanie najlepszym rokowaniem (tzw. \"ultra-favorable prognosis\")?", "hint": "POLEmut (mutacja polimerazy epsilon) = najlepsze rokowanie w raku endometrium (ultra-low risk). Przeciwnie: p53-abnormal = najgorsze rokowanie.", "options": [{"letter": "A", "text": "Podtyp z mutacją w genie TP53 (p53-abnormal).", "correct": false}, {"letter": "B", "text": "Podtyp bez specyficznego profilu molekularnego (NSMP).", "correct": false}, {"letter": "C", "text": "Podtyp z zaburzeniami naprawy DNA (MMRd – mismatch repair deficient).", "correct": false}, {"letter": "D", "text": "Podtyp pMMR.", "correct": false}, {"letter": "E", "text": "Podtyp z mutacją w domenie egzonukleazowej polimerazy epsilon (POLEmut).", "correct": true}], "type": "single"}, {"text": "U 38 letniego pacjenta ok. 3 tygodnie po przebytej anginie ropnej pojawiło się złe samopoczucie, osłabienie, utrata apetytu, nudności, triada Addisa, subnerczycowy białkomocz i skąpomocz. W leczeniu u tego chorego należy zastosować", "hint": "Klebuszkowe zapalenie nerek po paciorkowcu: ograniczenie Na i plynow, diuretyki, leczenie hipotensyjne, antybiotyk jesli aktywne zakazenie, dializa w razie potrzeby.", "options": [{"letter": "A", "text": "antybiotykoterapię po potwierdzeniu aktywnego zakażenia bakteryjnego, nawadnianie, zwiększenie podaży sodu, dializoterapię w razie ostrej niewydolności nerek.", "correct": false}, {"letter": "B", "text": "antybiotykoterapię po potwierdzeniu aktywnego zakażenia bakteryjnego, zmniejszenie podaży sodu, ograniczenie podaży płynów, leczenie hipotensyjne, leczenie moczopędne, dializoterapię w razie ostrej niewydolności nerek.", "correct": true}, {"letter": "C", "text": "antybiotykoterapię po potwierdzeniu palenie pluc): lek I rzutu = makrolid (azytromycyna, klarytromycyna). Brak sciany komorkowej - beta-laktamy nieskuteczne.", "options": [{"letter": "A", "text": "oseltamivir", "correct": false}, {"letter": "B", "text": "antybiotyk makrolidowy", "correct": true}, {"letter": "C", "text": "ceftriakson", "correct": false}, {"letter": "D", "text": "kloksacylina", "correct": false}, {"letter": "E", "text": "amoksycylina", "correct": false}], "type": "single"}, {"text": "Aktualnie za optymalny sposób leczenia dziecka z cukrzycą insulinozależną jest uważana", "hint": "Optymalne leczenie DM1 u dzieci: osobista pompa insulinowa (CSII) + CGM wg zasad funkcjonalnej intensywnej insulinoterapii. Najlepsza kontrola glikemii.", "options": [{"letter": "A", "text": "terapia z zastosowaniem podawania insuliny penem doposiłkowo według zasad funkcjonalnej intensywnej insulinoterapii i osobistej pompy insulinowej podającej dawkę bazalną (podstawową) insuliny w postaci ciągłego podskórnego wlewu.", "correct": false}, {"letter": "B", "text": "terapia przy użyciu osobistej pompy insulinowej według zasad funkcjonalnej intensywnej insulinoterapii w postaci ciągłego podskórnego wlewu insuliny.", "correct": true}, {"letter": "C", "text": "terapia przy użyciu penów według zasad funkcjonalnej intensywnej insulinoterapii.", "correct": false}, {"letter": "D", "text": "terapia z zastosowaniem pena podającego dawkę bazalną oraz osobistej pompy insulinowej podającej doposiłkowe dawki insuliny wg zasad funkcjonalnej intensywnej insulinoterapii.", "correct": false}, {"letter": "E", "text": "terapia przy użyciu penów z ustaleniem stałych doposiłkowych dawek insuliny oraz dawki insuliny bazalnej.", "correct": false}], "type": "single"}, {"text": "Na SOR trafiła 15-letnia dziewczynka z podejrzeniem sepsy. Przedmiotowo z odchyleń stwierdzono temperaturę 40°C, tachykardię ok.140/min., na skórze tułowia i ud pojedyncze, dość duże, zlewające się wybroczyny, obwodowo skóra marmurkowa, RR 65/40mmHg, neurologicznie – splątana, objawy oponowe ujemne. W pierwszej kolejności dziecku należy podać", "hint": "Sepsa/wstrzas septyczny: natychmiast plyny (bolus 20 ml/kg). Aminy presyjne - gdy brak odpowiedzi na plyny. Antybiotyk - jak najszybciej, ale po pobraniu posiewow.", "options": [{"letter": "A", "text": "płyny w dawce 20ml/kg m.c.", "correct": true}, {"letter": "B", "text": "adrenalinę 1 μg/kg mc/min.", "correct": false}, {"letter": "C", "text": "10% glukonian wapnia w dawce 20-50mg/kg.", "correct": true}, {"letter": "D", "text": "8,4% Natrium bicarbonicum 1-2 mEq/kg m.c.", "correct": false}, {"letter": "E", "text": "antybiotyk o wąskim spektrum działania.", "correct": false}], "type": "multiple"}, {"text": "Najczęstsza przyczyna nadciśnienia tętniczego u dzieci do 10 roku życia to", "hint": "U dzieci <10 lat nadcisnienie najczesciej wtorne - dominuja choroby nerek (miazszowe, naczyniowe). >10 lat - coraz czesciej pierwotne (otylosc).", "options": [{"letter": "A", "text": "otyłość.", "correct": false}, {"letter": "B", "text": "nadciśnienie monogenowe.", "correct": false}, {"letter": "C", "text": "wrodzone wady serca i naczyń.", "correct": false}, {"letter": "D", "text": "choroby nerek.", "correct": true}, {"letter": "E", "text": "zespół Cushinga.", "correct": false}], "type": "single"}, {"text": "Znając fizjologię cyklu miesiączkowego kobiety i czas funkcjonowania ciałka żółtego po owulacji, podaj w którym dniu cyklu u pacjentki miesiączkującej regularnie co 35 dni wystąpi owulacja?", "hint": "Faza lutealna = stala ~14 dni. Owulacja = dlugosc cyklu minus 14. Cykl 35 dni: owulacja w dniu 35-14 = 21.", "options": [{"letter": "A", "text": "14", "correct": false}, {"letter": "B", "text": "10", "correct": false}, {"letter": "C", "text": "28", "correct": false}, {"letter": "D", "text": "21", "correct": true}, {"letter": "E", "text": "18", "correct": false}], "type": "single"}, {"text": "Profilaktyka śródciążowa konfliktu serologicznego u ciężarnej Rh-ujemnej, u której nie stwierdzono przeciwciał anty-D, polega na podaniu immunoglobuliny anty-D w dawce 300 μg", "hint": "Profilaktyka anty-D u Rh(-) ciezarnej bez przeciwcial: rutynowo 28-30 Hbd (300ug i.m.) + w ciagu 72h po porodzie jesli noworodek Rh(+).", "options": [{"letter": "A", "text": "między 28. a 30. tygodniem ciąży.", "correct": true}, {"letter": "B", "text": "wyłącznie u pierworódek powyżej 35. roku życia.", "correct": false}, {"letter": "C", "text": "między 12. a 14. tygodniem ciąży.", "correct": false}, {"letter": "D", "text": "tylko w przypadku wystąpienia krwawienia z dróg rodnych.", "correct": false}, {"letter": "E", "text": "natychmiast po porodzie, o ile noworodek jest Rh-ujemny.", "correct": false}], "type": "single"}, {"text": "Który z objawów jest najbardziej charakterystycznym objawem wgłobienia jelita u niemowlęcia", "hint": "Wglobienie jelitowe u niemowlecia: napadowy placz, stolec malinowej galaretki (krew+sluz), wyczuwalny walec w brzuchu. Odrozni od pylorostenozy (oliwka, chlustajace wymioty).", "options": [{"letter": "A", "text": "chlustające wymioty bez żółci.", "correct": false}, {"letter": "B", "text": "objaw \"malinowej galaretki\" w stolcu.", "correct": true}, {"letter": "C", "text": "ból w prawym dole biodrowym.", "correct": false}, {"letter": "D", "text": "objaw oliwki.", "correct": false}, {"letter": "E", "text": "smoliste stolce.", "correct": false}], "type": "single"}, {"text": "Żółtaczka przedwątrobowa występuje w przebiegu", "hint": "Zespol Gilberta = lagodna hiperbilirubinemia niesprzezona (przedwatrobowa/watrobowa czynnosciowa). NIE daje uszkodzenia hepatocytow.", "options": [{"letter": "A", "text": "zatrucia muchomorem sromotnikowym.", "correct": false}, {"letter": "B", "text": "wzw typu C.", "correct": false}, {"letter": "C", "text": "zespołu Gilberta.", "correct": true}, {"letter": "D", "text": "zespołu Budda i Chariego.", "correct": false}, {"letter": "E", "text": "kamicy żółciowej wewnątrzprzewodowej.", "correct": false}], "type": "single"}, {"text": "15-letni chłopiec zgłosił się do lekarza z powodu bólu okolicy kolana, występującego od kilku tygodni. Ból przejściowo ustępuje po lekach przeciwbólowych. W ostatnich dniach ból się nasilił. Dziecko wybudza się w nocy z powodu bólu. Chłopiec wiąże to z możliwością urazu w czasie gry w piłkę nożną kilka tygodni wcześniej. W badaniu przedmiotowym w okolicy przynasady dalszej kości udowej wyczuwalne jest palpacyjnie niewielkie zgrubienie, okolica jest obrzęknięta i nieco zaczerwieniona. W rtg kości udowej uwidoczniono nieostro ograniczone ognisko z cechami osteosklerotyzacji i osteolizy, z odczynem okostnowym ze spikulami kostnymi. Obraz kliniczny wskazuje na", "hint": "Osteosarcoma: typowo nastolatek, przynasada kosci dlugich (kolano), bol nocny, RTG: sunburst/trojkat Codmana/spikulacja. Czynnik ryzyka: szybki wzrost kosci.", "options": [{"letter": "A", "text": "osteosarcoma.", "correct": true}, {"letter": "B", "text": "ropne zapalenie kości.", "correct": false}, {"letter": "C", "text": "gorączka reumatyczna.", "correct": false}, {"letter": "D", "text": "złamanie patologiczne.", "correct": false}, {"letter": "E", "text": "pourazowa torbiel kostna.", "correct": false}], "type": "single"}, {"text": "U chorego z nawrotową obustronną przepukliną pachwinową po wcześniejszych operacjach przepuklin metodą Bassiniego najlepiej jest wykonać", "hint": "Nawroty po klasycznej operacji (Bassini): leczenie laparoskopowe (TAPP/TEP) - dostep z innej strony (od wewnatrz), unikajac blizn po operacji przedniej.", "options": [{"letter": "A", "text": "operację sposobem Shouldice'a.", "correct": false}, {"letter": "B", "text": "operację sposobem Lichtensteina.", "correct": false}, {"letter": "C", "text": "ponownie operację metodą Bassiniego.", "correct": false}, {"letter": "D", "text": "operację z dostępu wewnątrzotrzewnowego – TAPP (TransAbdominal PrePeritoneal).", "correct": true}, {"letter": "E", "text": "operację sposobem Girarda.", "correct": false}], "type": "single"}, {"text": "O odwodnieniu ciężkim mówimy, gdy ubytek masy ciała dziecka", "hint": "Odwodnienie ciezkie u dziecka: ubytek >10% masy ciala. Umiarkowane: 5-10%. Lekkie: 3-5%. Objawy ciezkiego: sennosc, szybkie tetno, oczy gleboko osadzone.", "options": [{"letter": "A", "text": "przekracza 7% masy ciała.", "correct": false}, {"letter": "B", "text": "przekracza 5% masy ciała.", "correct": false}, {"letter": "C", "text": "przekracza 10% masy ciała.", "correct": true}, {"letter": "D", "text": "przekracza 2% masy ciała.", "correct": false}, {"letter": "E", "text": "przekracza 1% masy ciała.", "correct": false}], "type": "single"}, {"text": "Jednostronne osłabienie ruchów oddechowych klatki piersiowej może być spowodowane: 1. dużą ilością płynu w jamie opłucnowej jednego płuca. 2. zaawansowaną ciążą. 3. jednostronnym fibrothorax. 4. złamaniem 4 żeber w 2 miejscach. 5. odmą opłucnową jednostronną. Prawidłowa odpowiedź to", "hint": "Jednostronne ograniczenie ruchow: duzy plyn w oplucnej, fibrothorax, odma. Wiotka klatka (flail chest = zlamanie 4 zeber w 2 miejscach) - ruch paradoksalny. Ciaza = obustronna.", "options": [{"letter": "A", "text": "1,3,4", "correct": false}, {"letter": "B", "text": "1,2,3", "correct": false}, {"letter": "C", "text": "3,4,5", "correct": false}, {"letter": "D", "text": "2,3,5", "correct": false}, {"letter": "E", "text": "1,3,5", "correct": true}], "type": "single"}, {"text": "Który nowotwór ginekologiczny najczęściej szerzy się drogą wszczepów do jamy otrzewnej?", "hint": "Rak jajnika - najbardziej typowo szerzy sie przez wszczepy do otrzewnej (carcinomatosis peritonei). Rak szyjki - miejscowo + limfatycznie.", "options": [{"letter": "A", "text": "Rak szyjki macicy.", "correct": false}, {"letter": "B", "text": "Rak pochwy.", "correct": false}, {"letter": "C", "text": "Rak endometrium.", "correct": false}, {"letter": "D", "text": "Rak sromu.", "correct": false}, {"letter": "E", "text": "Rak jajnika.", "correct": true}], "type": "single"}, {"text": "Najczęstszą przyczyną wtórnego braku miesiączki jest", "hint": "PCOS (zespol policystycznych jajnikow) = najczestsza przyczyna wtornego braku miesiaczki (amenorrhea). Hiperprolaktynemia i niedoczynnosc tarczycy - tez czeste.", "options": [{"letter": "A", "text": "guz przysadki.", "correct": false}, {"letter": "B", "text": "PCOS.", "correct": true}, {"letter": "C", "text": "hiperprolaktynemia.", "correct": false}, {"letter": "D", "text": "niedoczynność tarczycy.", "correct": false}, {"letter": "E", "text": "zespół Ashermana.", "correct": false}], "type": "single"}, {"text": "Cukrzyca typu LADA to", "hint": "LADA = Late Autoimmune Diabetes in Adults. To cukrzyca typu 1 (autoimmunologiczna) o poznym poczatku (>30 r.z.), wolny przebieg. Przeciwciala: anty-GAD.", "options": [{"letter": "A", "text": "cukrzyca monogenowa.", "correct": false}, {"letter": "B", "text": "cukrzyca o znanej etiologii (typ3).", "correct": false}, {"letter": "C", "text": "cukrzyca typu 1.", "correct": true}, {"letter": "D", "text": "cukrzyca typu 2.", "correct": false}, {"letter": "E", "text": "cukrzyca w przebiegu autoimmunologicznego zapalenia tarczycy.", "correct": false}], "type": "single"}, {"text": "Wskaż prawdziwą informację dotyczącą zębów mlecznych dziecka.", "hint": "Uzebienie mleczne: 20 zebow. Pierwsze zabkowanie ~6 m.z. (dolne siekacze). Roczne dziecko: ~8 zebow. Formula: wiek w miesiacach minus 6.", "options": [{"letter": "A", "text": "Uzębienie mleczne składa się z 20 zębów, pierwsze zęby powinny wyrosnąć w wieku około 6 miesięcy, roczne dziecko powinno mieć 8 zębów.", "correct": true}, {"letter": "B", "text": "Uzębienie mleczne składa się z 32 zębów, pierwsze zęby powinny wyrosnąć w wieku około 6 miesięcy, roczne dziecko powinno mieć 28 zębów.", "correct": false}, {"letter": "C", "text": "Uzębienie mleczne składa się z 20 zębów, pierwsze zęby powinny wyrosnąć w wieku około 3 miesięcy, roczne dziecko powinno mieć 20 zębów.", "correct": false}, {"letter": "D", "text": "Uzębienie mleczne składa się z 12 zębów, pierwsze zęby powinny wyrosnąć w wieku około 6 miesięcy, roczne dziecko powinno mieć 4 zęby.", "correct": false}, {"letter": "E", "text": "Uzębienie mleczne składa się z 32 zębów, pierwsze zęby powinny wyrosnąć w wieku około 3 miesięcy, roczne dziecko powinno mieć 20 zębów.", "correct": false}], "type": "single"}, {"text": "W zaawansowanym raku jajnika (stopień III i IV wg FIGO) nadrzędnym celem pierwotnej operacji cytoredukcyjnej jest", "hint": "Cel operacji cytoredukcyjnej w zaawansowanym raku jajnika: R0 = brak rezydualnej choroby makroskopowej. Przezycie koreluje odwrotnie z wielkoscia zmian resztkowych.", "options": [{"letter": "A", "text": "usunięcie jedynie zmienionego nowotworowo jajnika (salpingo-oophorektomia jednostronna).", "correct": false}, {"letter": "B", "text": "wykonanie biopsji diagnostycznej i rozpoczęcie chemioterapii.", "correct": false}, {"letter": "C", "text": "wycięcie jedynie węzłów chłonnych biodrowych.", "correct": false}, {"letter": "D", "text": "pozostawienie zmian o średnicy nie większej niż 2,5 cm.", "correct": false}, {"letter": "E", "text": "uzyskanie całkowitej cytoredukcji, czyli usunięcie wszystkich widocznych makroskopowo zmian nowotworowych (R0).", "correct": true}], "type": "single"}, {"text": "Które z poniższych objawów klinicznych wchodzą w skład tzw. triady Charcota, występującej w ostrym zapaleniu dróg żółciowych?", "hint": "Triada Charcota (ostre zapalenie drog zolciowych): bol w prawym nadbrzuszu + goraczka z dreszczami + zoltaczka. Pentada Reynoldsa = + hipotonia + splatanie.", "options": [{"letter": "A", "text": "Ból w nadbrzuszu prawym, gorączka z dreszczami, żółtaczka.", "correct": true}, {"letter": "B", "text": "Ból w nadbrzuszu prawym, wymioty, spadek ciśnienia tętniczego.", "correct": false}, {"letter": "C", "text": "Żółtaczka, wodobrzusze, powiększenie śledziony.", "correct": false}, {"letter": "D", "text": "Ból opasujący, nudności, dodatni objaw Goldflama.", "correct": false}, {"letter": "E", "text": "Gorączka, tachykardia, objaw Blumberga.", "correct": false}], "type": "single"}, {"text": "U 52-letniej kobiety od 2 lat występuje nadciśnienie tętnicze z okresowymi wzrostami RR do 220/140, z towarzyszącymi bólami głowy, zblednieciem i tachykardią. W badaniu TK stwierdzono guz nadnercza lewego średnicy 2 cm. Jakie postępowanie należy wdrożyć u pacjentki?", "hint": "Pheochromocytoma: klinika (napadowe nadcisnienie, bole glowy, tachykardia, bladosc). Leczenie: operacja PO przygotowaniu alfa-blokerem (fenoksybenzamina/doksazosyna) 2-4 tyg., potem beta-bloker.", "options": [{"letter": "A", "text": "Kontrolne badanie MR za 6 m-cy.", "correct": false}, {"letter": "B", "text": "Zakwalifikować chorego do operacji po przygotowaniu α i β-blokerami.", "correct": true}, {"letter": "C", "text": "Natychmiastowa operacja.", "correct": false}, {"letter": "D", "text": "Wykonać embolizację tętnicy nerkowej po stronie lewej.", "correct": false}, {"letter": "E", "text": "Włączyć leczenie doustne diuretykiem i blokerem kanału wapniowego.", "correct": false}], "type": "single"}, {"text": "U 66-letniej kobiety z chorobą niedokrwienną serca i nadciśnieniem tętniczym, HFrEF (Heart Failure with reduced Ejection Fraction) wystąpiła nagła duszność po wysiłku fizycznym. Stwierdzono obrzęk płuc, RR135/85. W leczeniu 1-go rzutu zastosujesz", "hint": "Ostry obrzek pluc w HFrEF: nitrogliceryna iv (rozszerzenie zyl, zmniejszenie preload) + furosemid iv (diureza). Dopamina/dobutamina - gdy hipotonia/wstrzas kardiogenny.", "options": [{"letter": "A", "text": "Nitroglicerynę iv, hemodializę.", "correct": false}, {"letter": "B", "text": "Nitroglicerynę iv, furosemid iv.", "correct": true}, {"letter": "C", "text": "Dopaminę z dobutaminą iv, hemodializę.", "correct": false}, {"letter": "D", "text": "Diuretyk pętlowy iv, dobutaminę z dopaminą iv.", "correct": false}, {"letter": "E", "text": "Nitroglicerynę iv, dobutaminę iv.", "correct": false}], "type": "single"}, {"text": "U 61-letniej pacjentki rozp kanal przedsionkowo-komorowy - najczestsza wada serca w zespole Downa (~40%). Brak ciaglosci przegrody + wspolna zastawka AV.", "options": [{"letter": "A", "text": "ToF", "correct": false}, {"letter": "B", "text": "HLHS", "correct": false}, {"letter": "C", "text": "CoA", "correct": false}, {"letter": "D", "text": "TGA", "correct": false}, {"letter": "E", "text": "AVSD", "correct": true}], "type": "single"}, {"text": "Najczęstszy typ histologiczny raka szyjki macicy to rak", "hint": "Rak szyjki macicy: rak plaskonablonkowy (squamous cell) = 70-80%. Rak gruczolowy (adenocarcinoma) = 15-25%. HPV 16/18 = glowna etiologia obu typow.", "options": [{"letter": "A", "text": "gruczołowy.", "correct": false}, {"letter": "B", "text": "płaskonabłonkowy.", "correct": true}, {"letter": "C", "text": "surowiczy.", "correct": false}, {"letter": "D", "text": "jasnokomórkowy.", "correct": false}, {"letter": "E", "text": "drobnokomórkowy.", "correct": false}], "type": "single"}, {"text": "U pacjenta przywiezionego do SOR z objawami krwawienia z górnego odcinka przewodu pokarmowego w postaci obfitych wymiotów krwią ze skrzepami, z objawami rozwijającego się wstrząsu, przed uzyskaniem potwierdzonego wyniku grupy krwi należy przetoczyć preparaty krwi grupy", "hint": "W pilnej transfuzji bez oznaczenia grupy: krew 0 RhD ujemny = uniwersalny dawca krwinek (brak antygenow A, B, D). Dla kobiet w wieku rozrodczym szczegolnie wazne Rh-.", "options": [{"letter": "A", "text": "AB RhD dodatni.", "correct": false}, {"letter": "B", "text": "0 RhD ujemny.", "correct": true}, {"letter": "C", "text": "AB RhD ujemny.", "correct": false}, {"letter": "D", "text": "nie należy przetaczać krwi przed oznaczeniem grupy krwi pacjenta.", "correct": false}, {"letter": "E", "text": "0 RhD dodatni.", "correct": false}], "type": "single"}, {"text": "Najbardziej znanym markerem nowotworowym charakterystycznym dla raka jajnika jest CA 125. Podwyższony poziom CA 125 w surowicy krwi występuje również", "hint": "CA-125 podwyzszony nie tylko w raku jajnika, ale tez: endometrioza, ciaza, marskosc watroby, zapalenie otrzewnej, rak piersi, menstruacja. Nisko specyficzny marker.", "options": [{"letter": "A", "text": "we wszystkich wymienionych.", "correct": true}, {"letter": "B", "text": "w endometriozie.", "correct": false}, {"letter": "C", "text": "w raku piersi.", "correct": false}, {"letter": "D", "text": "w ciąży.", "correct": false}, {"letter": "E", "text": "w marskości wątroby.", "correct": false}], "type": "single"}, {"text": "Który z wymienionych objawów jest najbardziej charakterystyczny dla lewokomorowej niewydolności serca?", "hint": "Lewa komora - krazenie plucne: dusznosc wysilkowa, orthopnoe (w pozycji lezacej), DPN. Prawa komora - zastoj zylny: obrzeki, hepatomegalia, wodobrzusze.", "options": [{"letter": "A", "text": "Obrzęki wokół kostek nasilające się wieczorem.", "correct": false}, {"letter": "B", "text": "Duszność pojawiająca się w pozycji leżącej.", "correct": true}, {"letter": "C", "text": "Obecność płynu w jamie otrzewnej (wodobrzusze).", "correct": false}, {"letter": "D", "text": "Nadmierne wypełnienie żył szyjnych.", "correct": false}, {"letter": "E", "text": "Powiększenie wątroby i ból w prawym podżebrzu.", "correct": false}], "type": "single"}, {"text": "Uchyłek Meckla występuje w", "hint": "Uchylek Meckla: regula dwojek - 2% populacji, 2 stopy od zastawki Bauhina, 2 cale dlugosci, 2 typy sluzowki (zoladkowa/trzustkowa). Zlokalizowany w jelicie cienkim (kretnicy).", "options": [{"letter": "A", "text": "cewce moczowej.", "correct": false}, {"letter": "B", "text": "pęcherzu moczowym.", "correct": false}, {"letter": "C", "text": "oskrzelu głównym.", "correct": false}, {"letter": "D", "text": "jelicie cienkim.", "correct": true}, {"letter": "E", "text": "żołądku.", "correct": false}], "type": "single"}, {"text": "Wskaż prawidłowe stwierdzenie dotyczące niedokrwistości hemolitycznej.", "hint": "Hemoliza: normocytowa normochromiczna, podwyzszone LDH, podwyzszona bilirubina niesprzezona (wolna), podwyzszone retikulocyty, obniz. haptoglobina. BTA + w autoimmunologicznej.", "options": [{"letter": "A", "text": "Niedokrwistość typowo mikrocytowa, normochromiczna, ze zwiększoną aktywnością LDH w surowicy, zwiększonym stężeniem bilirubiny wolnej, zwiększoną liczbą retikulocytów.", "correct": false}, {"letter": "B", "text": "Niedokrwistość typowo normocytowa, normochromiczna, ze zwiększoną aktywnością LDH w surowicy, zwiększonym stężeniem bilirubiny niesprzężonej, zwiększoną liczbą retikulocytów.", "correct": true}, {"letter": "C", "text": "Niedokrwistość typowo normocytowa, normochromiczna, z prawidłową aktywnością LDH w surowicy, zwiększonym stężeniem bilirubiny sprzężonej, zwiększoną liczbą retikulocytów.", "correct": false}, {"letter": "D", "text": "Niedokrwistość typowo mikrocytowa, hipochromiczna, ze zwiększoną aktywnością LDH w surowicy, zwiększonym stężeniem bilirubiny niesprzężonej, zwiększoną liczbą retikulocytów.", "correct": false}, {"letter": "E", "text": "Niedokrwistość typowo makrocytowa, normochromiczna, ze zwiększoną aktywnością LDH w surowicy, zwiększonym stężeniem bilirubiny sprzężonej, prawidłową liczbą retikulocytów.", "correct": false}], "type": "single"}, {"text": "Dla pękniętej ciąży pozamacicznej zlokalizowanej w bańce jajowodu, przebiegającej z krwawieniem do jamy otrzewnej, najbardziej charakterystycznym zestawem objawów klinicznych jest", "hint": "Pekniecta ciaza ektopowa: (+) beta-hCG + silny bol brzucha + objawy wstrzasu + bolesnosc przy poruszaniu szyjka (objaw Banki/cry of Douglas). Pilna laparoskopia!", "options": [{"letter": "A", "text": "niskie stężenie β-hCG, obfite krwawienie z dróg rodnych, objaw Goldflama.", "correct": false}, {"letter": "B", "text": "wysoka gorączka, ropne upławy, ból podbrzusza.", "correct": false}, {"letter": "C", "text": "brak miesiączki, powiększenie macicy, brak bólu brzucha.", "correct": false}, {"letter": "D", "text": "silny ból w okolicy lędźwiowej promieniujący do pachw
