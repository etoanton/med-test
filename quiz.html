neumoniae: dziecko szkolne, suchy kaszel, stan podgoraczko wy, zmiany srodmiazszowe w RTG, powiekszenie wezlow wnekowych. Leczenie: makrolid.", "options": [{"letter": "A", "text": "wirus grypy typu A.", "correct": false}, {"letter": "B", "text": "wirus RSV.", "correct": false}, {"letter": "C", "text": "staphylococcus aureus.", "correct": false}, {"letter": "D", "text": "streptococcus pneumoniae.", "correct": false}, {"letter": "E", "text": "mycoplasma pneumoniae.", "correct": true}], "type": "single"}, {"text": "Wskaż nieprawdziwe zdanie dotyczące mięsaków tkanek miękkich (MTM).", "hint": "MTM przerzutuja glownie droga krwi do PLUC (nie watroby!). Watroba = typowa lokalizacja przerzutow rakow przewodu pokarmowego.", "options": [{"letter": "A", "text": "Rokowanie w przypadku MTM jest niekorzystne.", "correct": false}, {"letter": "B", "text": "Charakterystycznym objawem MTM jest niebolesny guz, najczęściej zlokalizowany podpowięziowo.", "correct": false}, {"letter": "C", "text": "Najczęstszą lokalizacją przerzutów MTM jest wątroba.", "correct": true}, {"letter": "D", "text": "Biopsja wycinająca jest przeciwwskazana w przypadku MTM o średnicy >5cm.", "correct": false}, {"letter": "E", "text": "MTM wykazują dużą skłonność do tworzenia przerzutów drogą krwi.", "correct": false}], "type": "single"}, {"text": "Leukostaza to", "hint": "Leukostaza = zaburzenia mikrokrazenia przy WBC >100 000/ul (zwykle AML). Leukocyty tworza agregaty w naczyniach wlosowatych - niedokrwienie narzadowe.", "options": [{"letter": "A", "text": "stała liczba leukocytów we krwi.", "correct": false}, {"letter": "B", "text": "zmniejszona liczba białych krwinek we krwi.", "correct": false}, {"letter": "C", "text": "zaburzenia przepływu krwi w makrokrążeniu związana ze znaczną leukocytozą (powyżej 100000/ul).", "correct": false}, {"letter": "D", "text": "powikłania zatorowe (zatory ze złepów leukocytów) związana ze znaczną leukocytozą (powyżej 100000/ul).", "correct": false}, {"letter": "E", "text": "zaburzenia przepływu krwi w mikrokrążeniu związana ze znaczną leukocytozą (powyżej 100000/ul).", "correct": true}], "type": "single"}, {"text": "W przypadku wystąpienia bezbolesnego krwiomoczu u pacjenta bez wcześniejszego wywiadu chorobowego najwłaściwszym postępowaniem jest", "hint": "Bezbolesny krwiomocz u doroslego bez wywiadu: USG jako pierwsze badanie obrazowe (nieinwazyjne). Dalej: cystoskopia dla wykluczenia nowotworu pecherza.", "options": [{"letter": "A", "text": "obserwacja.", "correct": false}, {"letter": "B", "text": "wykonanie badania ogólnego moczu i włączenie antybiotykoterapii.", "correct": false}, {"letter": "C", "text": "skierowanie chorego na podwiązanie tętnicy nerkowej.", "correct": false}, {"letter": "D", "text": "natychmiastowa cystoskopia.", "correct": false}, {"letter": "E", "text": "wykonanie usg.", "correct": true}], "type": "single"}, {"text": "Najczęstszy nowotwór złośliwy nerki występujący u dzieci to", "hint": "Guz Wilmsa (nephroblastoma) = najczestszy nowotwor zlosliwy nerki u dzieci. Szczyt: 3-4 r.z. Objaw: bezbolesna masa w brzuchu. RCC = dorosli.", "options": [{"letter": "A", "text": "rakowiak.", "correct": false}, {"letter": "B", "text": "guz liściasty.", "correct": false}, {"letter": "C", "text": "chłoniak.", "correct": false}, {"letter": "D", "text": "guz Wilmsa (nerczak płodowy).", "correct": true}, {"letter": "E", "text": "rak nerkowokomórkowy (RCC).", "correct": false}], "type": "single"}, {"text": "30-letnia pierwiastka w 34. tygodniu ciąży zgłasza się na badanie kontrolne. W pomiarach gabinetowych ciśnienie tętnicze wynosi 155/95 mmHg (potwierdzone w dwóch pomiarach). W badaniu ogólnym moczu stwierdzono białkomocz [0,5 g/dobę]. Pacjentka skarży się na narastające obrzęki podudzi i uporczywy ból w nadbrzuszu. W badaniach laboratoryjnych: płytki krwi 90 tys./ul (norma >150 tys.), aktywność enzymów wątrobowych (AST, ALT) trzykrotnie powyżej normy. Najbardziej prawdopodobne rozpoznanie to", "hint": "Zespol HELLP: Hemolysis + Elevated Liver enzymes + Low Platelets. Wystepuje w przebiegu ciezkiej preeklampsji. Leczenie: zakonczenie ciazy.", "options": [{"letter": "A", "text": "nadciśnienie tętnicze indukowane ciążą (PIH).", "correct": false}, {"letter": "B", "text": "rzucawka.", "correct": false}, {"letter": "C", "text": "zespół HELLP.", "correct": true}, {"letter": "D", "text": "stan przedrzucawkowy (preeklampsja).", "correct": false}, {"letter": "E", "text": "ciążowe stłuszczenie wątroby.", "correct": false}], "type": "single"}], "Jesień 2025": [{"text": "Ciężarna: 26 t.c. Test OGTT: glukoza na czczo 90, po 1h — 195, po 2h — 140. Jakie powinny być wartości glikemii w dalszej kontroli u tej pacjentki?", "hint": "GDM wg OGTT: na czczo ≥92, 1h ≥180, 2h ≥153 — wystarczy jedna nieprawidłowa wartość. Cele dla GDM: na czczo <90 mg/dl, 1h po posiłku <140 mg/dl, 2h <120 mg/dl.", "options": [{"letter": "A", "text": "Nie wymaga kontroli — wyniki norma", "correct": false}, {"letter": "B", "text": "Glikemia na czczo <90, 1h po posiłku <140", "correct": true}, {"letter": "C", "text": "Glikemia na czczo <125, 1h po posiłku <200 mg/dl", "correct": false}, {"letter": "D", "text": "Rozpoznanie — łagodna postać cukrzycy ciążowej, leczenie — dieta", "correct": false}, {"letter": "E", "text": "Rozpoznajemy IFG i zalecamy zgłosić się do diabetologa po zakończeniu ciąży", "correct": false}], "type": "single"}, {"text": "Ciąża bliźniacza dwuzygotyczna, dwukosmówkowa, dwuowodniowa powstała w wyniku zapłodnienia:", "hint": "Bliźnięta dwuzygotyczne = 2 komórki jajowe + 2 plemniki → zawsze DCDA (dwukosmówkowa, dwuowodniowa). Jednozygotyczne mogą być DCDA, MCDA lub MCMA w zależności od czasu podziału zygoty.", "options": [{"letter": "A", "text": "Jednej komórki jajowej przez 2 plemniki", "correct": false}, {"letter": "B", "text": "2 komórek jajowych przez 1 plemnik", "correct": false}, {"letter": "C", "text": "Jednej komórki jajowej przez 1 plemnik", "correct": false}, {"letter": "D", "text": "2 komórek jajowych przez 2 plemniki", "correct": true}], "type": "single"}, {"text": "Które z wymienionych ostrych powikłań są charakterystyczne dla cukrzycy typu 1?", "hint": "DKA — typowe ostre powikłanie T1DM (bezwzględny niedobór insuliny → lipoliza → ketony). HHS — typowy dla T2DM (zachowana resztkowa insulinemia hamująca ketogenezę).", "options": [{"letter": "A", "text": "Stan hiperglikemiczno-hiperosmolarny", "correct": false}, {"letter": "B", "text": "Wstrząs hiperglikemiczny", "correct": false}, {"letter": "C", "text": "Zasadowica oddechowa", "correct": false}, {"letter": "D", "text": "Śpiączka mleczanowa", "correct": false}, {"letter": "E", "text": "Cukrzycowa kwasica ketonowa", "correct": true}], "type": "single"}, {"text": "Glikemicznym celem leczenia w cukrzycy typu 1 jest uzyskanie wartości HbA1c:", "hint": "PTD 2024 — ogólny cel HbA1c ≤7,0% dla większości dorosłych z cukrzycą. Bardziej rygorystyczny cel ≤6,5% — dla T1DM o krótkim czasie trwania; ≤8% — dla osób starszych z powikłaniami.", "options": [{"letter": "A", "text": "<6%", "correct": false}, {"letter": "B", "text": "<6,5%", "correct": false}, {"letter": "C", "text": "<8%", "correct": false}, {"letter": "D", "text": "<7%", "correct": true}, {"letter": "E", "text": "<7,5%", "correct": false}], "type": "single"}, {"text": "Czynniki sprzyjające obrzękowi mózgu w cukrzycowej kwasicy ketonowej:", "hint": "Wszystkie wymienione czynniki zwiększają ryzyko obrzęku mózgu w DKA: młody wiek, wczesne włączenie insuliny, szybki spadek osmolalności, nadmierna płynoterapia (>4 L/m²), zbyt szybkie obniżanie glikemii (>100 mg/dl/h). Dlatego glikemię obniża się stopniowo (~50 mg/dl/h).", "items": ["Młody wiek dziecka", "Wczesne zastosowanie insulinoterapii (od pierwszej godziny leczenia)", "Szybkie obniżenie osmolalności", "Podaż płynów dożylnych >4000 ml/m²", "Obniżanie stężenia glukozy o 80 mg% (3,5 mmol/l) na godzinę"], "options": [{"letter": "A", "text": "2, 3, 4", "correct": false}, {"letter": "B", "text": "1, 3, 4", "correct": false}, {"letter": "C", "text": "3, 4, 5", "correct": false}, {"letter": "D", "text": "1, 2, 3, 4", "correct": false}, {"letter": "E", "text": "1, 2, 3, 4, 5", "correct": true}], "type": "single"}, {"text": "U 17-letniego chłopca z cukrzycą typu 1 na wycieczce rowerowej doszło do hipoglikemii, stężenie glukozy 68 mg%. Chłopiec przytomny, ma zawroty głowy. Postępowanie:", "hint": "Reguła 15/15: pacjent przytomny → 15 g węglowodanów prostych p.o., kontrola glikemii po 15 min. Glukagon i.m. — tylko przy utracie przytomności.", "options": [{"letter": "A", "text": "Wezwać pogotowie", "correct": false}, {"letter": "B", "text": "Spożyć produkt zawierający 15 g glukozy", "correct": true}, {"letter": "C", "text": "Podać sobie odpowiednią dawkę insuliny", "correct": false}, {"letter": "D", "text": "Podać sobie zastrzyk z 1 mg glukagonu", "correct": false}, {"letter": "E", "text": "Udać się do poradni diabetologicznej", "correct": false}], "type": "single"}, {"text": "Chory z niewydolnością serca i cukrzycą typu 2 — nie należy stosować:", "hint": "Pioglitazon (TZD) — przeciwwskazany w HF (retencja płynów, zaostrzenie HF). Empagliflozyna i pozostałe SGLT2i są wręcz rekomendowane w HF (poprawiają rokowanie).", "options": [{"letter": "A", "text": "Akarbozy", "correct": false}, {"letter": "B", "text": "Glimepirydu", "correct": false}, {"letter": "C", "text": "Pioglitazonu", "correct": true}, {"letter": "D", "text": "Empagliflozyny", "correct": false}, {"letter": "E", "text": "Semaglutydu", "correct": false}], "type": "single"}, {"text": "Czynniki ryzyka zachorowania na raka płuca:", "hint": "Główny czynnik — tytoń (~85%), następnie ekspozycja zawodowa/środowiskowa (azbest, radon) oraz czynniki dziedziczne. UV i otyłość NIE są czynnikami ryzyka raka płuca.", "items": ["Promieniowanie UV, solaria", "Dziedziczenie", "Otyłość", "Tytoń", "Czynniki zawodowe, środowiskowe"], "options": [{"letter": "A", "text": "1, 2, 3", "correct": false}, {"letter": "B", "text": "2, 3, 4, 5", "correct": false}, {"letter": "C", "text": "2, 4, 5", "correct": true}, {"letter": "D", "text": "1, 4, 5", "correct": false}], "type": "single"}, {"text": "U pacjenta po przeszczepieniu nerki rozpoznano zapalenie płuc prawostronne. Po celowanej antybiotykoterapii pacjent gorączkuje 5. dobę. Stosowaną antybiotykoterapię należy:", "hint": "U pacjentów w immunosupresji (po transplantacji) przy utrzymującej się gorączce mimo celowanej antybiotykoterapii — należy podejrzewać zakażenie grzybicze (Aspergillus, Pneumocystis). Antybiotyku się nie odstawia, dodaje się lek przeciwgrzybiczny.", "options": [{"letter": "A", "text": "Kontynuować i dodatkowo zastosować lek przeciwgrzybiczny", "correct": true}, {"letter": "B", "text": "Odstawić, pobrać krew na posiewy i podać nowe antybiotyki dobrane empirycznie", "correct": false}, {"letter": "C", "text": "Odstawić i zastosować lek przeciwgrzybiczny", "correct": false}, {"letter": "D", "text": "Kontynuować do 7. doby; jeżeli nadal gorączka — zmienić na antybiotyki dobrane empirycznie i powtórzyć posiewy", "correct": false}, {"letter": "E", "text": "Kontynuować, ponieważ jest zgodna z antybiogramem", "correct": false}], "type": "single"}, {"text": "Objawy radiologiczne uszkodzenia przepony:", "hint": "Wszystkie wymienione objawy są klasycznymi cechami radiologicznymi pęknięcia przepony: uniesienie kopuły, pętle jelita/żołądka w jamie opłucnej, zgłębnik NG widoczny powyżej przepony, zatarcie obrysu przepony.", "options": [{"letter": "A", "text": "Uniesienie kopuły przepony, przesunięcie śródpiersia", "correct": false}, {"letter": "B", "text": "Jelito, żołądek widoczny w lewej jamie opłucnej", "correct": false}, {"letter": "C", "text": "Zgłębnik żołądkowy widoczny powyżej przepony", "correct": false}, {"letter": "D", "text": "Zatarcie obrysu przepony i niedodma płuca", "correct": false}, {"letter": "E", "text": "Wszystkie odpowiedzi są prawidłowe", "correct": true}], "type": "single"}, {"text": "W trakcie cholecystektomii laparoskopowej — podejrzenie raka pęcherzyka żółciowego:", "hint": "Przy śródoperacyjnym podejrzeniu raka pęcherzyka żółciowego — konwersja do operacji otwartej z wycięciem miejsc po trokarach (ryzyko przerzutów typu port-site). Resekcja wątroby — dopiero po wyniku histopatologicznym i ocenie stopnia zaawansowania, nie w jednym etapie.", "options": [{"letter": "A", "text": "Kontynuować operację laparoskopową bez żadnych zmian", "correct": false}, {"letter": "B", "text": "Zmienić operację na otwartą z wycięciem miejsc wkłucia trokarów", "correct": true}, {"letter": "C", "text": "Zmienić operację na otwartą z oceną palpacyjną węzłów chłonnych", "correct": false}, {"letter": "D", "text": "Kontynuować operację laparoskopową z wycięciem miejsc wkłucia trokarów", "correct": false}, {"letter": "E", "text": "Zmienić operację na otwartą z wycięciem miejsc wkłucia trokarów i prawego płata wątroby", "correct": false}], "type": "single"}, {"text": "Przeciwwskazania do cholecystektomii laparoskopowej:", "hint": "Przeciwwskazania: ciężka niewydolność oddechowa (brak tolerancji odmy otrzewnowej), rozlane zapalenie otrzewnej, podejrzenie raka pęcherzyka żółciowego. Cukrzyca i pogrubienie ściany pęcherzyka nie są przeciwwskazaniami.", "items": ["Cukrzyca", "Ciężka niewydolność oddechowa", "Rozlane zapalenie otrzewnej", "Pogrubienie ściany pęcherzyka żółciowego w USG", "Podejrzenie raka pęcherzyka żółciowego"], "options": [{"letter": "A", "text": "1, 3, 4", "correct": false}, {"letter": "B", "text": "2, 3, 5", "correct": true}, {"letter": "C", "text": "2, 4", "correct": false}, {"letter": "D", "text": "1, 2, 4, 5", "correct": false}, {"letter": "E", "text": "1, 2, 3, 4, 5", "correct": false}], "type": "single"}, {"text": "Leczenie zachowawcze przewlekłego zapalenia trzustki (PZT) obejmuje:", "hint": "Leczenie zachowawcze PZT obejmuje WSZYSTKIE wymienione elementy: leczenie bólu, suplementację enzymów trzustkowych, dietę (wysokokaloryczną, wysokobiałkową), zaprzestanie picia alkoholu i palenia, wyrównywanie glikemii (cukrzyca wtórna).", "items": ["Leczenie bólu", "Leczenie enzymami trzustkowymi", "Dietę wysokobiałkową i bogatokaloryczną", "Zaprzestanie picia alkoholu i palenia tytoniu", "Wyrównywanie zaburzeń gospodarki węglowodanowej"], "options": [{"letter": "A", "text": "1, 2, 3, 4, 5", "correct": true}, {"letter": "B", "text": "1, 2", "correct": false}, {"letter": "C", "text": "2, 3, 5", "correct": false}, {"letter": "D", "text": "1, 2, 4", "correct": false}, {"letter": "E", "text": "2, 3, 4, 5", "correct": false}], "type": "single"}, {"text": "U chorych z PZT — leczenie inwazyjne endoskopowe z wyjątkiem:", "hint": "Złogów >5 mm w przewodzie Wirsunga nie da się usunąć endoskopowo — konieczna jest wcześniejsza ESWL lub leczenie operacyjne. Endoskopowo można leczyć: torbiele rzekome, zwężenia (stenty), sfinkterotomia, drobne złogi.", "options": [{"letter": "A", "text": "Leczenia torbieli rzekomych", "correct": false}, {"letter": "B", "text": "Wprowadzenia stentu do przewodu trzustkowego", "correct": false}, {"letter": "C", "text": "Leczenia zwężenia przewodu żółciowego wspólnego", "correct": false}, {"letter": "D", "text": "Sfinkterotomii brodawki większej dwunastnicy", "correct": false}, {"letter": "E", "text": "Usunięcia złogów o średnicy >5 mm z przewodu trzustkowego", "correct": true}], "type": "single"}, {"text": "Łagodny przebieg ostrego zapalenia trzustki. Postępowanie:", "hint": "OZT (nawet łagodne) = hospitalizacja + płynoterapia (mleczan Ringera; wg WATERFALL 2022 NEJM preferowana moderate resuscytacja — bolus 10 ml/kg + 1,5 ml/kg/h, bezpieczniejsza niż agresywna 5–10 ml/kg/h) + analgezja + wczesne żywienie p.o. w ciągu 24–48 h po ustąpieniu nudności. Antybiotyki — tylko przy zakażonej martwicy (nie profilaktycznie).", "options": [{"letter": "A", "text": "Leczenie ambulatoryjne, leki prokinetyczne, antybiotykoterapia", "correct": false}, {"letter": "B", "text": "Leczenie ambulatoryjne, antybiotykoterapia, leki przeciwbólowe", "correct": false}, {"letter": "C", "text": "Hospitalizacja, płynoterapia dożylna, leki przeciwbólowe, wstrzymanie żywienia doustnego", "correct": true}, {"letter": "D", "text": "Hospitalizacja, leki przeciwbólowe, antybiotykoterapia, założenie gastrostomii przezskórnej", "correct": false}, {"letter": "E", "text": "Leczenie ambulatoryjne, leki przeciwbólowe, leki przeciwwymiotne", "correct": false}], "type": "single"}, {"text": "Leczenie chirurgiczne raka głowy trzustki — pankreatoduodenektomia sposobem:", "hint": "Pankreatoduodenektomia = operacja Whipple'a (usunięcie głowy trzustki + dwunastnicy + dystalnej części żołądka + pęcherzyka żółciowego + dystalnego odcinka przewodu żółciowego wspólnego). Standard w raku głowy trzustki.", "options": [{"letter": "A", "text": "Vatera", "correct": false}, {"letter": "B", "text": "Mikulicza", "correct": false}, {"letter": "C", "text": "Wirsunga", "correct": false}, {"letter": "D", "text": "Whipple'a", "correct": true}, {"letter": "E", "text": "Hynes-Andersona", "correct": false}], "type": "single"}, {"text": "Do najczęstszych powikłań ostrego zapalenia pęcherzyka żółciowego należą:", "hint": "Powikłania ostrego zapalenia pęcherzyka żółciowego: ropniak, perforacja (z miejscowym/rozlanym zapaleniem otrzewnej), gazowe (rozedmowe) zapalenie pęcherzyka (gaz — flora gazotwórcza, częste u chorych na cukrzycę). Zapalenie wątroby i rak nie są powikłaniami OZP.", "items": ["Ropniak", "Zapalenie wątroby", "Perforacja ściany pęcherzyka żółciowego", "Rak pęcherzyka żółciowego", "Gazowe zapalenie pęcherzyka żółciowego"], "options": [{"letter": "A", "text": "2, 4, 5", "correct": false}, {"letter": "B", "text": "1, 3, 4, 5", "correct": false}, {"letter": "C", "text": "1, 3, 5", "correct": true}, {"letter": "D", "text": "1, 2, 3", "correct": false}, {"letter": "E", "text": "3, 4", "correct": false}], "type": "single"}, {"text": "Do szpitala zgłosił się pacjent, u którego 2 dni temu wykonano koronarografię. Tętniący guz w pachwinie. Najbardziej prawdopodobna przyczyna:", "hint": "Po nakłuciu tętnicy udowej (koronarografia) tętniący guz = tętniak rzekomy (pseudoaneurysm) — krwiak komunikujący się z tętnicą. Diagnostyka: USG dopplerowskie.", "options": [{"letter": "A", "text": "Zbiornik chłonki", "correct": false}, {"letter": "B", "text": "Ropień pachwiny", "correct": false}, {"letter": "C", "text": "Tętniak rzekomy", "correct": true}, {"letter": "D", "text": "Tętniak prawdziwy", "correct": false}, {"letter": "E", "text": "Powiększenie węzłów chłonnych", "correct": false}], "type": "single"}, {"text": "EKG: QRS >0,12s, przeciwstawny kierunek zał. T do QRS, monofazowe zespoły QRS, zawęźlone lub rozdwojone R w V5-6:", "hint": "LBBB: QRS ≥120 ms + szeroki, zawęźlony załamek R w V5–V6 oraz I, aVL + dyskordantny załamek T. RBBB — odwrotnie: rsR' w V1–V2.", "options": [{"letter": "A", "text": "Blok tylnej wiązki lewej odnogi p. Hisa", "correct": false}, {"letter": "B", "text": "Zawał ściany bocznej", "correct": false}, {"letter": "C", "text": "RBBB", "correct": false}, {"letter": "D", "text": "LBBB", "correct": true}, {"letter": "E", "text": "Blok przedsionkowo-komorowy 1 st", "correct": false}], "type": "single"}, {"text": "60 lat, otyłość, ból w łydce po przejściu 340 m (ustępuje po zatrzymaniu), NT, palenie. Brak tętna na tętnicy podkolanowej i grzbietowej stopy. Leczenie 1 rzutu:", "hint": "PAD w II stopniu wg Fontaine'a (chromanie >200 m) — leczenie zachowawcze: nadzorowany trening marszowy, zaprzestanie palenia, statyny, ASA, kontrola RR/glikemii. Rewaskularyzacja — przy II ≤200 m lub krytycznym niedokrwieniu (III/IV).", "options": [{"letter": "A", "text": "Pilna operacja — by-pass", "correct": false}, {"letter": "B", "text": "Leki rozkurczające naczynia i.v.", "correct": false}, {"letter": "C", "text": "Leczenie zachowawcze — nadzorowany trening marszowy, redukcja czynników ryzyka", "correct": true}, {"letter": "D", "text": "Pilna arteriografia i przezskórna angioplastyka t. udowej powierzchownej", "correct": false}, {"letter": "E", "text": "Brak prawidłowej odpowiedzi", "correct": false}], "type": "single"}, {"text": "Napad kolki nerkowej prawostronnej może być podczas schorzeń, za wyjątkiem:", "hint": "Kolka nerkowa = niedrożność moczowodu (złóg, skrzep, oderwana martwicza brodawka nerkowa). Kolka żółciowa ma inną lokalizację i patogenezę (drogi żółciowe), powoduje ból w prawym podżebrzu.", "options": [{"letter": "A", "text": "Krwawienia do dróg moczowych z obecnością skrzepów krwi", "correct": false}, {"letter": "B", "text": "Ostrej martwicy brodawek nerkowych", "correct": false}, {"letter": "C", "text": "Kamicy dróg żółciowych", "correct": true}, {"letter": "D", "text": "Kamicy nerkowej", "correct": false}], "type": "single"}, {"text": "Jałowy ropomocz charakterystyczny dla:", "hint": "Jałowy ropomocz (leukocyty w moczu + ujemny posiew tlenowy) = klasyczny dla gruźlicy nerek. Mycobacterium nie rośnie na standardowych podłożach — wymagane są specjalne posiewy i PCR.", "options": [{"letter": "A", "text": "Gruźlicy nerek", "correct": true}, {"letter": "B", "text": "Zakażenia drożdżakowego dróg moczowych", "correct": false}, {"letter": "C", "text": "Zgorzelinowego odmiedniczkowego zapalenia nerek", "correct": false}, {"letter": "D", "text": "Urosepsy", "correct": false}, {"letter": "E", "text": "Ostrego odmiedniczkowego zapalenia nerek", "correct": false}], "type": "single"}, {"text": "Krwinkomocz — to liczba erytrocytów w polu widzenia:", "hint": "Krwinkomocz (mikrohematuria) = >3 erytrocytów w polu widzenia w osadzie moczu. Makroskopowy krwiomocz — krew widoczna gołym okiem, czerwone zabarwienie moczu.", "options": [{"letter": "A", "text": ">10", "correct": false}, {"letter": "B", "text": ">15", "correct": false}, {"letter": "C", "text": ">3", "correct": true}, {"letter": "D", "text": ">5", "correct": false}, {"letter": "E", "text": ">12", "correct": false}], "type": "single"}, {"text": "Do powikłań zakażeń układu moczowego powstających w wyniku wstępującego zakażenia nie należą:", "hint": "Mnogie ropnie kory nerek powstają drogą krwiopochodną (S. aureus). Zapalenie gruczołu krokowego, najądrza i zgorzelinowe odmiedniczkowe zapalenie nerek — zakażenie wstępujące.", "options": [{"letter": "A", "text": "Ostre zapalenie gruczołu krokowego", "correct": false}, {"letter": "B", "text": "Ostre zapalenie najądrza", "correct": false}, {"letter": "C", "text": "Zgorzelinowe odmiedniczkowe zapalenie nerek", "correct": false}, {"letter": "D", "text": "Mnogie ropnie kory nerek", "correct": true}], "type": "single"}, {"text": "Spośród składników osadu moczu znaczenia diagnostycznego nie mają:", "hint": "Wałeczki szkliste mogą występować w warunkach prawidłowych (zwłaszcza przy odwodnieniu, wysiłku) — nie mają znaczenia klinicznego. Wałeczki ziarniste, kryształy ksantyny, krwinkomocz i leukocyturia świadczą o patologii.", "options": [{"letter": "A", "text": "Wałeczki ziarniste", "correct": false}, {"letter": "B", "text": "Wałeczki szkliste", "correct": true}, {"letter": "C", "text": "Kryształy ksantyny", "correct": false}, {"letter": "D", "text": "Erytrocyty >10 w ppw", "correct": false}, {"letter": "E", "text": "Leukocyty >15 w ppw", "correct": false}], "type": "single"}, {"text": "Pacjentka lat 34, bez chorób przewlekłych, ostre odmiedniczkowe zapalenie nerek, leczenie ambulatoryjne. Leczenie 1-szego wyboru (przed wynikami posiewów):", "hint": "Ambulatoryjne leczenie OOZN (IDSA 2010/PTU 2020): fluorochinolon p.o. (lewofloksacyna 750 mg 1×/d × 5 dni lub ciprofloksacyna 500 mg 2×/d × 7 dni) + jednorazowa dawka ceftriaksonu 1 g i.v. Ceftriakson zalecany, gdy lokalna oporność E. coli na FQ >10% — w Polsce ~20–30%. Ciężarny lub ciężki przebieg → hospitalizacja + antybiotykoterapia i.v.", "options": [{"letter": "A", "text": "Lewofloksacyna 1×750 mg p.o. przez 5 dni (poprzedzona jednorazowym podaniem ceftriaksonu 1,0 g i.v.)", "correct": true}, {"letter": "B", "text": "Cefpodoksym 2×200 mg p.o. przez 7 dni (poprzedzona ceftriaksonem 1,0 g)", "correct": false}, {"letter": "C", "text": "Kotrimoksazol 2×960 mg p.o. przez 7 dni (poprzedzona ceftriaksonem 1,0 g)", "correct": false}, {"letter": "D", "text": "Amoksycylina z kwasem klawulanowym 2×1 g p.o. przez min. 10 dni (poprzedzona ceftriaksonem 1,0 g)", "correct": false}, {"letter": "E", "text": "Ciprofloksacyna 2×500 mg p.o. przez 5 dni (poprzedzona ceftriaksonem 1,0 g)", "correct": false}], "type": "single"}, {"text": "Odpływ pęcherzowo-moczowodowy rozpoznawany w cystouretrografii mikcyjnej. Odpływ I stopnia to:", "hint": "Klasyfikacja VUR: I — odpływ wyłącznie do nieposzerzonego moczowodu, II — do miedniczki/kielichów bez ich poszerzenia, III — łagodne poszerzenie, IV — umiarkowane poszerzenie + krętość, V — wyraźne poszerzenie + zatarcie sklepień kielichów.", "options": [{"letter": "A", "text": "Łagodne do umiarkowanego poszerzenie moczowodu, miedniczki nerkowej i kielichów", "correct": false}, {"letter": "B", "text": "Odpływ do miedniczki i kielichów bez ich poszerzenia", "correct": false}, {"letter": "C", "text": "Kręty przebieg i duże poszerzenie moczowodu, miedniczki i kielichów oraz ścieńczenie kory nerek", "correct": false}, {"letter": "D", "text": "Umiarkowanie kręty przebieg moczowodu, poszerzenie miedniczki i kielichów z minimalnym spłaszczeniem ich sklepień", "correct": false}, {"letter": "E", "text": "Odpływ do nieposzerzonego moczowodu", "correct": true}], "type": "single"}, {"text": "Ureterorenoskopia (URSL) to:", "hint": "URSL = ureterorenoskopia z litotrypsją. ESWL — kruszenie falą uderzeniową z zewnątrz, PCNL — przezskórna nefrolitotomia, cystoskopia — wziernikowanie pęcherza moczowego.", "options": [{"letter": "A", "text": "Kruszenie złogów falą ultradźwiękową", "correct": false}, {"letter": "B", "text": "Wziernikowanie moczowodu i miedniczki nerkowej półsztywnym renoskopem z kruszeniem złogów", "correct": true}, {"letter": "C", "text": "Kruszenie złogów w nerce poprzez przezskórne wytworzenie przetoki nerkowej", "correct": false}, {"letter": "D", "text": "Wziernikowanie pęcherza moczowego półsztywnym cystoskopem z kruszeniem złogów", "correct": false}, {"letter": "E", "text": "Wziernikowanie pęcherza moczowego giętkim cystoskopem z kruszeniem złogów", "correct": false}], "type": "single"}, {"text": "Podejrzenie bakteryjnego zapalenia opon mózgowo-rdzeniowych. Czas od 1. kontaktu z opieką medyczną do włączenia antybiotyku nie powinien przekraczać:", "hint": "Przy podejrzeniu bakteryjnego ZOMR antybiotyk powinien być włączony w ciągu 3 godzin od pierwszego kontaktu z opieką medyczną (PTEiLChZ). Każda godzina opóźnienia zwiększa śmiertelność.", "options": [{"letter": "A", "text": "6 h", "correct": false}, {"letter": "B", "text": "12 h", "correct": false}, {"letter": "C", "text": "3 h", "correct": true}, {"letter": "D", "text": "30 min", "correct": false}, {"letter": "E", "text": "24 h", "correct": false}], "type": "single"}, {"text": "Do szpitala zgłosił się 30-letni mężczyzna z uwięźniętą przepukliną pachwinową lewostronną. Proponowane leczenie:", "hint": "Uwięźnięta przepuklina bez zapalenia otrzewnej — próba ręcznego odprowadzenia po analgezji; w razie niepowodzenia — operacja w trybie pilnym (ryzyko martwicy jelita). Przy objawach otrzewnowych — od razu operacja bez próby odprowadzenia.", "options": [{"letter": "A", "text": "Leki przeciwbólowe i rozkurczowe, ocena po 6-8 godzinach", "correct": false}, {"letter": "B", "text": "USG; przy braku martwicy — leki przeciwbólowe, ocena kolejnego dnia", "correct": false}, {"letter": "C", "text": "Próba ręcznego odprowadzenia po lekach przeciwbólowych; przy braku poprawy — leczenie operacyjne w trybie pilnym", "correct": true}, {"letter": "D", "text": "Leczenie operacyjne w trybie planowym w ciągu 10 dni", "correct": false}, {"letter": "E", "text": "Próba ręcznego odprowadzenia po lekach przeciwbólowych; przy braku poprawy — leczenie operacyjne w ramach tej samej hospitalizacji", "correct": false}], "type": "single"}, {"text": "W czasie napadu dny moczanowej najczęściej zajętym zapalnie stawem jest:", "hint": "Podagra = ostre zapalenie I stawu śródstopno-paliczkowego (~50% pierwszych napadów dny). Niższa temperatura i pH w stawach dystalnych → precypitacja moczanów.", "options": [{"letter": "A", "text": "Staw skroniowo-żuchwowy", "correct": false}, {"letter": "B", "text": "Staw nadgarstkowy", "correct": false}, {"letter": "C", "text": "Staw śródstopno-paliczkowy pierwszy", "correct": true}, {"letter": "D", "text": "Staw śródręczno-paliczkowy kciuka", "correct": false}, {"letter": "E", "text": "Staw biodrowy", "correct": false}], "type": "single"}, {"text": "Zespół \"suchego oka\", suchość w jamie ustnej, utrudnione połykanie, powiększenie gruczołów ślinowych, zapalenie stawów na kształt RZS, zesp. Raynauda to:", "hint": "Sjögren = klasyczna triada sicca: keratoconjunctivitis sicca + xerostomia + powiększenie gruczołów ślinowych + zapalenie wielostawowe podobne do RZS + objaw Raynauda. Przeciwciała anty-SSA(Ro)/SSB(La).", "options": [{"letter": "A", "text": "Twardzina układowa", "correct": false}, {"letter": "B", "text": "Choroba Stilla", "correct": false}, {"letter": "C", "text": "Choroba Pageta", "correct": false}, {"letter": "D", "text": "Zespół Sjögrena", "correct": true}, {"letter": "E", "text": "Zespół Behçeta", "correct": false}], "type": "single"}, {"text": "Toczeń układowy — charakterystyczne odchylenia:", "hint": "SLE = obniżenie C3/C4 (zużycie przez kompleksy immunologiczne) + ANA(+), anty-dsDNA(+), anty-Sm(+) + leukopenia, małopłytkowość, niedokrwistość (NIE leukocytoza i nie nadpłytkowość).", "options": [{"letter": "A", "text": "RF w klasie IgM", "correct": false}, {"letter": "B", "text": "Leukocytoza", "correct": false}, {"letter": "C", "text": "Nadpłytkowość", "correct": false}, {"letter": "D", "text": "Hiperbilirubinemia", "correct": false}, {"letter": "E", "text": "Obniżone stężenia C3 i/lub C4 dopełniacza", "correct": true}], "type": "single"}, {"text": "Jaki lek nie stosujemy w leczeniu przewlekłej białaczki szpikowej:", "hint": "CML = TKI (imatynib, dazatynib i in.) — podstawa leczenia. Ponadto: hydroksymocznik (cytoredukcja), IFN-α, allo-HCT. MTX nie jest stosowany w leczeniu CML.", "options": [{"letter": "A", "text": "Metotreksat", "correct": true}, {"letter": "B", "text": "Interferon alfa", "correct": false}, {"letter": "C", "text": "Allo-HCT", "correct": false}, {"letter": "D", "text": "Imatynib (Glivec)", "correct": false}, {"letter": "E", "text": "Hydroksymocznik (hydroksykarbamid)", "correct": false}], "type": "single"}, {"text": "U 55-letniego mężczyzny z alkoholową marskością wątroby stwierdzono guz prawego płata wątroby i podwyższone stężenie alfa-fetoproteiny. Najbardziej prawdopodobne rozpoznanie:", "hint": "HCC = marskość wątroby (o dowolnej etiologii) + guz + ↑AFP. AFP >400 ng/ml w marskiej wątrobie jest praktycznie diagnostyczne. Marskość alkoholowa — wiodący czynnik ryzyka HCC w Polsce.", "options": [{"letter": "A", "text": "Naczyniak wątroby", "correct": false}, {"letter": "B", "text": "Rak z komórek wątrobowych", "correct": true}, {"letter": "C", "text": "Nasieniak o nietypowym umiejscowieniu", "correct": false}, {"letter": "D", "text": "Przerzut raka z jelita grubego", "correct": false}, {"letter": "E", "text": "Regenerujący guzek w marskiej wątrobie", "correct": false}], "type": "single"}, {"text": "Próba samobójcza — 20 tabletek paracetamolu po 500 mg. Lek z wyboru:", "hint": "10 g paracetamolu = dawka toksyczna. Antidotum: NAC (odtwarza pulę glutationu → detoksykacja NAPQI). Najskuteczniejsza w pierwszych 8–10 h od zatrucia.", "options": [{"letter": "A", "text": "Nalokson", "correct": false}, {"letter": "B", "text": "Atropina", "correct": false}, {"letter": "C", "text": "Pralidoksym", "correct": false}, {"letter": "D", "text": "N-acetylocysteina", "correct": true}, {"letter": "E", "text": "Fizostygmina", "correct": false}], "type": "single"}, {"text": "Ojciec 8-letniej dziewczynki choruje na hipercholesterolemię rodzinną (AD). Ryzyko wystąpienia tej choroby u dziecka wynosi:", "hint": "Dziedziczenie autosomalne dominujące (rodzic heterozygotyczny) → 50% ryzyko dla każdego dziecka. FH — najczęściej mutacja genu LDLR.", "options": [{"letter": "A", "text": "25%", "correct": false}, {"letter": "B", "text": "100%", "correct": false}, {"letter": "C", "text": "50%", "correct": true}, {"letter": "D", "text": "75%", "correct": false}, {"letter": "E", "text": "1%", "correct": false}], "type": "single"}, {"text": "Powikłania, które mogą wystąpić po doraźnym zaopatrzeniu uszkodzonego miąższu płuca:", "hint": "Po urazie płuca mogą wystąpić: torbiel rzekoma pourazowa, przetoka tętniczo-żylna, ropień płuca, przedłużony przeciek powietrza, niedodma — wszystkie wymienione są możliwymi powikłaniami.", "options": [{"letter": "A", "text": "Rzekoma torbiel pourazowa i przetoka tętniczo-żylna", "correct": false}, {"letter": "B", "text": "Zakażenie z powstaniem ropnia płuca", "correct": false}, {"letter": "C", "text": "Przedłużony przeciek powietrza i niedodma", "correct": false}, {"letter": "D", "text": "Wszystkie odpowiedzi są poprawne", "correct": true}, {"letter": "E", "text": "Żadna odpowiedź nie jest prawidłowa", "correct": false}], "type": "single"}, {"text": "Wzrost stężenia BNP/NT-proBNP może wystąpić w przebiegu:", "hint": "BNP/NT-proBNP rośnie w: HF (ostrej, przewlekłej), zawale serca, zatorowości płucnej, nadczynności tarczycy, PChN. β-blokery i ACEI w leczeniu HF wręcz OBNIŻAJĄ BNP. Niedoczynność tarczycy → ↓BNP.", "items": ["Ostrej niewydolności serca", "W trakcie leczenia antagonistami układu adrenergicznego", "Zawału serca", "Nieleczonej niedoczynności tarczycy", "Przewlekłej niewydolności serca", "W trakcie leczenia ACEI"], "options": [{"letter": "A", "text": "1, 3, 4", "correct": false}, {"letter": "B", "text": "1, 3, 5", "correct": true}, {"letter": "C", "text": "3, 5, 6", "correct": false}, {"letter": "D", "text": "2, 4, 6", "correct": false}, {"letter": "E", "text": "1, 2, 3", "correct": false}], "type": "single"}, {"text": "Wskaż fa stalna niedrożność), Steroids/Sepsis (steroidy/sepsa) — wszystkie te czynniki utrudniają gojenie przetoki.", "options": [{"letter": "A", "text": "Niedrożność jelita w odcinku dystalnym od przetoki", "correct": false}, {"letter": "B", "text": "Wszystkie odpowiedzi są poprawne", "correct": true}, {"letter": "C", "text": "Ciało obce", "correct": false}, {"letter": "D", "text": "Przebyta radioterapia jelita", "correct": false}, {"letter": "E", "text": "Aktywna choroba nowotworowa", "correct": false}], "type": "single"}, {"text": "U 67-letniego mężczyzny z bezbólową żółtaczką od 2 tygodni stwierdzono znacznie powiększony, niebolesny pęcherzyk żółciowy. Najbardziej prawdopodobna przyczyna żółtaczki:", "hint": "Objaw Courvoisiera: bezbólowa żółtaczka + powiększony, niebolesny pęcherzyk żółciowy = pozawątrobowa niedrożność dróg żółciowych o etiologii złośliwej (najczęściej rak głowy trzustki). W kamicy pęcherzyk jest zwykle obkurczony (przewlekły stan zapalny).", "options": [{"letter": "A", "text": "Zatkanie przewodu żółciowego wspólnego przez kamień", "correct": false}, {"letter": "B", "text": "Ostre zapalenie pęcherzyka żółciowego", "correct": false}, {"letter": "C", "text": "Ostre zapalenie trzustki, postać obrzękowa", "correct": false}, {"letter": "D", "text": "Ucisk na przewód żółciowy wspólny przez guz głowy trzustki", "correct": true}, {"letter": "E", "text": "Alkoholowe zapalenie wątroby", "correct": false}], "type": "single"}, {"text": "Najrzadsze złamanie żeber. Jakich?", "hint": "Złamanie żeber I–III jest rzadkie (są chronione przez obojczyk, łopatkę i mięśnie), ale wymaga DUŻEJ siły urazu → wiąże się z ciężkim urazem (uszkodzenie dużych naczyń, splotu ramiennego).", "options": [{"letter": "A", "text": "I-III", "correct": true}, {"letter": "B", "text": "IV-VII", "correct": false}, {"letter": "C", "text": "V-VIII", "correct": false}, {"letter": "D", "text": "X-XII", "correct": false}], "type": "single"}, {"text": "W leczeniu ropniaka opłucnej stosuje się:", "hint": "Leczenie ropniaka opłucnej: antybiotyki + drenaż (stadium I–II) → fibrynoliza doopłucnowa (stadium II–III) → VATS/torakotomia z dekortykacją (stadium III, zorganizowane).", "items": ["Antybiotykoterapię", "Drenaż opłucnej", "Leczenie fibrynolityczne (streptokinaza i streptodornaza doopłucnowo)", "Torakoskopię", "Torakotomię"], "options": [{"letter": "A", "text": "1, 2, 3, 4, 5", "correct": true}, {"letter": "B", "text": "1, 2", "correct": false}, {"letter": "C", "text": "2, 3, 5", "correct": false}, {"letter": "D", "text": "1, 3, 4, 5", "correct": false}, {"letter": "E", "text": "2, 3, 4", "correct": false}], "type": "single"}, {"text": "Czego nie uwzględnia skala CRB-65 (w odróżnieniu od CURB-65):", "hint": "CURB-65 = Confusion (splątanie), Urea (mocznik), RR (oddechy), BP (ciśnienie), wiek ≥65 lat. CRB-65 — bez U (mocznika), do ambulatoryjnej oceny CAP bez badań laboratoryjnych.", "options": [{"letter": "A", "text": "Splątania", "correct": false}, {"letter": "B", "text": "Wieku >65 lat", "correct": false}, {"letter": "C", "text": "Liczby oddechów >30/min", "correct": false}, {"letter": "D", "text": "Ciśnienia skurczowego <120 mmHg lub rozkurczowego <60 mmHg", "correct": false}, {"letter": "E", "text": "Stężenia mocznika we krwi (urea)", "correct": true}], "type": "single"}, {"text": "Który lek należy do SABA (krótko działające beta2-mimetyki wziewne)?", "hint": "SABA: salbutamol, fenoterol, terbutalina (krótkie działanie 4–6 h). LABA: salmeterol, formoterol, indakaterol. SAMA: ipratropium. LAMA: tiotropium, glikopironium.", "options": [{"letter": "A", "text": "Indakaterol (LABA)", "correct": false}, {"letter": "B", "text": "Ipratropium (SAMA)", "correct": false}, {"letter": "C", "text": "Glikopironium (LAMA)", "correct": false}, {"letter": "D", "text": "Fenoterol", "correct": true}, {"letter": "E", "text": "Formoterol (LABA)", "correct": false}], "type": "single"}, {"text": "Test odwodnieniowy (test zagęszczania moczu) wykonujemy przy podejrzeniu:", "hint": "Test odwodnieniowy (water deprivation) — w diagnostyce moczówki prostej. U osób zdrowych: mocz się zagęszcza (osmolalność ↑). W DI: mocz pozostaje rozcieńczony. Następnie podaje się desmopresynę: postać ośrodkowa odpowiada, nefrogenna — nie.", "options": [{"letter": "A", "text": "Przewodnienia", "correct": false}, {"letter": "B", "text": "Niewydolności nerek", "correct": false}, {"letter": "C", "text": "SIADH", "correct": false}, {"letter": "D", "text": "Hiperaldosteronizmu pierwotnego", "correct": false}, {"letter": "E", "text": "Moczówki prostej", "correct": true}], "type": "single"}, {"text": "Kobieta 40 lat, leczona z powodu cukrzycy, sepsa po usunięciu zęba. Po poprawie: obrzęk płuc, gorączka 38,5°C, niedowład połowiczy lewostronny. Echo — wegetacja na zastawce mitralnej. W posiewach krwi — Staphylococcus aureus. Wskaż przyczynę:", "hint": "Triada infekcyjnego zapalenia wsierdzia: gorączka + wegetacja w ECHO + dodatni posiew krwi (S. aureus). Niedowład połowiczy — zator septyczny do mózgu. Zabieg stomatologiczny — typowe źródło zakażenia.", "options": [{"letter": "A", "text": "IZW", "correct": true}, {"letter": "B", "text": "Wstrząs septyczny", "correct": false}, {"letter": "C", "text": "Nabyta wada serca w wyniku infekcji", "correct": false}, {"letter": "D", "text": "Zatory tłuszczowe", "correct": false}, {"letter": "E", "text": "Obrzęk płuc z powodu przewodnienia", "correct": false}], "type": "single"}, {"text": "U 40-letniej pacjentki po operacji wątroby, zaintubowanej, z wentylacją mechaniczną i dużym PEEP, nagle tachykardia, zaburzenia rytmu, hipotonia, saturacja 60%. Najbardziej prawdopodobna przyczyna:", "hint": "Wysokie PEEP + wentylacja mechaniczna → zwiększone ryzyko odmy prężnej. Nagła hipotonia + desaturacja + tachykardia u pacjenta wentylowanego = podejrzenie odmy prężnej → pilna dekompresja.", "options": [{"letter": "A", "text": "Zator tętnicy płucnej", "correct": false}, {"letter": "B", "text": "Septyczne zapalenie wsierdzia", "correct": false}, {"letter": "C", "text": "Odma opłucnowa", "correct": true}, {"letter": "D", "text": "Udar mózgu", "correct": false}, {"letter": "E", "text": "Zawał serca", "correct": false}], "type": "single"}, {"text": "Do leków przeciwpłytkowych nie należy:", "hint": "Leki przeciwpłytkowe: ASA, inhibitory P2Y12 (klopidogrel, prasugrel, tikagrelor), blokery GP IIb/IIIa (abciksymab). Rywaroksaban to lek przeciwkrzepliwy (DOAC, inhibitor czynnika Xa).", "options": [{"letter": "A", "text": "Klopidogrel", "correct": false}, {"letter": "B", "text": "Bloker GP IIb/IIIa", "correct": false}, {"letter": "C", "text": "Prasugrel", "correct": false}, {"letter": "D", "text": "Kwas acetylosalicylowy", "correct": false}, {"letter": "E", "text": "Rywaroksaban", "correct": true}], "type": "single"}, {"text": "Stopień ciężkości obturacji — ciężki — oznacza FEV1:", "hint": "Stadia GOLD (FEV1% wartości należnej): I (łagodne) ≥80%, II (umiarkowane) 50–79%, III (ciężkie) 30–49%, IV (bardzo ciężkie) <30%.", "options": [{"letter": "A", "text": "<30%", "correct": false}, {"letter": "B", "text": ">50% i <80%", "correct": false}, {"letter": "C", "text": ">80%", "correct": false}, {"letter": "D", "text": "<20%", "correct": false}, {"letter": "E", "text": ">30% i <50%", "correct": true}], "type": "single"}, {"text": "U pacjenta z nawracającym bólem wieńcowym, bez zmian EKG świadczących o niedokrwieniu i prawidłowych troponinach — koronarografię należy wykonać:", "hint": "Stabilna dławica piersiowa (bez cech niedokrwienia w EKG, bez ↑troponin) → koronarografia w trybie planowym po wynikach badań nieinwazyjnych. <2 h — STEMI, <24 h — NSTEMI wysokiego ryzyka.", "options": [{"letter": "A", "text": "Nie ma wskazań", "correct": false}, {"letter": "B", "text": "Jak najszybciej, do 2h", "correct": false}, {"letter": "C", "text": "W trybie planowym", "correct": true}, {"letter": "D", "text": "W ciągu 24h od wystąpienia bólu", "correct": false}, {"letter": "E", "text": "W ciągu 48h od wystąpienia bólu", "correct": false}], "type": "single"}, {"text": "Zespół rakowiaka — napadowe zaczerwienienie skóry twarzy, tachykardia, zawroty głowy, biegunka. Nowotwór neuroendokrynny wytwarzający:", "hint": "Zespół rakowiaka = serotonina (5-HT) + tachykininy. Objawy: napadowe zaczerwienienie skóry (flushing), biegunka, skurcz oskrzeli, zmiany w sercu (prawe serce). Marker: 5-HIAA w moczu.", "options": [{"letter": "A", "text": "VIP", "correct": false}, {"letter": "B", "text": "Insulinę", "correct": false}, {"letter": "C", "text": "Tyreotropinę", "correct": false}, {"letter": "D", "text": "Serotoninę", "correct": true}, {"letter": "E", "text": "Leptynę", "correct": false}], "type": "single"}, {"text": "58-letnia kobieta, bóle brzucha, wymioty, wzdęcie, 5 dni bez stolca. RTG — liczne poziomy płynów i znaczne rozdęcie okrężnicy. Niedrożność jelita grubego spowodowana:", "hint": "Najczęstsza przyczyna niedrożności jelita grubego u pacjenta >50 lat = nowotwór (~60%), następnie skręt jelita i zwężenia w przebiegu uchyłkowatości. Dla jelita cienkiego — zrosty pooperacyjne.", "options": [{"letter": "A", "text": "Uchyłkami jelita grubego", "correct": false}, {"letter": "B", "text": "Połkniętym ciałem obcym", "correct": false}, {"letter": "C", "text": "Guzem nowotworowym", "correct": true}, {"letter": "D", "text": "Zrostami otrzewnowymi pooperacyjnymi", "correct": false}, {"letter": "E", "text": "Uchyłkiem Meckela", "correct": false}], "type": "single"}, {"text": "Przesiewowa kolonoskopia — guz odbytnicy na wysokości 11 cm, śr. 3 cm. Hist-pat: gruczolak kosmkowy. Postępowanie:", "hint": "Gruczolak kosmkowy — zmiana przedrakowa (~30% ryzyko transformacji złośliwej) → usunąć w całości endoskopowo (polipektomia/EMR/ESD). Leczenie operacyjne — wyłącznie przy niepowodzeniu endoskopii lub stwierdzeniu raka inwazyjnego.", "options": [{"letter": "A", "text": "Radioterapia na obszar miednicy", "correct": false}, {"letter": "B", "text": "Uspokoić — to nie jest zmiana nowotworowa, nie potrzebne leczenie", "correct": false}, {"letter": "C", "text": "Przednia resekcja odbytnicy", "correct": false}, {"letter": "D", "text": "Kontrolna kolonoskopia za 12 mies", "correct": false}, {"letter": "E", "text": "Polipektomia endoskopowa — usunięcie zmiany w całości", "correct": true}], "type": "single"}, {"text": "Niedokrwistość chorób przewlekłych:", "hint": "Niedokrwistość chorób przewlekłych (ACD): Fe ↓, TIBC ↓, ferrytyna ↑ (białko ostrej fazy), TSAT N/↓. IDA: Fe ↓↓, TIBC ↑, ferrytyna ↓, TSAT ↓↓. Główna różnica — ferrytyna.", "options": [{"letter": "A", "text": "Żelazo N/↑, TIBC N/↓, TSAT N/↑, Ferrytyna N/↑", "correct": false}, {"letter": "B", "text": "Żelazo ↓↓, TIBC ↑, TSAT ↓, Ferrytyna ↓ lub N", "correct": false}, {"letter": "C", "text": "Żelazo ↑, TIBC N, TSAT ↑, Ferrytyna ↑", "correct": false}, {"letter": "D", "text": "Żelazo N, TIBC N, TSAT N, Ferrytyna N", "correct": false}, {"letter": "E", "text": "Żelazo ↓, TIBC ↓, TSAT N lub ↓, Ferrytyna ↑ lub N", "correct": true}], "type": "single"}, {"text": "Rak jelita grubego — najczętsza lokalizacja:", "hint": "~30% raka jelita grubego lokalizuje się w odbytnicy, ~25% w esicy. Razem odbytnica + esica = ~55–60% wszystkich CRC. Wyjaśnia to dużą wartość diagnostyczną sigmoidoskopii.", "options": [{"letter": "A", "text": "Poprzecznica", "correct": false}, {"letter": "B", "text": "Wstępnica z kątnicą", "correct": false}, {"letter": "C", "text": "Esica", "correct": false}, {"letter": "D", "text": "Zstępnica", "correct": false}, {"letter": "E", "text": "Odbytnica", "correct": true}], "type": "single"}, {"text": "Hormonalnie czynny guz przysadki, który można skutecznie leczyć farmakologicznie, wytwarza:", "hint": "Prolactinoma — jedyny gruczolak przysadki skutecznie leczony farmakologicznie (kabergolina, bromokryptyna — agoniści D2). W pozostałych gruczolakach przysadki — głównie leczenie operacyjne.", "options": [{"letter": "A", "text": "Folikulotropinę (FSH)", "correct": false}, {"letter": "B", "text": "Kortykotropinę (ACTH)", "correct": false}, {"letter": "C", "text": "Hormon wzrostu (GH)", "correct": false}, {"letter": "D", "text": "Prolaktynę (PRL)", "correct": true}, {"letter": "E", "text": "Lutropinę (LH)", "correct": false}], "type": "single"}, {"text": "U pacjenta z pierwotną nadczynnością tarczycy stwierdzisz zmiany hormonalne:", "hint": "Pierwotna nadczynność tarczycy: ↑FT3/FT4 → ujemne sprzężenie zwrotne → ↓TSH, ↓TRH. Pierwotna niedoczynność tarczycy — odwrotnie: ↑TSH, ↓FT3/FT4.", "options": [{"letter": "A", "text": "TRH norma, TSH norma, FT3 obniżone, FT4 norma", "correct": false}, {"letter": "B", "text": "TRH obniżone, TSH obniżone, FT4 podwyższone, FT3 podwyższone", "correct": true}, {"letter": "C", "text": "TRH norma, TSH norma, FT3 norma, FT4 norma", "correct": false}, {"letter": "D", "text": "TRH podwyższone, TSH podwyższone, FT3 obniżone, FT4 obniżone", "correct": false}, {"letter": "E", "text": "TRH podwyższone, TSH norma, FT4 norma, FT3 podwyższone", "correct": false}], "type": "single"}, {"text": "Najczęstszy rak tarczycy u dorosłych:", "hint": "Rak tarczycy: brodawkowaty (~80%, najlepsze rokowanie), pęcherzykowy (~15%), rdzeniasty (~5%, MEN2), anaplastyczny (~1%, najgorsze rokowanie).", "options": [{"letter": "A", "text": "Rak rdzeniasty", "correct": false}, {"letter": "B", "text": "Rak brodawkowaty", "correct": true}, {"letter": "C", "text": "Rak pęcherzykowy", "correct": false}, {"letter": "D", "text": "Przerzuty raka z innych narządów", "correct": false}, {"letter": "E", "text": "Rak anaplastyczny", "correct": false}], "type": "single"}, {"text": "Wideotorakoskopia (VATS) to:", "hint": "VATS = Video-Assisted Thoracoscopic Surgery — małoinwazyjna chirurgia jamy opłucnej (biopsja, resekcja, dekortykacja). Dla jamy brzusznej — laparoskopia.", "options": [{"letter": "A", "text": "Rodzaj fibrobronchoskopii (bardziej zaawansowany)", "correct": false}, {"letter": "B", "text": "Małoinwazyjna forma chirurgii jamy otrzewnej", "correct": false}, {"letter": "C", "text": "Małoinwazyjna forma chi losporyna 3. generacji doustnie", "correct": false}], "type": "single"}, {"text": "U 12-miesięcznej dziewczynki rozpoznano grypę A. W poradni: nagły wzrost gorączki do 39,5°C i drgawki gorączkowe. W pierwszej kolejności należy:", "hint": "Aktywne drgawki gorączkowe u dziecka bez dostępu dożylnego → diazepam doodbytniczo (0,5 mg/kg) lub midazolam podpoliczkowo/donosowo. Jeśli napad >5 min — kontynuować leczenie.", "options": [{"letter": "A", "text": "Podać dziecku paracetamol doodbytniczo", "correct": false}, {"letter": "B", "text": "Położyć okład z zimnej wody na główkę", "correct": false}, {"letter": "C", "text": "Podać dziecku diazepam dożylnie", "correct": false}, {"letter": "D", "text": "Podać dziecku diazepam doodbytniczo", "correct": true}, {"letter": "E", "text": "Podać lek przeciwwirusowy oseltamivir", "correct": false}], "type": "single"}, {"text": "Które z poniższych stwierdzeń dotyczących kostniakomięsaka (osteosarcoma) u dzieci jest prawdziwe?", "hint": "Osteosarcoma = najczęstszy pierwotny nowotwór złośliwy kości u dzieci i młodzieży. Szczyt zachorowań 10.–20. r.ż. (okres skoku wzrostowego), M > K, typowo — dalsza przynasada kości udowej/bliższa piszczeli (okolica kolana).", "options": [{"letter": "A", "text": "Ognisko pierwotne rozwija się zwykle w przynasadzie bliższej kości udowej", "correct": false}, {"letter": "B", "text": "Jest to najczęstszy nowotwór złośliwy kości u dzieci", "correct": true}, {"letter": "C", "text": "Szczyt zachorowań przypada na 6-8 rok życia", "correct": false}, {"letter": "D", "text": "Pacjenci są zwykle niskorośli", "correct": false}, {"letter": "E", "text": "Występuje dwukrotnie częściej u dziewcząt niż u chłopców", "correct": false}], "type": "single"}, {"text": "Najczęstszy nowotwór w populacji dziecięcej:", "hint": "Białaczki (~30% nowotworów u dzieci), głównie ALL (~80% wszystkich białaczek). Następnie guzy OUN (~25%) i chłoniaki.", "options": [{"letter": "A", "text": "Rak jajnika", "correct": false}, {"letter": "B", "t ina pępkowa, ochrypły płacz, hipotonia, ZAPARCIA (NIE biegunka!), hipotermia, słabe ssanie.", "items": ["Chrypka", "Przepuklina pępkowa", "Biegunka", "Długa żółtaczka", "Duży język", "Obniżone napięcie mięśniowe"], "options": [{"letter": "A", "text": "1, 2, 3, 6", "correct": false}, {"letter": "B", "text": "1, 2, 3, 4, 5, 6", "correct": false}, {"letter": "C", "text": "1, 2, 4, 5, 6", "correct": true}, {"letter": "D", "text": "1, 4, 5, 6", "correct": false}], "type": "single"}, {"text": "U 7-miesięcznego dziecka zapalenie płuc poprzedzone kilkoma dniami kaszlu i nieżytu nosa. Gorączka do 38,5°C, zmiany zapalne nad płucami, brak duszności. Saturacja 98%. Antybiotyk pierwszego wyboru:", "hint": "CAP u dziecka >3 m.ż. bez ciężkich objawów → amoksycylina 80–90 mg/kg/d p.o. (S. pneumoniae — główny patogen). Makrolidy dodaje się przy podejrzeniu zakażenia atypowego.", "options": [{"letter": "A", "text": "Amoksycylina", "correct": true}, {"letter": "B", "text": "Trimetoprym z sulfametoksazolem", "correct": false}, {"letter": "C", "text": "Amoksycylina z kwasem klawulanowym", "correct": false}, {"letter": "D", "text": "Klarytromycyna", "correct": false}, {"letter": "E", "text": "Cefuroksym", "correct": false}], "type": "single"}, {"text": "NT u dzieci rozpoznaje się:", "hint": "AHA/AAP: NT u dzieci = SBP/DBP ≥95. percentyla dla wieku, płci i wzrostu — w 3 niezależnych pomiarach. Tabele percentyli ciśnienia (4th Task Force).", "options": [{"letter": "A", "text": "W 3 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku i płci", "correct": false}, {"letter": "B", "text": "W 3 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku, płci i wzrostu", "correct": true}, {"letter": "C", "text": "W 5 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku, płci i wzrostu", "correct": false}, {"letter": "D", "text": "W 3 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku i wzrostu", "correct": false}, {"letter": "E", "text": "W 5 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku", "correct": false}], "type": "single"}, {"text": "Kryteria klasyfikacyjne choroby Kawasaki:", "hint": "Choroba Kawasaki: gorączka ≥5 dni + ≥4 z 5: (1) zmiany warg/jamy ustnej (malinowy język), (2) nieropne zapalenie spojówek, (3) wysypka, (4) zmiany kończyn, (5) limfadenopatia szyjna >1,5 cm. Hepatosplenomegalia nie jest kryterium.", "items": ["Malinowy język", "Powiększone szyjne węzły chłonne >1,5 cm", "Zapalenie spojówek nieropne", "Przekrwienie śluzowej jamy ustnej oraz gardła", "Wysypka polimorficzna niepęcherzykowa na ciele", "Zmiany na dłoniach i stopach (rumień i obrzęk), który potem się łuszczy", "Powiększenie wątroby i śledziony"], "options": [{"letter": "A", "text": "1, 2, 3, 4", "correct": false}, {"letter": "B", "text": "1, 3, 4, 5, 6, 7", "correct": false}, {"letter": "C", "text": "1, 2, 3, 4, 5, 6", "correct": true}, {"letter": "D", "text": "1, 2, 5, 6", "correct": false}], "type": "single"}, {"text": "Leczenie choroby Kawasaki:", "hint": "Standard leczenia choroby Kawasaki (AHA 2017): IVIG 2 g/kg w pojedynczym wlewie + ASA 30–50 mg/kg/d w fazie ostrej → 3–5 mg/kg/d (mała dawka) po ≥48 h bez gorączki. GKS (prednizolon) — rozważane w terapii POCZĄTKOWEJ u pacjentów wysokiego ryzyka (skale Kobayashi/Egami/Sano) lub przy oporności na IVIG. Infliksymab/cyklosporyna → przy oporności na IVIG+GKS.", "items": ["Ig dożylnie", "Kwas acetylosalicylowy", "GKS", "Heparyna drobnocząsteczkowa"], "options": [{"letter": "A", "text": "1, 2", "correct": true}, {"letter": "B", "text": "1, 2, 3", "correct": false}, {"letter": "C", "text": "1, 2, 3, 4", "correct": false}, {"letter": "D", "text": "Tylko 1", "correct": false}], "type": "single"}, {"text": "Objawy celiakii u dzieci:", "hint": "Celiakia = objawy klasyczne (biegunka, FTT, wzdęcia) + objawy pozajelitowe (niedokrwistość z niedoboru Fe, hipoplazja szkliwa, nawracające afty, opryszczkowate zapalenie skóry Duhringa, niskorosłość, zaburzenia neuropsychiatryczne). Wszystkie 6 to typowe manifestacje.", "items": ["Hipoplazja szkliwa", "Anemia", "Nawracające afty", "Zaburzenia zachowania, depresja", "Wzdęcia brzucha", "Opóźnienie lub zahamowanie wzrastania"], "options": [{"letter": "A", "text": "1, 2, 3, 4, 5, 6", "correct": true}], "type": "single"}, {"text": "Dziecko 4 mies., 6 kg, wstrząs hipowolemiczny z powodu biegunki. Wstępna dawka przetaczanych płynów:", "hint": "Bolus we wstrząsie u dzieci: 20 ml/kg 0,9% NaCl/mleczanu Ringera szybko (5–10 min), w razie potrzeby powtórzyć do 60 ml/kg. 6 kg × 20 ml/kg = 120 ml.", "options": [{"letter": "A", "text": "500 ml", "correct": false}, {"letter": "B", "text": "60 ml", "correct": false}, {"letter": "C", "text": "120 ml", "correct": true}, {"letter": "D", "text": "40 ml", "correct": false}, {"letter": "E", "text": "240 ml", "correct": false}], "type": "single"}, {"text": "Zaznacz prawidłowe odpowiedzi dotyczące wgłobienia jelita:", "hint": "Wgłobienie — szczyt zachorowań między 6. m.ż. a 2. r.ż. Objawy: kolkowy ból brzucha, wymioty, malinowy galaretowaty stolec. Leczenie: odgłobienie hydrostatyczne/pneumatyczne pod kontrolą USG/RTG; leczenie operacyjne — przy perforacji/niepowodzeniu zachowawczego.", "options": [{"letter": "A", "text": "W diagnostyce konieczna jest scyntygrafia jelit", "correct": false}, {"letter": "B", "text": "Leczenie operacyjne polega na usunięciu jelita grubego i wyłonieniu przetoki jelitowej", "correct": false}, {"letter": "C", "text": "75% przypadków występuje u dzieci po 14. roku życia", "correct": false}, {"letter": "D", "text": "Leczenie zachowawcze polega na odgłobieniu jelita pod kontrolą USG za pomocą wlewu doodbytniczego 0,9% NaCl lub zawiesiny barytowej", "correct": true}, {"letter": "E", "text": "Typowym objawem są zaparcia", "correct": false}], "type": "single"}, {"text": "Na SOR trafił 13-letni pacjent z ostrym bólem jądra od 4 godzin, po wysiłku fizycznym. Silna tkliwość, obrzęk i zaczerwienienie moszny, wysokie i poprzeczne ustawienie jądra. Rozpoznanie:", "hint": "Skręt jądra — nagły ból + obrzęk + wysokie poprzeczne ustawienie jądra + ujemny objaw Prehna + zniesienie odruchu nosidłowego. Wymaga pilnej operacji w ciągu 6 h (później — martwica).", "options": [{"letter": "A", "text": "Wnętrostwo", "correct": false}, {"letter": "B", "text": "Zapalenie najądrza", "correct": false}, {"letter": "C", "text": "Żylaki powrózka nasiennego", "correct": false}, {"letter": "D", "text": "Skręt jądra", "correct": true}, {"letter": "E", "text": "Wodniak jądra", "correct": false}], "type": "single"}, {"text": "Do lekarza zgłasza się matka z 4-letnim synem — otyłość, olbrzymi apetyt od 2-3 r.ż. Jako niemowlę: obniżone napięcie mięśniowe, słabe ssanie. Opóźnienie intelektualne. W badaniu: niski wzrost, obustronne wnętrostwo, małe prącie, małe dłonie i stopy, jasna karnacja. Rozpoznanie:", "hint": "Zespół Pradera-Willego (delecja 15q11–q13 pochodzenia ojcowskiego): noworodkowa hipotonia + słabe ssanie → hiperfagia od 2.–3. r.ż. → otyłość, niski wzrost, hipogonadyzm, małe kończyny, jasna karnacja, niepełnosprawność intelektualna.", "options": [{"letter": "A", "text": "Zespół Marfana", "correct": false}, {"letter": "B", "text": "Zespół Pradera-Willego", "correct": true}, {"letter": "C", "text": "Zespół Klinefeltera", "correct": false}, {"letter": "D", "text": "Zespół Silver-Russela", "correct": false}, {"letter": "E", "text": "Zespół Downa", "correct": false}], "type": "single"}, {"text": "U 2-letniego chłopca — brak apetytu, nudności, bóle brzucha. USG: guz przemieszczający lewą nerkę przednio-bocznie i ku dołowi. TK: guz z ogniskami martwicy, wylewami krwawymi i zwapnieniami. Rozpoznanie:", "hint": "Neuroblastoma (nadnercze lub łańcuch współczulny) — guz zaotrzewnowy PRZEMIESZCZAJĄCY nerkę (nie wewnątrznerkowy), ze zwapnieniami, wylewami krwawymi i ogniskami martwicy. Guz Wilmsa — odwrotnie — wywodzi się Z nerki, bez zwapnień. Markery: VMA/HVA w moczu.", "options": [{"letter": "A", "text": "Hepatoblastoma", "correct": false}, {"letter": "B", "text": "Neuroblastoma", "correct": true}, {"letter": "C", "text": "Chłoniak Hodgkina", "correct": false}, {"letter": "D", "text": "Guz Wilmsa", "correct": false}, {"letter": "E", "text": "Retinoblastoma", "correct": false}], "type": "single"}, {"text": "Niemowlę 5 mies., gorączkuje do 38,5°C od 3 dni. Brak kataru, kaszlu, biegunki, wymiotów, wysypki. RTG klp — norma. Najbardziej prawdopodobna przyczyna gorączki:", "hint": "Gorączka bez uchwytnej przyczyny (FWS) u niemowlęcia — najczęstsza przyczyna = ZUM (~7% dziewczynek, ~2% chłopców). Obowiązkowy posiew moczu (cewnik/nakłucie nadłonowe). Roseola (gorączka trzydniowa) — wysypka pojawia się zwykle po ustąpieniu gorączki.", "options": [{"letter": "A", "text": "Choroba zakaźna — gorączka trzydniowa", "correct": false}, {"letter": "B", "text": "Białaczka", "correct": false}, {"letter": "C", "text": "Zapalenie płuc", "correct": false}, {"letter": "D", "text": "Mononukleoza", "correct": false}, {"letter": "E", "text": "Zakażenie układu moczowego", "correct": true}], "type": "single"}, {"text": "Podstawowym zagrożeniem dla dzieci z nadciśnieniem wrotnym jest:", "hint": "Głównym powikłaniem zagrażającym życiu w nadciśnieniu wrotnym są żylaki przełyku z masywnym krwawieniem. Badanie przesiewowe — endoskopia, profilaktyka — β-blokery, opaskowanie żylaków (banding).", "options": [{"letter": "A", "text": "Krwotok z żylaków przełyku", "correct": true}, {"letter": "B", "text": "Marskość wątroby", "correct": false}, {"letter": "C", "text": "Zespół Budda-Chiariego", "correct": false}, {"letter": "D", "text": "Niedobór masy ciała", "correct": false}, {"letter": "E", "text": "Zakrzepica żyły wrotnej", "correct": false}], "type": "single"}, {"text": "Pierwszym charakterystycznym objawem krzywicy u 4-miesięcznego niemowlęcia jest:", "hint": "Pierwszy objaw krzywicy u niemowlęcia = craniotabes (rozmiękanie potylicy) — uczucie \"piłki pingpongowej\". Później: różaniec krzywiczy, bransoletki  "Najczęstsza przyczyna niedrożności jelita cienkiego u pacjenta po laparotomii to zrosty pooperacyjne (~60–75%). Następnie przepukliny i nowotwory.", "options": [{"letter": "A", "text": "Rak jelita grubego", "correct": false}, {"letter": "B", "text": "Uwięźnięcie przepukliny", "correct": false}, {"letter": "C", "text": "Ropień okołoodbytniczy", "correct": false}, {"letter": "D", "text": "Nawrotowy mięśniak miednicy mniejszej", "correct": false}, {"letter": "E", "text": "Zrosty pooperacyjne", "correct": true}], "type": "single"}, {"text": "Co nie jest wskazaniem do operacji na przydatkach?", "hint": "Wszystkie wymienione (endometrioza, torbiele, wodniak jajowodu, ropień) są potencjalnymi wskazaniami do operacji w określonych sytuacjach (objawy, wielkość, nieskuteczność leczenia zachowawczego).", "options": [{"letter": "A", "text": "Endometrioza", "correct": false}, {"letter": "B", "text": "Torbiele jajnika/jajowodu", "correct": false}, {"letter": "C", "text": "Wodniaki jajowodu", "correct": false}, {"letter": "D", "text": "Ropnie jajnika/jajowodu", "correct": false}, {"letter": "E", "text": "Wszystkie są wskazaniem do operacji na przydatkach (w określonych przypadkach)", "correct": true}], "type": "single"}, {"text": "Wskaż zdanie fałszywe dotyczące leczenia raka jajnika:", "hint": "Radioterapia w raku jajnika NIE jest szeroko stosowana (guz względnie radiooporny; ograniczona rola). Podstawa leczenia: maksymalna cytoredukcja + chemioterapia (platyna/taksany) ± bewacyzumab ± inhibitory PARP.", "options": [{"letter": "A", "text": "Podstawą leczenia jest maksymalna cytoredukcja — usunięcie wszystkich makroskopowych ognisk", "correct": false}, {"letter": "B", "text": "Chore bez możliwości radykalnego leczenia operacyjnego otrzymują chemioterapię neoadjuwantową; po 3 cyklach — ponowna weryfikacja wskazań", "correct": false}, {"letter": "C", "text": "W stopniu FIGO I stosuje się uzupełniającą chemioterapię: 6 cykli paklitakselu i pochodnych platyny", "correct": false}, {" cją wirusem HPV", "correct": true}, {"letter": "D", "text": "rak sromu u osób starszych zwykle powstaje na podłożu VIN niezróżnicowanej", "correct": false}, {"letter": "E", "text": "rak sromu stanowi 2,5-5% wszystkich nowotworów kobiecego układu płciowego", "correct": false}], "type": "single"}, {"text": "Mężczyzna, wiek ok 59 lat, bez cech chorób przewlekłych, o 7:15 pogorszenie stanu — ból za mostkiem, irradiacja do żuchwy, EKG-podniesienie ST w V1-V4. Postępowanie:", "hint": "Przedni STEMI (ESC 2023): DAPT — ASA 150–300 mg + tikagrelor 180 mg (lub prasugrel 60 mg / klopidogrel 600 mg) + antykoagulant (HNF/enoksaparyna) + morfina 4–8 mg i.v. w razie silnego bólu + nitrogliceryna s.l./i.v. (NIE przy RK-MI, SBP <90) + tlen TYLKO przy SaO₂ <90% + pilna pPCI <120 min od FMC. Stara „MONA\" jest przestarzała — kluczowy jest inhibitor P2Y12.", "options": [{"letter": "A", "text": "nitrogliceryna, ASA 150-300, heparina, morfina", "correct": true}], "type": "single"}, {"text": "Jakie insuliny stosujemy w pompie + czujnik u dziecka:", "hint": "W pompach insulinowych stosuje się wyłącznie analogi ultrakrótkodziałające (aspart, lispro, glulizyna) — zapewniają zarówno dawkę bazową, jak i bolus. Insuliny długodziałające nie są stosowane.", "options": [{"letter": "A", "text": "długodziałające", "correct": false}, {"letter": "B", "text": "szybkodziałające", "correct": true}, {"letter": "C", "text": "krótkodziałające w zależności od potrzeby po posiłku", "correct": false}, {"letter": "D", "text": "krótkodziałające regularne co 30 min", "correct": false}, {"letter": "E", "text": "krótkodziałające regularne co 1 min", "correct": false}], "type": "single"}, {"text": "Rokowanie w ostrej białaczce u dzieci. Rokowanie pomyślne:", "hint": "Według NCI korzystne czynniki rokownicze w ALL: wiek 1-10 lat, leukocyty <50 000/μl w momencie rozpoznania, immunofenotyp linii B, hiperdiploidia.", "options": [{"letter": "A", "text": "jak zachorował po 10 roku życia", "correct": false}, {"letter": "B", "text": "jak wiek od 5 do 10 lat", "correct": false}, {"letter": "C", "text": "jak leukocyty < 10 000", "correct": false}, {"letter": "D", "text": "jak leukocyty < 50 000", "correct": true}, {"letter": "E", "text": "do 5 lat", "correct": false}], "type": "single"}, {"text": "Co potwierdzi rozpoznanie dny moczanowej (\"złoty standard\"):", "hint": "Złoty standard diagnostyki dny moczanowej — wykrycie igłokowatych kryształów kwasu moczowego z ujemnym dwójłomem w płynie stawowym w mikroskopii polaryzacyjnej.", "options": [{"letter": "A", "text": "obecność kryształów kwasu moczowego w płynie stawowym", "correct": true}, {"letter": "B", "text": "RTG szczelina zwężona", "correct": false}, {"letter": "C", "text": "RF", "correct": false}, {"letter": "D", "text": "stężenie kwasu moczowego w krwi", "correct": false}, {"letter": "E", "text": "zapalenie stawu śródstopno-paliczkowego palucha", "correct": false}], "type": "single"}, {"text": "Czego nie spodziewamy się w chorobie Addisona / zespół Conna:", "hint": "Hipomagnezemia nie jest typowa ani dla choroby Addisona (spodziewamy się hyperK, hypoNa, kwasicy), ani dla typowego zespołu Conna (hypoK, hyperNa, zasadowicy).", "options": [{"letter": "A", "text": "hyperkalemia", "correct": false}, {"letter": "B", "text": "hypomagnesemia", "correct": true}, {"letter": "C", "text": "hyponatriemia", "correct": false}, {"letter": "D", "text": "zasadowica met", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "III stopień w skali Fontaine'a charakteryzuje się:", "hint": "Skala Fontaine'a dla ChTT (PAD): I — bezobjawowo, IIa — chromanie >200 m, IIb — <200 m, III — BÓL W SPOCZYNKU, IV — owrzodzenia troficzne/zgorzel.", "options": [{"letter": "A", "text": "ból spoczynkowy", "correct": true}, {"letter": "B", "text": "ból po przejściu 100 m", "correct": false}, {"letter": "C", "text": "owrzodzenia", "correct": false}, {"letter": "D", "text": "ból po przejściu > 200 m", "correct": false}, {"letter": "E", "text": "ból po przejściu < 200 m", "correct": false}], "type": "single"}, {"text": "Najczęstszą postacią zakażeń u noworodka jest:", "hint": "Sepsa (wczesna/późna noworodkowa) — najczęstsza patologia infekcyjna noworodków. Patogeny: GBS, E.coli, Listeria (wczesna); gronkowce koagulazoujemne (późna).", "options": [{"letter": "A", "text": "bakteryjne zapalenie skóry", "correct": false}, {"letter": "B", "text": "zapalenie opon mózgowo rdzeniowych", "correct": false}, {"letter": "C", "text": "posocznica", "correct": true}, {"letter": "D", "text": "bakteryjne zapalenie płuc", "correct": false}, {"letter": "E", "text": "zakażenie układu moczowego", "correct": false}], "type": "single"}, {"text": "U pacjentów w pozaszpitalnym zapaleniu płuc o etiologii bakteryjnej zakwalifikowanych do leczenia w warunkach szpitalnych we wstępnie stosowanej antybiotykoterapii empirycznej leczenie z wyboru jest:", "hint": "Empiryczna terapia pozaszpitalnego zapalenia płuc w szpitalu: β-laktam (amoksycylina/kwas klawulanowy, ceftriakson) + makrolid (azytromycyna/klarytromycyna) — pokrywa pneumokoki i patogeny atypowe.", "options": [{"letter": "A", "text": "tetracyklina-flukanazol", "correct": false}, {"letter": "B", "text": "ß-laktam-aminoglikozyd", "correct": false}, {"letter": "C", "text": "fluorochinolon-aminoglikozyd", "correct": false}, {"letter": "D", "text": "ß-laktam-makrolid", "correct": true}, {"letter": "E", "text": "aminoglikozyd-makrolid", "correct": false}], "type": "single"}, {"text": "Profilaktyka zakażeń dróg oddechowych u dzieci z dysplazją płucną:", "hint": "Paliwizumab (przeciwciała monoklonalne przeciw RSV) stosuje się co miesiąc w sezonie RSV u dzieci z BPD, wcześniaków i przy hemodynamicznie istotnych wrodzonych wadach serca do 2. roku życia.", "options": [{"letter": "A", "text": "szczepionka rsv w 2 tyg życia", "correct": false}, {"letter": "B", "text": "podanie paliwizumabu przeciwko RSV do 2 roku życia", "correct": true}, {"letter": "C", "text": "GKS wziewnie do 3 m.ż.", "correct": false}, {"letter": "D", "text": "antybiotykoterapia pierwsze 2 tyg. życia", "correct": false}, {"letter": "E", "text": "immunoglobuliny", "correct": false}], "type": "single"}, {"text": "Powikłaniem po operacji tarczycy nie jest:", "hint": "Nerw twarzowy jest anatomicznie oddalony od tarczycy. Typowe powikłania tyreoidektomii: uszkodzenie nerwu krtaniowego wstecznego, niedoczynność przytarczyc/hipokalcemia, krwawienie, bliznowiec.", "options": [{"letter": "A", "text": "krwawienie", "correct": false}, {"letter": "B", "text": "bliznowiec", "correct": false}, {"letter": "C", "text": "choroba porażenia nerwów krtaniowych wstecznych", "correct": false}, {"letter": "D", "text": "pooperacyjna hipokalcemia", "correct": false}, {"letter": "E", "text": "porażenie ośrodkowe nerwu twarzowego", "correct": true}], "type": "single"}, {"text": "Do poradni ginekologicznej, 33 letnia kobieta, nawracające poronienia, za 2 lata — 3 razy przed 10 tyg., są epizod przebytej zakrzepicy żył kończyny dolnej 3 lata temu. USG — norma, ogląd — norma, jakie badania zlecimy?", "hint": "Nawykowe poronienia + wywiad ŻChZZ = podejrzenie APS. Badamy: przeciwciała antykardiolipinowe (aCL), anty-β2-GP1, antykoagulant toczniowy (LA), klasy IgM/IgG, dwukrotnie w odstępie ≥12 tygodni.", "options": [{"letter": "A", "text": "Mutacja genu FMR1", "correct": false}, {"letter": "B", "text": "P/C, aCC, ab2GPI w klasie Ig M i G oraz LA", "correct": true}, {"letter": "C", "text": "przeciwciała do toxoplazmozu", "correct": false}, {"letter": "D", "text": "BRCA 2", "correct": false}, {"letter": "E", "text": "cytomegalowirus", "correct": false}], "type": "single"}, {"text": "Powikłaniem nadciśnienia tętniczego nie jest:", "hint": "ZP jest powikłaniem zakrzepicy żylnej (triada Virchowa), a NIE nadciśnienia tętniczego. NT prowadzi do zawału serca, udaru, rozwarstwienia aorty, retinopatii, PChN.", "options": [{"letter": "A", "text": "zator tętnic płucnych", "correct": true}, {"letter": "B", "text": "zawał serca", "correct": false}, {"letter": "C", "text": "rozwarstwienie aorty", "correct": false}, {"letter": "D", "text": "wylew w siatkówkę", "correct": false}, {"letter": "E", "text": "udar mozgu", "correct": false}], "type": "single"}, {"text": "Triada Virchowa to model opisujący trzy główne czynniki sprzyjające powstawaniu zakrzepicy żylnej: zwolnienie przepływu krwi zmiany składu krwi (np. podwyższony hematokryt) uszkodzenie ściany naczynia (śródbłonka) wzrost ciśnienia krwi wzrost stężenia potasu w surowicy", "hint": "Triada Virchowa: 1) zastój żylny, 2) nadkrzepliwość, 3) uszkodzenie śródbłonka. Ciśnienie tętnicze i potas nie należą do triady.", "options": [{"letter": "A", "text": "3,4,5", "correct": false}, {"letter": "B", "text": "1,2,3", "correct": true}, {"letter": "C", "text": "2,3,4", "correct": false}, {"letter": "D", "text": "3,4,5", "correct": false}, {"letter": "E", "text": "1,3,5", "correct": false}], "type": "single"}, {"text": "Które z poniższych stwierdzeń dotyczących CA-125 jest błędne?", "hint": "CA-125 NIE jest stosowany w skriningu raka jajnika w populacji ogólnej (niska swoistość); używa się go do monitorowania terapii i w grupach ryzyka (BRCA+).", "options": [{"letter": "A", "text": "CA-125 jest najczęściej związany z rakiem jajnika", "correct": false}, {"letter": "B", "text": "CA-125 jest wykorzystywany do screeningu w kierunku raka jajnika", "correct": true}, {"letter": "C", "text": "CA-125 może być podwyższony w endometriozie", "correct": false}, {"letter": "D", "text": "CA-125 ma podwyższone stężenie po zakończeniu chemioterapii w leczeniu raka jajnika", "correct": false}, {"letter": "E", "text": "CA-125 może być podwyższone przy marskości wątroby", "correct": false}], "type": "single"}, {"text": "Na izbę przyjęć została przyjęta 50-letnia kobieta z bólem głowy. Bez wcześniejszych chorób, bez innych dolegliwości. Podczas badania USG stwierdzono zmiany. Pozostałe badania laboratoryjne nie wykazały istotnych odchyleń od normy. Jak
