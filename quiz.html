ja Hinchey I-II. Wolna perforacja i zapalenie otrzewnej — rzadziej, ale groźniejsze.", "options": [{"letter": "A", "text": "ropień", "correct": true}, {"letter": "B", "text": "mikroperforacja", "correct": false}, {"letter": "C", "text": "zrosy", "correct": false}, {"letter": "D", "text": "zapalenie otrzewnej", "correct": false}, {"letter": "E", "text": "niedrożność jelitowa", "correct": false}], "type": "single"}, {"text": "Niemiarowość zupełna w EKG oznacza:", "hint": "„Całkowita niemiarowość\" (arrhythmia absoluta) = bezwzględnie nieregularne odstępy R-R + brak załamków P — charakterystyczna dla migotania przedsionków.", "options": [{"letter": "A", "text": "całkowicie nieprawidłowe odstępy RR, charakterystyczne dla migotania przedsionków", "correct": true}, {"letter": "B", "text": "tachikardia", "correct": false}, {"letter": "C", "text": "bradykardia", "correct": false}, {"letter": "D", "text": "częściowo nieprawidłowe odstępy RR", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Kobieta z biegunką, ustępuje po IPP:", "hint": "Biegunka ustępująca po IPP — patognomiczne dla gastrinomy (zespół Zollingera-Ellisona). Nadmierny gastryna → hipersekrecja HCl → uszkodzenie śluzówki jelita cienkiego + inaktywacja lipaz → tłuszczowa biegunka i wrzody oporne na leczenie. IPP blokuje hipersekrecję HCl → ustępuje biegunka. Glukagonoma powoduje cukrzycę i nekrotyczny rumień wędrujący (4D: Dermatitis, Diabetes, DVT, Depression) — NIE biegunkę zależną od IPP. UWAGA: pełna lista opcji nieznana — opcja „e\\\" ustawiona jako [AI].", "options": [{"letter": "A", "text": "glukagonoma", "correct": false}, {"letter": "B", "text": "WZJG", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "gastrinoma (ZZE) [AI]", "correct": true}], "type": "single"}, {"text": "Złamanie Galeazziego dotyczy:", "hint": "Złamanie Galeazziego = złamanie dalszej 1/3 kości promieniowej + zwichnięcie w dystalnym stawie promieniowo-łokciowym. Złamanie Monteggia (lustrzane) — złamanie kości łokciowej + zwichnięcie głowy kości promieniowej.", "options": [{"letter": "A", "text": "złamania trzonu kości promieniowej w jej 1/3 dalszej części, z jednoczesnym zwichnięciem stawu promieniowo-łokciowego dalszego", "correct": true}, {"letter": "B", "text": "?", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Najczęstszy rak wątroby?", "hint": "HCC (rak wątrobowokomórkowy) — najczęstszy pierwotny nowotwór wątroby (~85-90%). Główne czynniki ryzyka: marskość wątroby każdej etiologii, HBV, HCV, alkohol, NAFLD.", "options": [{"letter": "A", "text": "HCC — Rak wątrobowokomórkowy", "correct": true}, {"letter": "B", "text": "?", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Różyczka u noworodka — profilaktyka, szczepienie dzieci?", "hint": "Profilaktyka wrodzonej różyczki — masowe szczepienia MMR dzieci i weryfikacja odporności kobiet przed ciążą. Szczepionka w ciąży jest PRZECIWWSKAZANA (żywa atenuowana).", "options": [{"letter": "129", "text": "Różyczka u noworodka — profilaktyka, szczepienie dzieci?", "correct": false}], "correct_text": "Profilaktyka — szczepienie MMR (świnka-odra-różyczka). W Polsce: I dawka w 13-14 m.ż., II dawka w 6 r.ż. Szczepionka żywa atenuowana, przeciwwskazana w ciąży. Zapobiega różyczce wrodzonej (CRS).", "type": "reveal_with_options"}, {"text": "Jaki oocyt po oddzieleniu pierwszego ciałka kierunkowego?", "hint": "Po odłączeniu 1. ciałka kierunkowego oocyt I rzędu staje się OOCYTEM II RZĘDU (haploidalny 23, 2c), który zatrzymuje się w metafazie II do momentu zapłodnienia.", "options": [{"letter": "130", "text": "Jaki oocyt po oddzieleniu pierwszego ciałka kierunkowego?", "correct": false}], "correct_text": "Oocyt II rzędu (drugiego rzędu) — zatrzymany w metafazie II mejozy. Ukończenie mejozy II następuje dopiero po zapłodnieniu z wytworzeniem drugiego ciałka kierunkowego.", "type": "reveal_with_options"}, {"text": "Ocenianie ukrwienia kończyny — palpacja na różnych tętnicach — jakich?", "hint": "Do oceny ukrwienia kończyny dolnej palpuje się kolejno: tętnicę udową, podkolanową, piszczelową tylną i grzbietową stopy. Dla kończyny górnej — ramienną, promieniową, łokciową.", "options": [{"letter": "131", "text": "Ocenianie ukrwienia kończyny — palpacja na różnych tętnicach — jakich?", "correct": false}], "correct_text": "Kończyna dolna: t. udowa (a. femoralis), t. podkolanowa (a. poplitea), t. piszczelowa tylna (a. tibialis posterior — za kostką przyśrodkową), t. grzbietowa stopy (a. dorsalis pedis). Kończyna górna: t. ramienna, t. promieniowa, t. łokciowa.", "type": "reveal_with_options"}, {"text": "Operacja przy otyłości — jelitowo-jelitowo-jelitowo — z bazy (Roux-en-Y)", "hint": "Bypass żołądkowy Roux-en-Y: wytworzenie małego zbiornika żołądkowego + zespolenie jelita czczego w kształcie litery Y. Kombinacja mechanizmu restrykcyjnego i upośledzonego wchłaniania w redukcji masy ciała.", "options": [{"letter": "132", "text": "Operacja przy otyłości — jelitowo-jelitowo-jelitowo — z bazy (Roux-en-Y)", "correct": false}], "correct_text": "Roux-en-Y gastric bypass (RYGB) — wyłączenie żołądkowe z zespoleniem typu Roux-Y. Tworzy się mały zbiornik żołądkowy zespolony z pętlą jelita czczego (Roux), a pozostała część dwunastnicy/jelita czczego z sokami trawiennymi zespala się \"bok do boku\" niżej, tworząc kształt Y.", "type": "reveal_with_options"}, {"text": "Dziecko hipoglikemia w świadomości — sok?", "hint": "W hipoglikemii u dziecka PRZYTOMNEGO — reguła 15: 15 g szybkich węglowodanów doustnie (sok, glukoza), pomiar glikemii powtórzyć po 15 min. Glukagon tylko przy utracie przytomności.", "options": [{"letter": "133", "text": "Dziecko hipoglikemia w świadomości — sok?", "correct": false}], "correct_text": "TAK — przytomne dziecko z hipoglikemią: 10-15 g szybko wchłanianych węglowodanów doustnie (sok owocowy, glukoza w tabletkach, miód). Po 15 min — kontrola glikemii. Glukagon zarezerwowany dla NIEPRZYTOMNYCH.", "type": "reveal_with_options"}, {"text": "Szwy na szyjce macicy — kiedy nakładamy? Niewydolności cieśniowo-szyjkowej (anamneza późnych poronień / przedwczesnych porodów) Skrócenie szyjki <25 mm w II trymestrze + wywiad przedwczesnego porodu Profilaktycznie 12-14 t.c.; ratowniczo do 24 t.c. (rescue cerclage)", "hint": "Szew szyjki macicy (cerklarz) wskazany przy niewydolności cieśniowo-szyjkowej: profilaktycznie w 12-14 tyg. przy obciążonym wywiadzie, przy skróceniu szyjki macicy <25 mm w II trymestrze lub ratunkowy (rescue) do 24 tyg.", "options": [{"letter": "134", "text": "Szwy na szyjce macicy — kiedy nakładamy?", "correct": false}], "correct_text": "Cerclage szyjki macicy (np. McDonald, Shirodkar) zakładamy przy:", "type": "reveal_with_options"}, {"text": "Homans — kiedy?", "hint": "Objaw Homansa (ból łydki przy grzbietowym zgięciu stopy) stosowano przy podejrzeniu zakrzepicy żył głębokich podudzia. W nowoczesnej praktyce nieprzydatny z powodu niskiej czułości — zastąpiony skalą Wells + D-dimerem + USG.", "options": [{"letter": "135", "text": "Homans — kiedy?", "correct": false}], "correct_text": "Objaw Homansa — ból w łydce przy zgięciu grzbietowym stopy, badamy przy podejrzeniu zakrzepicy żył głębokich (ZŻG). UWAGA: ma niską czułość i swoistość (~40-50%), nie jest wystarczający do rozpoznania ZŻG, dziś rzadko stosowany.", "type": "reveal_with_options"}, {"text": "Skala CHADS-VASc C — Congestive HF (1 pkt) H — Hypertension (1 pkt) A₂ — Age ≥75 (2 pkt) D — Diabetes (1 pkt) S₂ — Stroke/TIA/zator (2 pkt) V — Vascular disease (1 pkt) A — Age 65-74 (1 pkt) Sc — Sex category (kobieta) (1 pkt)", "hint": "CHA₂DS₂-VASc ocenia ryzyko udaru w migotaniu przedsionków. Antykoagulanty wskazane przy ≥2 u mężczyzn i ≥3 u kobiet (płeć żeńska sama w sobie — 1 punkt, ale nieuwzględniana izolowanie).", "options": [{"letter": "136", "text": "Skala CHADS-VASc", "correct": false}], "correct_text": "CHA₂DS₂-VASc — szacuje ryzyko udaru u pacjentów z migotaniem przedsionków:Antykoagulacja: ≥2 pkt u mężczyzn, ≥3 pkt u kobiet.", "type": "reveal_with_options"}, {"text": "Wierzchołkowe ułożenie", "hint": "Ułożenie potylicowe (szczytowe) — norma: główka maksymalnie zgięta, punkt prowadzący — małe ciemiączko, przewodnik o obwodzie 32 cm. Ułatwia przejście przez kanał rodny.", "options": [{"letter": "137", "text": "Wierzchołkowe ułożenie", "correct": false}], "correct_text": "Ułożenie wierzchołkowe (potylicowe) — najczęstsze i fizjologiczne ułożenie płodu: główka mocno przygięta do klatki piersiowej, brodą do mostka, punkt prowadzący — ciemiączko tylne (potyliczne małe). Najmniejszy obwód główki przechodzącej przez kanał rodny (32 cm).", "type": "reveal_with_options"}], "Wiosna 2025": [{"text": "Łuk Riolana stanowi połączenie:", "hint": "Łuk Riolana = anastomoza między a. colica media (z SMA) a a. colica sinistra (z IMA). Ważna jako krążenie oboczne przy niedokrwieniu jelita.", "options": [{"letter": "A", "text": "tętnicy okrężniczej środkowej z tętnicą okrężniczą lewą", "correct": true}, {"letter": "B", "text": "tętnicy krezkowej górnej z tętnicami biodrowymi wewnętrznymi", "correct": false}, {"letter": "C", "text": "tętnicy okrężniczej lewej z tętnicą krezkową dolną", "correct": false}, {"letter": "D", "text": "tętnicy krezkowej dolnej z tętnicami biodrowymi", "correct": false}, {"letter": "E", "text": "tętnic biodrowych z tętnicą okrężniczą prawą", "correct": false}], "type": "single"}, {"text": "Klasyfikacja Querleu-Morrow odnosi się do:", "hint": "Querleu-Morrow (typy A-D) — nowoczesna klasyfikacja histerektomii radykalnej w raku szyjki macicy, zastąpiła klasyfikację Pivera-Rutledge'a.", "options": [{"letter": "A", "text": "cukrzycy przedciążowej", "correct": false}, {"letter": "B", "text": "cukrzycy ciężarnych", "correct": false}, {"letter": "C", "text": "cukrzycy typu III", "correct": false}, {"letter": "D", "text": "obniżenia narządu rodnego", "correct": false}, {"letter": "E", "text": "rodzajów histerektomii w ginekologii onkologicznej", "correct": true}], "type": "single"}, {"text": "Pacjent ma żółtaczkę, gorączkę do 38, ból w prawym podżebrzu, powyższe objawy sugerują (triada Charcota):", "hint": "Triada Charcota (żółtaczka + gorączka + ból w prawym podżebrzu) = ostre zapalenie dróg żółciowych. Z dodanym wstrząsem i splątaniem — pentada Reynoldsa.", "options": [{"letter": "A", "text": "ostre zapalenie pęcherzyka żólciowego", "correct": false}, {"letter": "B", "text": "kamica zółciowa", "correct": false}, {"letter": "C", "text": "ostre zapalenie dróg zółciowych", "correct": true}, {"letter": "D", "text": "ostre zapalenie wątroby", "correct": false}, {"letter": "E", "text": "stwardnienie dróg zólciowych", "correct": false}], "type": "single"}, {"text": "Mechanizm porodowy to zwroty wykonywane przez płód podczas przechodzenia przez kanał rodny:", "hint": "Mechanizm porodowy: przygięcie → zwrot wewnętrzny → odgięcie (urodzenie główki) → zwrot zewnętrzny (urodzenie barków).", "options": [{"letter": "A", "text": "przygięcie wewnętrzne, rotacja, odgięcie zewnętrzne, rotacja", "correct": false}, {"letter": "B", "text": "przygięcie, odgięcie, rotacja wewnętrzna, rotacja zewnętrzna", "correct": false}, {"letter": "C", "text": "przygięcie, rotacja wewnętrzna, odgięcie, rotacja zewnętrzna", "correct": true}, {"letter": "D", "text": "rotacja wewnętrzna, przygięcie, rotacja zewnętrzna, odgięcie", "correct": false}, {"letter": "E", "text": "odgięcie, przygięcie, rotacja wewnętrzna, rotacja zewnętrzna", "correct": false}], "type": "single"}, {"text": "Stwierdzenie objawu \"lambda\" w czasie badania USG pacjentki w ciąży ok. 9. tygodnia pozwala na rozpoznanie:", "hint": "Objaw „lambda\" (twin peak) = ciąża dwukosmówkowa (DCDA) E", "text": "INR 1,2", "correct": false}], "type": "single"}, {"text": "Wskazania do bariartycznych operacji (BMI):", "hint": "Chirurgia bariatryczna: BMI ≥40 (bez chorób towarzyszących) lub ≥35 z powikłaniami (cukrzyca t.2, OBS, NT). Nowe rekomendacje IFSO 2022 obniżają próg, ale klasyczna granica ≥40.", "options": [{"letter": "A", "text": "30", "correct": false}, {"letter": "B", "text": "35", "correct": false}, {"letter": "C", "text": "40", "correct": true}, {"letter": "D", "text": "45", "correct": false}, {"letter": "E", "text": "25", "correct": false}], "type": "single"}, {"text": "Szpiczak plazmocytowy (CRAB):", "hint": "Kryteria CRAB szpiczaka: Ca >2,75 mmol/l, kreatynina >2 mg/dl (lub CrCl <40), Hb <10 g/dl, zmiany kostne. Czyli punkty 2, 3, 5.", "items": ["stężenie wapnia skorygowanego > 2,5 mmol/l", "stężenie wapnia > 2,75 mmol/l", "kreatynina > 2 mg/dl", "kreatynina > 1,5 mg/dl", "hemoglobina <10 g/dl", "hemoglobina <11 g/dl"], "options": [{"letter": "A", "text": "1, 2, 3", "correct": false}, {"letter": "B", "text": "2, 4, 5", "correct": false}, {"letter": "C", "text": "2, 3, 5", "correct": true}, {"letter": "D", "text": "1, 2, 3, 4", "correct": false}, {"letter": "E", "text": "2, 3, 4, 5", "correct": false}, {"letter": "F", "text": "3, 4, 5, 6", "correct": false}, {"letter": "G", "text": "wszystkie wymienione", "correct": false}], "type": "single"}, {"text": "Dziecko (cukrzyca 1 typu) / hipoglikemia na wycieczce rowerowej poczuł osłabienie, stosuje insulinę, stracił przytomność, glukoza 66 mg/dl:", "hint": "Ciężka hipoglikemia z utratą przytomności poza szpitalem → glukagon i.m. (preferowane wg PALS/ISPAD 2022) lub s.c. — dawka: 0,5 mg dla <25 kg, 1 mg dla ≥25 kg. Alternatywa: glukagon donosowy (Baqsimi). NIGDY doustnie (aspiracja!). Po odzyskaniu przytomności → szybkie węglowodany p.o. + posiłek.", "options": [{"letter": "A", "text": "glukagon podskórnie", "correct": true}, {"letter": "B", "text": "glukagon dożylnie", "correct": false}, {"letter": "C", "text": "podać glukozę dożylnie", "correct": false}, {"letter": "D", "text": "podać doustnie pokarm zawierający 15 g glukozy", "correct": false}, {"letter": "E", "text": "wyzwać pogotowie", "correct": false}], "type": "single"}, {"text": "Jakie wczesne powikłanie po naczyniowych operacjach?", "hint": "Wczesne powikłania operacji naczyniowych: krwawienie, krwiak, zakrzepica. Tętniak rzekomy, zakażenie protezy — powikłania późne.", "options": [{"letter": "A", "text": "ropień", "correct": false}, {"letter": "B", "text": "krwiak", "correct": true}, {"letter": "C", "text": "tętniak rzekomy", "correct": false}, {"letter": "D", "text": "tętniak prawdziwy", "correct": false}, {"letter": "E", "text": "seroma", "correct": false}], "type": "single"}, {"text": "Zaznacz fałszywą odpowiedź dotyczącą stosowania żelaza:", "hint": "Taniny (herbata, kawa) i Ca POGARSZAJĄ wchłanianie żelaza. Witamina C poprawia. Fe²⁺ wchłania się lepiej niż Fe³⁺. Tetracykliny i Fe — chelaty, rozdzielać.", "options": [{"letter": "A", "text": "żelazo wchłania się w dwunastnicy, jelicie cienkim", "correct": false}, {"letter": "B", "text": "lepiej wchłania się Fe dwuwalentne", "correct": false}, {"letter": "C", "text": "między stosowaniem żelaza i tetracykliny odstęp czasowy około 4 h", "correct": false}, {"letter": "D", "text": "czarna herbata polepsza wchłanianie żelaza", "correct": true}, {"letter": "E", "text": "nie wolno stosować IPP i żelazo", "correct": false}], "type": "single"}, {"text": "Dziecko 5 lat, skarży się na bóle w nóżkach, nie chce iść do szkoły. Noc poprzedzająca - temperatura ciała 37. Na szyi - wybroczyny. Na nogach - krwawe podbiegnięcia:", "hint": "Bóle kostne + wybroczyny + siniaki u dziecka → podejrzenie ALL lub ITP. Pierwsze badanie — morfologia krwi z rozmazem (poszukiwanie blastów, małopłytkowości).", "options": [{"letter": "A", "text": "zgłosić na policję", "correct": false}, {"letter": "B", "text": "skierować do reumatologa", "correct": false}, {"letter": "C", "text": "morfol TG lędźwiowego odcinka kręgosłupa", "correct": false}, {"letter": "C", "text": "RM kręgosłupa", "correct": false}, {"letter": "D", "text": "PET", "correct": false}, {"letter": "E", "text": "TK", "correct": false}], "type": "single"}, {"text": "Dziecko we wstrząsie hipowolemicznym. Początek infuzyjnej terapii, bolus płynów, dawka?", "hint": "PALS: bolus krystaloidu 20 ml/kg w ciągu 5-20 min we wstrząsie hipowolemicznym u dzieci, powtarzać do 60 ml/kg. We wstrząsie septycznym — ostrożniej.", "options": [{"letter": "A", "text": "10 ml/kg", "correct": false}, {"letter": "B", "text": "20 ml/kg", "correct": true}, {"letter": "C", "text": "50 ml/kg", "correct": false}, {"letter": "D", "text": "100 ml/kg", "correct": false}, {"letter": "E", "text": "150 ml/kg", "correct": false}], "type": "single"}, {"text": "Dziecko 8 kg ma biegunkę. Jaką ilość płynów trzeba przetoczyć w ciągu doby?", "hint": "Holliday-Segar dla 8 kg = 100 ml/kg/dobę = 800 ml (podtrzymujące). Przy umiarkowanym odwodnieniu z biegunką → uzupełnienie niedoboru (~5-10% mc = 400-800 ml) + bieżące straty. Suma ~150-200 ml/kg/dobę = 1200-1600 ml. Bolus i.v.: 20 ml/kg krystaloid przy wstrząsie. Nawadnianie doustne (ORS) preferowane przy lekkim/umiarkowanym odwodnieniu.", "options": [{"letter": "A", "text": "1600 ml", "correct": true}, {"letter": "B", "text": "1000 ml", "correct": false}, {"letter": "C", "text": "800 ml", "correct": false}, {"letter": "D", "text": "500 ml", "correct": false}, {"letter": "E", "text": "600 ml", "correct": false}], "type": "single"}, {"text": "Pacjent z guzem chromochłonnym. Leczenie przedoperacyjne:", "hint": "Guz chromochłonny: najpierw blokada α (fenoksybenzamina 10 mg 2 ×/d lub doksazosyna 2-4 mg/d), następnie blokada β. Nigdy β-bloker jako pierwszy (ryzyko przełomu nadciśnieniowego)!", "options": [{"letter": "A", "text": "fenoksybenzamina 10 mg 2x/dobę", "correct": false}, {"letter": "B", "text": "doksazozyna 2 mg 1x dz. p.o", "correct": false}, {"letter": "C", "text": "fenoksybenzamina 20 mg 1x/dobę", "correct": false}, {"letter": "D", "text": "prawidłowe odpowiedzi A, B", "correct": true}, {"letter": "E", "text": "prawidłowe odpowiedzi B, C", "correct": false}], "type": "single"}, {"text": "Mężczyzna z nadwagą, w ciągu 3 mies. ma codzienną aktywność fizyczną, ćwiczy na siłowni. Stosuje ketodietę, jest w deficycie kalorii 500 kkal/dz, ale mimo tego nie może zredukować wagi. Wieczorem i w nocy ma powiększony apetyt (na tle stresowym). Co należy zaproponować, aby zredukować masę ciała?", "hint": "Semaglutyd (Wegovy) — agonista GLP-1, zmniejsza apetyt i masę ciała o ~15%. Przy otyłości opornej i hiperfagii (wieczornej) — lek pierwszego wyboru w Polsce.", "options": [{"letter": "A", "text": "semaglutyd", "correct": true}, {"letter": "B", "text": "orlistat", "correct": false}, {"letter": "C", "text": "metformina", "correct": false}, {"letter": "D", "text": "tirzepatyd", "correct": false}, {"letter": "E", "text": "kontynuacja diety, zwiększyć aktywność fizyczną", "correct": false}], "type": "single"}, {"text": "Celiakia — objawy:", "hint": "Celiakia jest wieloobjawowa: zahamowanie wzrostu, zaburzenia zachowania/depresja, osłabienie mięśni (hipoK, Mg), stolce tłuszczowe, opryszczkowate zapalenie skóry Duhringa, padaczka z patologicznym EEG. Wszystkie wymienione objawy są możliwe.", "items": ["zahamowanie wzrostu", "zaburzenia behawioralne i depresja", "osłabienie siły mięśniowej", "stolce tłuszczowe", "zmiany skórne", "nieprawidłowy zapis EEG"], "options": [{"letter": "A", "text": "1, 2, 3, 4", "correct": false}, {"letter": "B", "text": "4, 5, 6", "correct": false}, {"letter": "C", "text": "1, 3, 4", "correct": false}, {"letter": "D", "text": "1, 4, 5", "correct": false}, {"letter": "E", "text": "1, 2, 3, 4, 5", "correct": false}, {"letter": "F", "text": "2, 3, 4, 5", "correct": false}, {"letter": "G", "text": "wszystkie wymienione", "correct": true}], "type": "single"}, {"text": "Kobieta 39 lat, z rakiem trzustki (4 st) na paliatywnym leczeniu i noworozpoznaną cukrzycą na insulinie. Celowa HbA1C?", "hint": "PTD: przy leczeniu paliatywnym i krótkim oczekiwanym czasie życia cel HbA1c ≤8,0%. Najważniejsze — unikać objawowej hiperglikemii i hipoglikemii, nie dążyć do ścisłych celów.", "options": [{"letter": "A", "text": "6,5", "correct": false}, {"letter": "B", "text": "6", "correct": false}, {"letter": "C", "text": "7,5", "correct": false}, {"letter": "D", "text": "8", "correct": true}, {"letter": "E", "text": "7", "correct": false}], "type": "single"}, {"text": "Biegunka u dziecka:", "hint": "Ostra biegunka u dziecka — podstawą leczenia jest doustne nawadnianie (ORS). Antybiotyki tylko przy szczególnych zakażeniach (ciężka shigelloza, cholera, C. difficile).", "options": [{"letter": "A", "text": "wankomicyna", "correct": false}, {"letter": "B", "text": "nawadnianie doustne", "correct": true}, {"letter": "C", "text": "amoksycylina", "correct": false}, {"letter": "D", "text": "azytromycyna", "correct": false}, {"letter": "E", "text": "amoksycylina z kwasem klawulanowym", "correct": false}], "type": "single"}, {"text": "Rozpoczęcie porodu fizjologicznego:", "hint": "Początek porodu = regularne skurcze (≥1 na 10 min) + zmiany strukturalne szyjki (skrócenie + rozwarcie). Same skurcze lub samo odejście wód — to jeszcze nie poród.", "options": [{"letter": "A", "text": "regularna czynność skurczowa macicy w odstępach maksymalnie 10 min", "correct": false}, {"letter": "B", "text": "odejście wód płodowych", "correct": false}, {"letter": "C", "text": "czynność skurczowa macicy i skrócenie szyjki macicy 3 cm", "correct": false}, {"letter": "D", "text": "czynność skurczowa macicy", "correct": false}, {"letter": "E", "text": "regularna czynność skurczowa macicy w odstępach maksymalnie 10 min, skrócenie szyjki macicy, rozwarcie szyjki macicy", "correct": true}, {"letter": "F", "text": "regularna czynność skurczowa macicy w odstępach maksymalnie 3 min", "correct": false}], "type": "single"}, {"text": "Infekcja, która u facetów bezobjawowa, a u kobiet — upławy, pienista żółto-zielona wydzielina, dyspareunia. Na błonie śluzowej szyjki macicy — nadżerki i krostki:", "hint": "Trichomonas vaginalis: pieniste żółto-zielone upławy, „strawberry cervix\" (truskawkowa szyjka), u mężczyzn — często bezobjawowo. Leczenie — metronidazol u obojga partnerów.", "options": [{"letter": "A", "text": "waginoza bakteryjna", "correct": false}, {"letter": "B", "text": "rzeżączka", "correct": false}, {"letter": "C", "text": "rzęsistkowica", "correct": true}, {"letter": "D", "text": "kandydoza", "correct": false}, {"letter": "E", "text": "kiła", "correct": false}], "type": "single"}, {"text": "Niedźwięczne krótkie szmery oddechowe, wywoływane przez nagłe wyrównanie ciśnienia gazów pomiędzy dwoma obszarami płucnymi:", "hint": "Trzeszczenia (crepitations) = krótkie, niegłośne, na końcu wdechu — otwieranie się zapadniętych pęcherzyków/oskrzelików. Typowe przy obrzęku płuc, włóknieniu, zapaleniu płuc.", "options": [{"letter": "A", "text": "furczenie", "correct": false}, {"letter": "B", "text": "tarcie opłucnej", "correct": false}, {"letter": "C", "text": "trzeszczenia", "correct": true}, {"letter": "D", "text": "rzężenia", "correct": false}, {"letter": "E", "text": "świsty", "correct": false}], "type": "single"}, {"text": "Mężczyzna przygotowywał się do maratonu. Podczas treningu poczuł się źle, stracił przytomność. Stosuje leki na cukrzycę. W gazometrii: PH 7,1, niedobór zasad, ketonuria, glukoza 140. O przedawkowaniu jakiego leku to może świadczyć?", "hint": "Euglikemiczna kwasica ketonowa (pH↓, ciała ketonowe +, glikemia prawie prawidłowa) — typowa dla inhibitorów SGLT-2 (flozyn), zwłaszcza w stresie/wysiłku/głodzeniu.", "options": [{"letter": "A", "text": "metformina", "correct": false}, {"letter": "B", "text": "insulina", "correct": false}, {"letter": "C", "text": "flozyny", "correct": true}, {"letter": "D", "text": "glibenklamid", "correct": false}, {"letter": "E", "text": "glukozamina", "correct": false}], "type": "single"}, {"text": "Stopień klinicznego zaawansowania raka szyjki macicy można opisać wg skali:", "hint": "Rak szyjki macicy stopniowany jest wg FIGO (kliniczno-chirurgicznie od 2018) i TNM. POP-Q — dla obniżenia narządu rodnego.", "options": [{"letter": "A", "text": "TNM i FIGO", "correct": true}, {"letter": "B", "text": "FIGO i POP-Q", "correct": false}, {"letter": "C", "text": "tylko FIGO", "correct": false}, {"letter": "D", "text": "White, TNM, FIGO", "correct": false}, {"letter": "E", "text": "Grate, TNM, FIGO", "correct": false}], "type": "single"}, {"text": "Wczesnym objawem krzywicy u dziecka 4 mies. może być:", "hint": "Wczesne objawy krzywicy: kraniotabes (rozmiękanie potylicy, „ping-pong\"), pocenie się, niepokój, łysienie potyliczne. Deformacje kości kończyn — późne (po staniu).", "options": [{"letter": "A", "text": "rozmiękanie potylicy", "correct": true}, {"letter": "B", "text": "niedobór masy ciała", "correct": false}, {"letter": "C", "text": "deformacja klatki piersiowej", "correct": false}, {"letter": "D", "text": "opóźnione zarastanie ciemion", "correct": false}, {"letter": "E", "text": "zniekształcenia kości kończyn dolnych — koślawość, szpotawość", "correct": false}], "type": "single"}, {"text": "Patognomoniczny objaw idiopatycznego zwłóknienia płuc:", "hint": "IPF (UIP): „plastry miodu\" (honeycombing), trakcyjne rozstrzenie oskrzeli, podopłucnowo i przy podstawach na HRCT. Obraz UIP — patognomoniczny.", "options": [{"letter": "A", "text": "FEV1/FVC <70%", "correct": false}, {"letter": "B", "text": "\"plastry miodu\" na TK klatki piersiowej", "correct": true}, {"letter": "C", "text": "rozszerzenie przestrzeni powietrznych w płucach", "correct": false}, {"letter": "D", "text": "zacienienie przy dolnej części płuca", "correct": false}, {"letter": "E", "text": "guzy, nacieki", "correct": false}], "type": "single"}, {"text": "4 mies. dziecko choruje od 4 dni z gorączką do 38, po chwilowej poprawie ponownie skok temperatury, bez objawów zakażenia górnych dróg oddechowych, brak apetytu. RTG klp — norma. Rozpoznanie:", "hint": "Gorączka bez ogniska u niemowlęcia — zawsze wykluczać ZUM (najczęstsza przyczyna u dzieci do 2 lat). Wykonać badanie ogólne + posiew moczu.", "options": [{"letter": "A", "text": "gorączka trzydniowa", "correct": false}, {"letter": "B", "text": "ZUM", "correct": true}, {"letter": "C", "text": "zakażenie Enterowirusowe", "correct": false}, {"letter": "D", "text": "angina", "correct": false}, {"letter": "E", "text": "zapalenie ucha środkowego", "correct": false}], "type": "single"}, {"text": "CURB-65. Mężczyzna 67 lat z zaburzeniem świadomości (spłątanie). Mocznik, kreatynina — norma, BP 120/70, HR 75/min, RTG — podejrzenie zapalenia dolnego płata prawego płuca. Jaki przebieg i postępowanie?", "hint": "CURB-65: Confusion (+1) + wiek ≥65 (+1) = 2 punkty. 0-1 — leczenie ambulatoryjne, 2 — krótka hospitalizacja, ≥3 — ciężki przebieg, szpital/OIT.", "options": [{"letter": "A", "text": "ciężki przebieg, leczenie ambulatoryjne", "correct": false}, {"letter": "B", "text": "umiarkowany przebieg, leczenie szpitalne", "correct": true}, {"letter": "C", "text": "ciężki przebieg, leczenie szpitalne", "correct": false}, {"letter": "D", "text": "umiarkowany przebieg, leczenie ambulatoryjne", "correct": false}, {"letter": "E", "text": "przebieg łagodny, nie potrzebuje leczenia", "correct": false}], "type": "single"}, {"text": "APGAR. Dziecko — wiotkość mięśni, periodyczny oddech, tętno 80/min, skóra — zasinienie kończyn, reakcja — grymasa na cewnik. Ile punktów?", "hint": "APGAR: wiotkość (0) + nieregularny oddech (1) + HR 80 (1) + akrocyjanoza (1) + grymas (1) = 4 pkt. Umiarkowana zamartwica.", "options": [{"letter": "A", "text": "4", "correct": true}, {"letter": "B", "text": "0", "correct": false}, {"letter": "C", "text": "1", "correct": false}, {"letter": "D", "text": "8", "correct": false}, {"letter": "E", "text": "2", "correct": false}], "type": "single"}, {"text": "Nadgłośniowe zapalenie. Lekarz przyszedł na wizytę domową, dziecko choruje kilka dni — nie może połykać śliny, trudności z oddychaniem, obrzęk okolicy nadgłośniowej:", "hint": "Zapalenie nagłośni = stan nagły! Pilny transport z anestezjologiem (ryzyko niedrożności dróg oddechowych). NIE oglądać gardła szpatułką, NIE kłaść dziecka.", "options": [{"letter": "A", "text": "hospitalizacja karetką z anestezjologiem", "correct": true}, {"letter": "B", "text": "antybiotykoterapia", "correct": false}, {"letter": "C", "text": "otworzyć okno, żeby zmniejszyć temperaturę powietrza w pokoju", "correct": false}, {"letter": "D", "text": "inhalacja GKS przez nebulajzer", "correct": false}, {"letter": "E", "text": "skierować w szpital na oddział pulmonologiczny", "correct": false}], "type": "single"}, {"text": "Odruch Moro, prawda:", "hint": "Odruch Moro: zanika w 3-6 mies., wywoływany ostrym dźwiękiem lub szarpnięciem. Jednostronny = porażenie splotu ramiennego (Erba). Stwierdzenie 2 jest fałszywe (1-2 mies. zbyt wcześnie).", "items": ["zanika w 3-6 mies", "zanika w 1-2 mies", "wywołuje się jako reakcja na bodziec słuchowy", "jeżeli nie wygasa do 9 mies — porażenie piramidalne", "jednostronny — objaw porażenia splotu ramiennego z jednej strony"], "options": [{"letter": "A", "text": "1, 2, 4", "correct": false}, {"letter": "B", "text": "1, 3, 5", "correct": true}, {"letter": "C", "text": "2, 4, 5", "correct": false}, {"letter": "D", "text": "1, 2, 3, 5", "correct": false}, {"letter": "E", "text": "wszystkie odpowiedzi prawidłowe", "correct": false}], "type": "single"}, {"text": "Wskaż fałszywe stwierdzenie dotyczące rodzinnej polipowatości gruczolakowatej (FAP):", "hint": "FAP/zespół Gardnera: guzy desmoidalne (częściej krezki, po operacjach) — charakterystyczne (10-30%). Stwierdzenie D FAŁSZYWE. Gen APC, AD, rak brodawkowaty tarczycy, rak jelita grubego do 40. r.ż. = 100%.", "options": [{"letter": "A", "text": "u młodych robi się operacja Hartmana", "correct": false}, {"letter": "B", "text": "występuje zwiększona zachorowalność na raka brodawkowatego tarczycy", "correct": false}, {"letter": "C", "text": "dziedziczenie jest autosomalne i dominujące, mutacja dotyczy genu APC", "correct": false}, {"letter": "D", "text": "w jamie brzusznej nie tworzą się guzy desmoidalne", "correct": true}, {"letter": "E", "text": "w 4. dekadzie życia ryzyko rozwoju raka jelita grubego wynosi 100%", "correct": false}], "type": "single"}, {"text": "Maść z nitrogliceryną stosowana w proktologii? Leczenie czego?", "hint": "Maść z 0,2-0,4% nitrogliceryną rozluźnia zwieracz wewnętrzny odbytu → leczenie szczeliny odbytu. Alternatywa — diltiazem miejscowo.", "options": [{"letter": "A", "text": "hemoroidy", "correct": false}, {"letter": "B", "text": "ropień odbytu", "correct": false}, {"letter": "C", "text": "szczelina odbytu", "correct": true}, {"letter": "D", "text": "ostra niedokrwistość odbytu", "correct": false}, {"letter": "E", "text": "ostra niewydolność odbytu", "correct": false}], "type": "single"}, {"text": "Objaw Chwostka:", "hint": "Chvostek = uderzenie w n. facialis poniżej łuku jarzmowego → skurcz mięśni twarzy — utajona tężyczka/hipokalcemia. Opis B = objaw Trousseau (inny test na hipokalcemię).", "options": [{"letter": "A", "text": "utajona hipokalcemia (tężyczka), uderzenie młoteczkiem neurologicznym w nerw twarzowy tuż poniżej wyrostka jarzmowego", "correct": true}, {"letter": "B", "text": "3-minutowe ucinięcie ramienia mankietem ciśnieniomierza napompowanym do 20 mm Hg powyżej ciśnienia skurczowego", "correct": false}, {"letter": "C", "text": "uderzenie młoteczkiem neurologicznym w nerw strzałkowy wspólny", "correct": false}, {"letter": "D", "text": "skurcz mięśni wywołany zastosowaniem prądu galwanicznego o natężeniu <5 mA", "correct": false}], "type": "single"}, {"text": "Hiponatremia u pacjenta: stężenie sodu w surowicy 122 mmol/l, osmolalność osocza 225 mOsm/kg, osmolalność moczu 200 mOs/kg, stężenie sodu w moczu 50 mmol/l. Brak cech obrzęków, odwodnienia, hipowolemii. Normowolemia. Brak stosowania diuretyków:", "hint": "SIADH: hiponatremia + hipoosmia osocza + nieadekwatnie zagęszczony mocz (osm >100) + Na w moczu >20-40 + euwolemia + brak diuretyków. Wszystkie kryteria spełnione.", "options": [{"letter": "A", "text": "zespół mózgowej utraty soli", "correct": false}, {"letter": "B", "text": "SIADH", "correct": true}, {"letter": "C", "text": "polidypsja pierwotna", "correct": false}, {"letter": "D", "text": "zespół nerczycowy", "correct": false}, {"letter": "E", "text": "wymioty", "correct": false}], "type": "single"}, {"text": "Zespół metaboliczny. Według zaleceń PTD z 2019 roku, zwiększone ryzyko rozwoju cukrzycy typu 2 oraz zespołu metabolicznego wiąże się z obwodem talii przekraczającym:", "hint": "Obwód talii (PTD/IDF): ↑ryzyko M ≥94/K ≥80, bardzo ↑ ryzyko M ≥102/K ≥88. U mężczyzn zawsze wyższe progi. Zapamiętaj „94-80-102-88\".", "options": [{"letter": "A", "text": "dla mężczyzn ≥80 cm, dla kobiet ≥94 cm; bardzo wysokie ryzyko: dla mężczyzn ≥88 cm, dla kobiet ≥102 cm", "correct": false}, {"letter": "B", "text": "dla mężczyzn ≥88 cm, dla kobiet ≥102 cm; bardzo wysokie ryzyko: dla mężczyzn ≥80 cm, dla kobiet ≥94 cm", "correct": false}, {"letter": "C", "text": "dla mężczyzn ≥94 cm, dla kobiet ≥80 cm; bardzo wysokie ryzyko: dla mężczyzn ≥102 cm, dla kobiet ≥88 cm", "correct": true}, {"letter": "D", "text": "dla mężczyzn ≥88 cm, dla kobiet ≥80 cm; bardzo wysokie ryzyko: dla mężczyzn ≥102 cm, dla kobiet ≥94 cm", "correct": false}], "type": "single"}, {"text": "Jaki lek na nadciśnienie przeciwwskazany dla kobiety w ciąży:", "hint": "ACE-I, ARB, ARNI PRZECIWWSKAZANE w ciąży (teratogenne we wszystkich trymestrach). Bezpieczne: metyldopa, labetalol, nifedypina, hydralazyna.", "options": [{"letter": "A", "text": "kaptopril", "correct": true}, {"letter": "B", "text": "metyldopa", "correct": false}, {"letter": "C", "text": "nifedypyna", "correct": false}, {"letter": "D", "text": "labetalol", "correct": false}, {"letter": "E", "text": "amlodypyna", "correct": false}], "type": "single"}, {"text": "Ciężarna, pierwszy raz zgłosiła się do lekarza z glikemią na czczo 120 mg. Co robić?", "hint": "PTD 2024 — algorytm diagnostyki cukrzycy w ciąży: (1) glikemia na czczo <92 mg/dl → OGTT 24-28 tc.; (2) 92-125 mg/dl → niezwłocznie OGTT 75 g (jak tutaj: 120); (3) ≥126 mg/dl → potwierdzić drugim pomiarem → cukrzyca w ciąży (PGDM). Kryteria GDM w OGTT: na czczo 92-125 / 1h ≥180 / 2h 153-199 mg/dl (wystarczy jeden wynik poza normą).", "options": [{"letter": "A", "text": "rozpoznać cukrzycę i rozpocząć leczenie insuliną", "correct": false}, {"letter": "B", "text": "rozpoznać cukrzycę ciężarnej", "correct": false}, {"letter": "C", "text": "zrobić test OGTT 75 g glukozy w 24-28 t.c", "correct": false}, {"letter": "D", "text": "powtórzyć glikemię na czczo z krwi żylnej", "correct": false}, {"letter": "E", "text": "niezwłocznie zrobić test OGTT z 75 g glukozy", "correct": true}], "type": "single"}, {"text": "Kobieta po porodzie, trądzik, otyła, rozstępy na brzuchu, owłosienie w okolicy pleców. Pacjentka z próbą deksametazonu 1 mg, miała pomiar kortyzolu rano 30. Taktyka:", "hint": "Objawy Cushinga + nietłumiony kortyzol po 1 mg deksametazonu (>50 nmol/l / >1,8 μg/dl) → potwierdzenie hiperkortyzolemii → pilne skierowanie do endokrynologii w celu dalszej diagnostyki (ACTH, TK, MRI).", "options": [{"letter": "A", "text": "uspokoić i odpuścić z Bogiem", "correct": false}, {"letter": "B", "text": "skierowanie na oddział endokrynologii PILNE", "correct": true}, {"letter": "C", "text": "pilnie zrobić TK mózgu", "correct": false}, {"letter": "D", "text": "planowe skierowanie do poradni endokrynologicznej", "correct": false}], "type": "single"}, {"text": "Skala Tannera:", "hint": "Skala Tannera — stadia rozwoju płciowego (1-5): piersi i owłosienie łonowe u dziewcząt, narządy płciowe i owłosienie u chłopców. Określa „wiek płciowy\". Wiek kostny — wg Greulich-Pyle.", "options": [{"letter": "A", "text": "wspólna dla chłopców i dziewczynek", "correct": false}, {"letter": "B", "text": "określa kostny wiek dziecka", "correct": false}, {"letter": "C", "text": "określa wiek płciowy dziecka", "correct": true}, {"letter": "D", "text": "ocena zaburzenia dojrzewania płciowego u chłopców z zespołem Turnera", "correct": false}, {"letter": "E", "text": "wszystko wymienione", "correct": false}], "type": "single"}, {"text": "Przepuklina, jak leczyć chirurgicznie beznapięciowo:", "hint": "Plastyka beznapięciowa = metoda Lichtensteina (siatka syntetyczna). Bassini, Shouldice, Halsted, Girard — metody napięciowe (tissue repair).", "options": [{"letter": "A", "text": "metoda Bassiniego", "correct": false}, {"letter": "B", "text": "operacja Halsteda", "correct": false}, {"letter": "C", "text": "Lichtensteina", "correct": true}, {"letter": "D", "text": "Girarda", "correct": false}, {"letter": "E", "text": "Shouldice'a", "correct": false}], "type": "single"}, {"text": "TAPP – technika leczenia przepuklin:", "hint": "TAPP (Trans-Abdominal Pre-Peritoneal) i TEP (Total Extra-Peritoneal) — laparoskopowe metody beznapięciowe z siatką w przepuklinach pachwinowych.", "options": [{"letter": "A", "text": "laparoskopowa, napięciowa", "correct": false}, {"letter": "B", "text": "otwarta, napięciowa", "correct": false}, {"letter": "C", "text": "laparoskopowa, beznapięciowa", "correct": true}, {"letter": "D", "text": "otwarta, beznapięciowa", "correct": false}, {"letter": "E", "text": "endoskopowa, odbarczająca", "correct": false}], "type": "single"}, {"text": "Młody mężczyzna, bez przewlekłych chorób, zapalenie w okolicy szpary pośladkowej, bolesność, podczas badania brak wycieku ropnego:", "hint": "Torbiel włosowa (pilonidalna) — typowa u młodych mężczyzn w bruździe międzypośladkowej, bolesna. Bez wycieku ropnego = torbiel niepowikłana. Leczenie — wycięcie.", "options": [{"letter": "A", "text": "przetoka okołoodbytnicza", "correct": false}, {"letter": "B", "text": "ropień okołoodbytniczy (w fazie bez zapalenia)", "correct": false}, {"letter": "C", "text": "torbiel włosowa", "correct": true}, {"letter": "D", "text": "szczelina odbytu", "correct": false}, {"letter": "E", "text": "postać skórna wędrującego zapalenia jelita grubego", "correct": false}], "type": "single"}, {"text": "Która z poniższych nie przemawia za rozwojem czerniaka ze znamienia barwnikowego:", "hint": "ABCDE czerniaka: Asymmetry, Border irregular, Color varied, Diameter >6 mm, Evolution. Równomierny rozkład barwnika = cecha łagodna, przeciw czerniakowi.", "options": [{"letter": "A", "text": "powiększanie się rozmiarów znamienia", "correct": false}, {"letter": "B", "text": "krwawienie", "correct": false}, {"letter": "C", "text": "równomierny rozkład barwnika w przebarwieniu", "correct": true}, {"letter": "D", "text": "odczyn zapalny w obrębie znamienia", "correct": false}, {"letter": "E", "text": "owrzodzenie w obrębie zmiany barwnikowej", "correct": false}], "type": "single"}, {"text": "Klasyfikacja GOLD — jaka to jest ciężka obturacja za FEV1:", "hint": "GOLD: 1 (łagodna) ≥80%, 2 (umiarkowana) 50-79%, 3 (ciężka) 30-49%, 4 (bardzo ciężka) <30%. Zapamiętaj „80-50-30\".", "options": [{"letter": "A", "text": "FEV₁ < 30% wartości należnej", "correct": false}, {"letter": "B", "text": "FEV₁ 30–49% wartości należnej", "correct": true}, {"letter": "C", "text": "FEV₁ 50–79% wartości należnej", "correct": false}, {"letter": "D", "text": "FEV₁ ≥ 80% wartości należnej", "correct": false}, {"letter": "E", "text": "za pomocą FEV1 nie można wyznaczyć stopień obstrukcji", "correct": false}], "type": "single"}, {"text": "W jaki sposób rozpoznajemy bezdech senny?", "hint": "Polisomnografia — złoty standard rozpoznawania OBS (obejmuje EEG, EOG, EMG, EKG, przepływ powietrza, SpO2, ruchy oddechowe). Poligrafia — uproszczona wersja domowa.", "options": [{"letter": "A", "text": "polisomnografia", "correct": true}, {"letter": "B", "text": "poligrafia", "correct": false}, {"letter": "C", "text": "EEG", "correct": false}, {"letter": "D", "text": "obserwacja nocna w warunkach szpitalnych", "correct": false}, {"letter": "E", "text": "decybelografia przezprzełykowa", "correct": false}], "type": "single"}, {"text": "Zespół nerczycowy:", "hint": "Zespół nerczycowy: pienisty mocz (proteinuria >3,5 g/dobę), obrzęki twarzy/nóg, hipoalbuminemia, hiperlipidemia, kępki żółte. Mocz koloru „coca-cola\" = zespół nefrytyczny (krwiomocz).", "options": [{"letter": "A", "text": "pienisty mocz, żółte powieki, dyslipidemia, proteinuria, obrzęki na twarzy", "correct": true}, {"letter": "B", "text": "mocz koloru \"coca-cola\", żółte powieki, dyslipidemia, proteinuria, obrzęki", "correct": false}, {"letter": "C", "text": "mocz koloru \"popłuczyn mięsnych\", blade powieki, dyslipidemia, proteinuria", "correct": false}, {"letter": "D", "text": "pienisty mocz, nadciśnienie tętnicze, proteinuria, obrzęki płuc", "correct": false}, {"letter": "E", "text": "mocz koloru \"popłuczyn mięsnych\", nadciśnienie tętnicze, proteinemia", "correct": false}], "type": "single"}, {"text": "Kobieta 56 lat, menopauza, krwawienie po stosunku i suchość pochwy, endometrium 2 mm na USG, wizyty u ginekologa regularne, hormony norma, cytologia norma:", "hint": "Pomenopauzalnie + suchość + krwawienie po stosunku + endometrium 2 mm (norma <5 mm) + prawidłowa cytologia = atrofia pochwy (zapalenie zanikowe). Leczenie — estrogeny miejscowo.", "options": [{"letter": "A", "text": "zanik (atrofia) błony śluzowej pochwy", "correct": true}, {"letter": "B", "text": "rak trzonu macicy", "correct": false}, {"letter": "C", "text": "rak szyjki macicy", "correct": false}, {"letter": "D", "text": "rak jajnika", "correct": false}, {"letter": "E", "text": "rak pochwy", "correct": false}], "type": "single"}, {"text": "Chirurg podczas operacji wykonuje manewr Pringle'a. To polega na uciśnięciu:", "hint": "Manewr Pringle'a = zaciśnięcie lig. hepatoduodenale (zawiera a. hepatica, v. portae, ductus choledochus) → zatrzymanie krwawienia z wątroby. Maks. 15-20 min.", "options": [{"lett function saveProgress() {

    if (d.version !== 2) return null;
    return d;
  } catch(e) { return null; }
}

function clearProgress() {
  if (!confirm('Resetować postęp dla tej sesji?')) return;
  try { localStorage.removeItem(lsKey()); } catch(e) {}
  answerMap = {};
  document.getElementById('resumeBtn').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  updateSessionBadges();
  // Back to controls view
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
}

let saveTimer = null;
function flashSaved() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

// ─── Session selector ─────────────────────────────────────────────────────

function buildSessionGrid() {
  const grid = document.getElementById('sessionGrid');
  grid.innerHTML = '';

  const allCount = Object.values(SESSIONS).reduce((s, qs) => s + qs.length, 0);
  const allBtn = document.createElement('button');
  allBtn.className = 'session-btn all-btn';
  allBtn.dataset.session = '__all__';
  allBtn.onclick = () => selectSession('__all__');
  grid.appendChild(allBtn);

  for (const [name, qs] of Object.entries(SESSIONS)) {
    const btn = document.createElement('button');
    btn.className = 'session-btn';
    btn.dataset.session = name;
    btn.onclick = () => selectSession(name);
    grid.appendChild(btn);
  }
  updateSessionBadges();
}

function updateSessionBadges() {
  // Update counts and saved-progress indicators on session buttons
  const allCount = Object.values(SESSIONS).reduce((s, qs) => s + qs.length, 0);
  const allSaved = loadSavedForSession('__all__');
  const allBtn = document.querySelector('.all-btn');
  if (allBtn) {
    const prog = allSaved ? ` · ${allSaved.idx}/${allSaved.queueOrder.length}` : '';
    allBtn.innerHTML = `<div class="name">Wszystkie sesje</div><div class="count">${allCount} pytań${prog}</div>`;
  }
  for (const [name, qs] of Object.entries(SESSIONS)) {
    const btn = document.querySelector(`[data-session="${CSS.escape(name)}"]`);
    if (!btn) continue;
    const saved = loadSavedForSession(name);
    const prog = saved ? ` · ${saved.idx}/${saved.queueOrder.length}` : '';
    btn.innerHTML = `<div class="name">${name}</div><div class="count">${qs.length} pytań${prog}</div>`;
  }
}

function loadSavedForSession(name) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + name);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d.version === 2 ? d : null;
  } catch(e) { return null; }
}

function selectSession(name) {
  currentSession = name;
  document.querySelectorAll('.session-btn').forEach(b => {
    b.classList.toggle('active',
      b.dataset.session === name ||
      (name === '__all__' && b.classList.contains('all-btn')));
  });

  questions = name === '__all__'
    ? Object.values(SESSIONS).flat()
    : (SESSIONS[name] || []);

  document.getElementById('controls').style.display = 'flex';
  document.getElementById('qCount').textContent = questions.length + ' pytań';
  document.getElementById('wrongOnlyBtn').style.display = wrongQuestions.length ? 'block' : 'none';
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'none';

  // Show resume / reset if saved progress exists
  const saved = loadSaved();
  document.getElementById('resumeBtn').style.display = saved ? 'inline-block' : 'none';
  document.getElementById('resetBtn').style.display  = saved ? 'inline-block' : 'none';
  document.getElementById('startBtn').style.display  = 'inline-block';
}

// ─── Shuffle / wrong-only ─────────────────────────────────────────────────

function toggleShuffle() {
  shuffled = !shuffled;
  document.getElementById('shuffleBtn').classList.toggle('active', shuffled);
}

function toggleWrongOnly() {
  if (wrongQuestions.length) {
    questions = wrongQuestions;
    document.getElementById('qCount').textContent = questions.length + ' pytań (błędne)';
  }
}

// ─── Quiz start / resume ──────────────────────────────────────────────────

function startQuiz(qs) {
  const pool = qs || questions;
  queueOrder = pool.map((_, i) => i);  // original indices
  if (shuffled) queueOrder.sort(() => Math.random() - 0.5);
  queue = queueOrder.map(i => pool[i]);

  idx = 0;
  correct = 0; wrong = 0; skipped = 0;
  wrongQuestions = [];
  answerMap = {};
  answered = false;

  showQuizArea();
  showQuestion();
}

function resumeQuiz() {
  const saved = loadSaved();
  if (!saved) { startQuiz(); return; }

  queueOrder = saved.queueOrder;
  queue = queueOrder.map(i => questions[i]);
  idx = saved.idx;
  correct = saved.correct;
  wrong = saved.wrong;
  skipped = saved.skipped;
  answerMap = saved.answerMap || {};
  wrongQuestions = queue.filter((_, i) =>
    answerMap[i] === 'wrong' || answerMap[i] === 'unknown');

  answered = false;
  showQuizArea();
  showQuestion();
}

function showQuizArea() {
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  buildPagination();
}

// ─── Question display ─────────────────────────────────────────────────────

function showQuestion() {
  if (idx >= queue.length) { showResults(); return; }

  const q = queue[idx];
  answered = !!answerMap[idx];  // already answered if in map

  // Progress bar
  const pct = Math.round((idx / queue.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${idx + 1} / ${queue.length}`;
  updateScoreBadge();
  updatePagination();

  document.getElementById('qMeta').textContent = `Pytanie ${idx + 1}`;
  document.getElementById('qText').textContent = q.text;
  // Render numbered scenario items (K-type questions) as an ordered list
  const qItemsEl = document.getElementById('qItems');
  if (q.items && q.items.length) {
    const ol = document.createElement('ol');
    ol.className = 'q-items';
    q.items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      ol.appendChild(li);
    });
    qItemsEl.innerHTML = '';
    qItemsEl.appendChild(ol);
    qItemsEl.style.display = '';
  } else {
    qItemsEl.innerHTML = '';
    qItemsEl.style.display = 'none';
  }
  document.getElementById('qTypeBadge').innerHTML =
    q.type === 'multiple' ? '<span class="q-type-badge">Możliwe kilka odpowiedzi</span>' : '';

  renderOptions(q, answerMap[idx]);

  document.getElementById('hintBox').classList.remove('visible');
  document.getElementById('hintText').textContent = q.hint || '';

  // If coming back to already-answered question, show hint
  if (answered && q.hint) {
    document.getElementById('hintText').textContent = q.hint;
    document.getElementById('hintBox').classList.add('visible');
  }

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = !answered;

  // Scroll pagination button into view
  const pgBtn = document.getElementById('pg_' + idx);
  if (pgBtn) pgBtn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}

function renderOptions(q, savedAnswer) {
  const optDiv = document.getElementById('optionsDiv');
  optDiv.innerHTML = '';
  document.getElementById('revealAnswer').classList.remove('visible');
  document.getElementById('revealBtn').style.display = 'none';

  // Remove lingering known/unknown buttons
  document.querySelectorAll('.reveal-yn-btn').forEach(b => b.remove());

  if (q.type === 'reveal') {
    if (savedAnswer) {
      const ra = document.getElementById('revealAnswer');
      ra.textContent = q.correct_text || '';
      ra.classList.add('visible');
    } else {
      document.getElementById('revealBtn').style.display = 'block';
    }
    return;
  }

  if (q.type === 'reveal_with_options') {
    for (const opt of q.options) {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.disabled = true;
      btn.innerHTML = `<span class="letter">${opt.letter}</span><span class="opt-text">${escHtml(opt.text)}</span>`;
      optDiv.appendChild(btn);
    }
    if (savedAnswer) {
      const ra = document.getElementById('revealAnswer');
      ra.textContent = q.correct_text || '';
      ra.classList.add('visible');
    } else {
      document.getElementById('revealBtn').style.display = 'block';
    }
    return;
  }

  // Standard question
  for (const opt of q.options) {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter">${opt.letter}</span><span class="opt-text">${escHtml(opt.text)}</span>`;

    if (savedAnswer) {
      btn.disabled = true;
      if (opt.correct) btn.classList.add(savedAnswer === 'correct' ? 'correct' : 'reveal-correct');
      // Mark the wrong choice the user picked — we didn't store which letter, so just show correct
    } else {
      btn.onclick = () => selectOption(btn, opt, q);
    }
    optDiv.appendChild(btn);
  }
}

// ─── Answering ────────────────────────────────────────────────────────────

function selectOption(btn, opt, q) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  if (opt.correct) {
    btn.classList.add('correct');
    correct++;
    answerMap[idx] = 'correct';
  } else {
    btn.classList.add('wrong');
    wrong++;
    wrongQuestions.push(q);
    answerMap[idx] = 'wrong';
    allBtns.forEach(b => {
      const letter = b.querySelector('.letter').textContent;
      const matchOpt = q.options.find(o => o.letter === letter);
      if (matchOpt && matchOpt.correct) b.classList.add('reveal-correct');
    });
  }

  showHint(q);
  document.getElementById('nextBtn').disabled = false;
  updateScoreBadge();
  updatePagination();
  saveProgress();
}

function revealAnswer() {
  const q = queue[idx];
  answered = true;
  const ra = document.getElementById('revealAnswer');
  ra.textContent = q.correct_text || '';
  ra.classList.add('visible');
  document.getElementById('revealBtn').style.display = 'none';
  showHint(q);
  document.getElementById('nextBtn').disabled = false;

  // Known / not known buttons
  const hintBox = document.getElementById('hintBox');
  const yesBtn = document.createElement('button');
  yesBtn.className = 'ctrl-btn reveal-yn-btn';
  yesBtn.style.cssText = 'margin-top:8px;margin-right:8px';
  yesBtn.textContent = 'Znałem';
  yesBtn.onclick = () => {
    correct++; answerMap[idx] = 'known';
    updateScoreBadge(); updatePagination(); saveProgress();
    yesBtn.remove(); noBtn.remove();
  };
  const noBtn = document.createElement('button');
  noBtn.className = 'ctrl-btn reveal-yn-btn';
  noBtn.style.cssText = 'margin-top:8px';
  noBtn.textContent = 'Nie znałem';
  noBtn.onclick = () => {
    wrong++; wrongQuestions.push(q); answerMap[idx] = 'unknown';
    updateScoreBadge(); updatePagination(); saveProgress();
    yesBtn.remove(); noBtn.remove();
  };
  ra.after(yesBtn);
  yesBtn.after(noBtn);
}

function showHint(q) {
  if (q.hint) {
    document.getElementById('hintText').textContent = q.hint;
    document.getElementById('hintBox').classList.add('visible');
  }
}

// ─── Navigation ───────────────────────────────────────────────────────────

function navigate(dir) {
  if (dir === 1) {
    if (!answered) { skipped++; answerMap[idx] = answerMap[idx] || 'skipped'; }
    saveProgress();
    idx++;
    answered = false;
    showQuestion();
  } else {
    if (idx > 0) { idx--; answered = !!answerMap[idx]; showQuestion(); }
  }
}

function skipQuestion() {
  if (!answered) { skipped++; answerMap[idx] = 'skipped'; }
  saveProgress();
  idx++;
  answered = false;
  showQuestion();
}

function jumpToQuestion(i) {
  saveProgress();
  idx = i;
  answered = !!answerMap[idx];
  showQuestion();
  document.getElementById('questionCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── Score & UI updates ───────────────────────────────────────────────────

function updateScoreBadge() {
  const total = correct + wrong;
  const badge = document.getElementById('scoreBadge');
  badge.textContent = `${correct} / ${total}`;
  badge.className = 'score-badge' + (total > 0 && correct / total >= 0.7 ? ' good' : '');
}

// ─── Pagination ───────────────────────────────────────────────────────────

function buildPagination() {
  const grid = document.getElementById('paginationGrid');
  grid.innerHTML = '';
  for (let i = 0; i < queue.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'pg-btn';
    btn.id = 'pg_' + i;
    btn.textContent = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    grid.appendChild(btn);
  }
  updatePagination();
}

function updatePagination() {
  for (let i = 0; i < queue.length; i++) {
    const btn = document.getElementById('pg_' + i);
    if (!btn) continue;
    btn.className = 'pg-btn';
    const state = answerMap[i];
    if (i === idx) btn.classList.add('pg-current');
    else if (state === 'correct' || state === 'known') btn.classList.add('pg-correct');
    else if (state === 'wrong'   || state === 'unknown') btn.classList.add('pg-wrong');
    else if (state === 'skipped') btn.classList.add('pg-skipped');
  }
}

// ─── Results ──────────────────────────────────────────────────────────────

function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  saveProgress();
  updateSessionBadges();

  const answered_count = correct + wrong;
  const pct = answered_count > 0 ? Math.round(correct / answered_count * 100) : 0;
  document.getElementById('resPct').textContent = pct + '%';
  document.getElementById('resDetail').textContent =
    `${answered_count} pytań odpowiedziano, ${skipped} pominięto`;
  document.getElementById('resBreakdown').innerHTML = `
    <div class="breakdown-item"><div class="val green">${correct}</div><div class="lbl">Poprawnie</div></div>
    <div class="breakdown-item"><div class="val red">${wrong}</div><div class="lbl">Błędnie</div></div>
    <div class="breakdown-item"><div class="val grey">${skipped}</div><div class="lbl">Pominięto</div></div>
  `;
}

function restartQuiz() {
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('resultsArea').style.display = 'none';
  startQuiz(questions);
}

function restartWrong() {
  if (!wrongQuestions.length) return;
  startQuiz(wrongQuestions);
}

// ─── Utilities ────────────────────────────────────────────────────────────

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

buildSessionGrid();
</script>
</body>
</html>
